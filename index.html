<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="隨身旅圖">
    <meta name="theme-color" content="#090b0e" id="meta-theme-color">
    <title>環球慢活隨身旅圖</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="secure_data.js"></script>
    <style>

        :root,
        :root[data-theme="dark"] {
            --bg-app: #090b0e;
            --bg-elevated: rgba(15, 19, 26, 0.94);
            --bg-dock: #0e1219;
            --bg-card: #131720;
            --bg-card-alt: #1a202c;
            --bg-pill: #222938;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);
            --text-primary: #f4f6f9;
            --text-secondary: #a4aebd;
            --text-muted: #6c7787;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.25);
            --accent-soft: rgba(245, 158, 11, 0.15);
            --sky: #38bdf8;
            --sky-soft: rgba(56, 189, 248, 0.14);
            --emerald: #34d399;
            --emerald-soft: rgba(52, 211, 153, 0.14);
            --danger: #f87171;
            --danger-soft: rgba(248, 113, 113, 0.14);
            --cta-bg: #f4f6f9;
            --cta-text: #090b0e;
            --hero-grad: linear-gradient(145deg, #1b2230 0%, #11151e 58%, #1d1813 100%);
            --flight-grad: linear-gradient(155deg, #161d29 0%, #0f131b 100%);
            --shadow-card: 0 8px 22px rgba(0, 0, 0, 0.32);
        }

        :root[data-theme="paper"] {
            --bg-app: #f8f5ef;
            --bg-elevated: rgba(248, 245, 239, 0.96);
            --bg-dock: #ffffff;
            --bg-card: #ffffff;
            --bg-card-alt: #f2ece1;
            --bg-pill: #eae2d4;
            --border-subtle: #e5ddd0;
            --border-strong: #d3c7b4;
            --text-primary: #262019;
            --text-secondary: #5a4b3b;
            --text-muted: #8a7c69;
            --accent: #b15b2c;
            --accent-glow: rgba(177, 91, 44, 0.2);
            --accent-soft: rgba(177, 91, 44, 0.12);
            --sky: #0284c7;
            --sky-soft: rgba(2, 132, 199, 0.11);
            --emerald: #1f7a54;
            --emerald-soft: rgba(31, 122, 84, 0.12);
            --danger: #b83b2b;
            --danger-soft: rgba(184, 59, 43, 0.11);
            --cta-bg: #2e261e;
            --cta-text: #ffffff;
            --hero-grad: linear-gradient(145deg, #ffffff 0%, #f5efe4 100%);
            --flight-grad: linear-gradient(155deg, #ffffff 0%, #f4efe6 100%);
            --shadow-card: 0 6px 18px rgba(92, 77, 60, 0.06);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-app);
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Inter', sans-serif;
            line-height: 1.52;
            -webkit-font-smoothing: antialiased;
        }

        .tabular-nums { font-variant-numeric: tabular-nums; }
        .mono { font-family: 'JetBrains Mono', 'Inter', monospace; }

        /* 固定頂部 + 固定底部導覽列 + 原生文件捲動（避免 iOS 100dvh 與 fixed/sticky 疊層裁切） */
        .app-shell {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 auto;
            background-color: var(--bg-app);
            position: relative;
        }

        .app-topbar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: calc(var(--topbar-h, 54px) + env(safe-area-inset-top, 0px));
            padding: env(safe-area-inset-top, 0px) 14px 0;
            background: var(--bg-elevated);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            z-index: 220;
        }

        .topbar-left {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
        }

        .topbar-kicker {
            font-size: 0.62rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 1.1px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-heading {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.04rem;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .icon-pill-btn {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 5px 9px;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
        }
        .icon-pill-btn:active { transform: scale(0.95); }

        .app-canvas {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            padding-top: calc(var(--topbar-h, 54px) + env(safe-area-inset-top, 0px) + 10px);
            padding-left: 14px;
            padding-right: 14px;
            padding-bottom: calc(var(--dock-h, 54px) + env(safe-area-inset-bottom, 0px) + 18px);
        }

        .view {
            display: none;
            width: 100%;
            max-width: 100%;
            animation: viewFade 0.18s ease;
        }
        .view.active { display: block; }

        @keyframes viewFade {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 底部滿版導覽列：緊貼螢幕最底與 Home Indicator Safe Area */
        .bottom-dock {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: calc(var(--dock-h, 54px) + env(safe-area-inset-bottom, 0px));
            padding: 5px 4px env(safe-area-inset-bottom, 0px);
            background: var(--bg-dock);
            border-top: 1px solid var(--border-subtle);
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            align-items: center;
            z-index: 220;
        }

        .b-tab {
            border: none;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 2px 0;
            color: var(--text-muted);
            cursor: pointer;
            min-width: 0;
        }

        .b-tab-icon {
            width: 36px;
            height: 22px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.16s ease, color 0.16s ease;
        }

        .b-tab-icon svg { width: 18px; height: 18px; stroke-width: 2; }
        .b-tab-label { font-size: 0.65rem; font-weight: 700; white-space: nowrap; line-height: 1.15; }
        .b-tab.active { color: var(--accent); }
        .b-tab.active .b-tab-icon { background: var(--accent-soft); color: var(--accent); }
        .b-tab.active .b-tab-label { font-weight: 900; }

        /* 次級分段控制 */
        .segmented-bar {
            display: flex;
            width: 100%;
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 3px;
            gap: 3px;
            margin-bottom: 12px;
            position: sticky;
            top: calc(var(--topbar-h, 54px) + env(safe-area-inset-top, 0px));
            z-index: 90;
        }

        .seg-btn {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.74rem;
            font-weight: 700;
            padding: 7px 4px;
            border-radius: 9px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .seg-btn.active {
            background: var(--bg-card);
            color: var(--text-primary);
            font-weight: 900;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.16);
        }

        .sub-pane { display: none; width: 100%; }
        .sub-pane.active { display: block; animation: viewFade 0.16s ease; }

        /* Hero & Dashboard */
        .hero-banner {
            width: 100%;
            background: var(--hero-grad);
            border: 1px solid var(--border-strong);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 11px;
            box-shadow: var(--shadow-card);
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            max-width: 100%;
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 3px 9px;
            border-radius: 999px;
            margin-bottom: 7px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hero-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.2rem;
            font-weight: 900;
            line-height: 1.32;
            margin: 0 0 10px;
            color: var(--text-primary);
            overflow-wrap: anywhere;
        }

        .countdown-box {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .countdown-num {
            font-family: 'Inter', sans-serif;
            font-size: 1.42rem;
            font-weight: 900;
            color: var(--accent);
            line-height: 1.1;
        }

        .cta-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 11px 12px;
            background: var(--cta-bg);
            color: var(--cta-text);
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .cta-btn:active { transform: scale(0.98); }

        /* Flighty 風格航空卡片（防窄螢幕擠壓版） */
        .flighty-card {
            width: 100%;
            background: var(--flight-grad);
            border: 1px solid var(--border-strong);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 11px;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }

        .flighty-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--sky), var(--accent));
        }

        .flighty-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 11px;
        }

        .flighty-badge-group {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .flighty-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-primary);
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            padding: 2px 7px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .flighty-status {
            font-size: 0.63rem;
            font-weight: 800;
            letter-spacing: 0.4px;
            padding: 3px 8px;
            border-radius: 999px;
            background: var(--sky-soft);
            color: var(--sky);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .flighty-airports {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 8px;
            margin-bottom: 11px;
        }

        .airport-col { min-width: 0; }
        .airport-col.right { text-align: right; }

        .iata-code {
            font-family: 'Inter', sans-serif;
            font-size: clamp(1.28rem, 5.2vw, 1.62rem);
            font-weight: 900;
            letter-spacing: -0.4px;
            line-height: 1.08;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .airport-city {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .flight-arc-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            min-width: 66px;
            flex-shrink: 0;
        }

        .flight-track {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--sky);
        }

        .flight-line {
            flex: 1;
            height: 2px;
            background: repeating-linear-gradient(90deg, var(--border-strong) 0, var(--border-strong) 3px, transparent 3px, transparent 6px);
        }
        .flight-line.solid { background: linear-gradient(90deg, var(--sky), var(--accent)); }

        .flight-duration-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .flighty-times {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 11px;
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            margin-bottom: 8px;
        }

        .time-block { display: flex; flex-direction: column; min-width: 0; }
        .time-block.right { text-align: right; }
        .time-label { font-size: 0.6rem; font-weight: 800; color: var(--text-muted); letter-spacing: 0.4px; }
        .time-val { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 800; color: var(--text-primary); }

        .flighty-footer {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-secondary);
        }


        .flighty-airline-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-top: -5px;
            margin-bottom: 9px;
            font-size: 0.68rem;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .flighty-airline-name {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .adsb-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            padding: 2px 6px;
            border-radius: 5px;
            background: rgba(16, 185, 129, 0.14);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.28);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .adsb-badge.loading {
            background: var(--sky-soft);
            color: var(--sky);
            border-color: rgba(56, 189, 248, 0.28);
        }

        .airport-icao {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.61rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .airport-fullname {
            font-size: 0.62rem;
            color: var(--text-muted);
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .adsb-sync-btn {
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-alt);
            color: var(--sky);
            font-size: 0.68rem;
            font-weight: 800;
            padding: 4px 9px;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .adsb-sync-btn:active { transform: scale(0.96); }

        /* Bento Grid */
        .bento-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
            margin-bottom: 11px;
        }

        .bento-tile {
            min-width: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 15px;
            padding: 11px 12px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            text-align: left;
        }

        .bento-label {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .bento-val {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bento-sub {
            font-size: 0.68rem;
            color: var(--text-secondary);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .panel-card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 17px;
            padding: 13px 14px;
            margin-bottom: 11px;
            box-shadow: var(--shadow-card);
        }

        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .panel-title { font-size: 0.85rem; font-weight: 800; color: var(--text-primary); min-width: 0; }
        .panel-link { font-size: 0.74rem; font-weight: 700; color: var(--accent); cursor: pointer; white-space: nowrap; flex-shrink: 0; }

        /* 單日分頁導覽條：緊貼固定 Topbar 下方 */
        .day-tab-strip {
            position: sticky;
            top: calc(var(--topbar-h, 54px) + env(safe-area-inset-top, 0px));
            z-index: 95;
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding: 6px 2px 8px;
            margin-top: -2px;
            margin-bottom: 6px;
            background: var(--bg-app);
            border-bottom: 1px solid var(--border-subtle);
            scrollbar-width: none;
        }
        .day-tab-strip::-webkit-scrollbar { display: none; }

        .day-tab-btn {
            flex: 0 0 auto;
            min-width: 60px;
            padding: 6px 10px;
            border-radius: 13px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            text-align: center;
            cursor: pointer;
        }

        .day-tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .dp-day { font-family: 'Inter', sans-serif; font-size: 0.76rem; font-weight: 900; display: block; line-height: 1.2; }
        .dp-date { font-size: 0.62rem; opacity: 0.88; display: block; margin-top: 1px; }

        .day-page { display: none; width: 100%; }
        .day-page.active { display: block; animation: viewFade 0.18s ease; }

        .day-hero-card {
            width: 100%;
            background: var(--hero-grad);
            border: 1px solid var(--border-strong);
            border-radius: 17px;
            padding: 14px 15px;
            margin-bottom: 11px;
            box-shadow: var(--shadow-card);
        }

        .day-hero-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 5px;
        }

        .day-kicker {
            font-family: 'Inter', sans-serif;
            font-size: 0.71rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 0.4px;
        }

        .day-weather-pill {
            font-size: 0.69rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .day-card-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.1rem;
            font-weight: 900;
            margin: 0;
            color: var(--text-primary);
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .day-card-sub {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 4px;
            overflow-wrap: anywhere;
        }

        .day-stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 9px;
            padding-top: 9px;
            border-top: 1px dashed var(--border-subtle);
        }

        .callout-box {
            width: 100%;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.79rem;
            margin-bottom: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            overflow-wrap: anywhere;
        }
        .callout-alert { background: var(--danger-soft); border-color: rgba(248, 113, 113, 0.3); color: var(--text-primary); }
        .callout-story { font-family: 'Noto Serif TC', serif; border-left: 3px solid var(--accent); line-height: 1.65; }

        /* Timeline */
        .timeline-wrap {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 17px;
            padding: 13px 12px;
            margin-bottom: 11px;
            box-shadow: var(--shadow-card);
        }

        .timeline-item { display: flex; gap: 9px; margin-bottom: 10px; width: 100%; }
        .timeline-item:last-child { margin-bottom: 0; }
        .timeline-axis { width: 14px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; position: relative; }
        .timeline-node { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 12px; box-shadow: 0 0 0 3px var(--accent-soft); z-index: 2; }
        .timeline-node.kind-move { background: var(--sky); box-shadow: 0 0 0 3px var(--sky-soft); }
        .timeline-node.kind-stay { background: var(--emerald); box-shadow: 0 0 0 3px var(--emerald-soft); }
        .timeline-stem { width: 2px; flex: 1; background: var(--border-subtle); position: absolute; top: 20px; bottom: -10px; }
        .timeline-item:last-child .timeline-stem { display: none; }

        .slot-card {
            flex: 1;
            min-width: 0;
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            border-radius: 13px;
            padding: 10px 11px;
        }
        .slot-card.is-transit { border-left: 3px solid var(--sky); }
        .slot-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
        .slot-time { font-family: 'JetBrains Mono', monospace; font-size: 0.77rem; font-weight: 800; color: var(--accent); }
        .slot-title { font-size: 0.91rem; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; line-height: 1.35; overflow-wrap: anywhere; }
        .slot-desc { font-size: 0.79rem; color: var(--text-secondary); line-height: 1.5; overflow-wrap: anywhere; }

        .pill-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 5px; }
        .mini-pill { font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-secondary); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mini-pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
        .mini-pill.sky { background: var(--sky-soft); color: var(--sky); border-color: transparent; }
        .mini-pill.green { background: var(--emerald-soft); color: var(--emerald); border-color: transparent; }

        .map-chip {
            text-decoration: none;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-primary);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 3px 8px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .hotel-strip {
            width: 100%;
            margin-bottom: 11px;
            padding: 11px 13px;
            border-radius: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.81rem;
            font-weight: 800;
            box-shadow: var(--shadow-card);
        }
        .hotel-strip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .day-pager {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-top: 4px;
        }

        .pager-btn {
            min-width: 0;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 10px 10px;
            font-size: 0.77rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: var(--shadow-card);
        }
        .pager-btn:disabled { opacity: 0.35; cursor: default; }

        .overview-card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 15px;
            padding: 12px 13px;
            margin-bottom: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: var(--shadow-card);
        }

        .hotel-item { padding: 10px 0; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .hotel-item:last-child { border-bottom: none; padding-bottom: 0; }

        /* POI & Filters */
        .search-input {
            width: 100%;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 11px;
            padding: 9px 11px;
            font-size: 0.81rem;
            font-weight: 600;
            margin-bottom: 8px;
            outline: none;
        }
        .search-input:focus { border-color: var(--accent); }

        .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 7px; margin-bottom: 4px; scrollbar-width: none; }
        .filter-row::-webkit-scrollbar { display: none; }
        .filter-chip { border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text-secondary); font-size: 0.72rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #ffffff; }

        .poi-card { width: 100%; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 15px; padding: 12px 13px; margin-bottom: 9px; box-shadow: var(--shadow-card); }
        .poi-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 5px; }
        .poi-name { font-size: 0.93rem; font-weight: 800; color: var(--text-primary); min-width: 0; overflow-wrap: anywhere; }

        /* Tools */
        .input-control, .select-control { min-width: 0; background: var(--bg-card-alt); color: var(--text-primary); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 9px 10px; font-size: 0.88rem; font-weight: 700; }
        .quick-add-row { display: flex; flex-wrap: wrap; gap: 5px; margin: 9px 0 11px; }
        .step-btn { border: 1px solid var(--border-subtle); background: var(--bg-card-alt); color: var(--text-primary); font-size: 0.71rem; font-weight: 700; padding: 4px 8px; border-radius: 7px; cursor: pointer; }
        .fx-result-box { background: var(--bg-card-alt); border-left: 4px solid var(--accent); border-radius: 11px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .fx-amount { font-family: 'Inter', sans-serif; font-size: 1.2rem; font-weight: 900; color: var(--accent); }
        .budget-line { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--border-subtle); font-size: 0.81rem; }
        .budget-line:last-child { border-bottom: none; }

        .progress-track { height: 7px; border-radius: 999px; background: var(--bg-card-alt); overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 999px; transition: width 0.25s ease; }

        .check-row { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 10px 12px; margin-bottom: 7px; display: flex; align-items: center; gap: 9px; cursor: pointer; }
        .check-box { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--text-muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.72rem; font-weight: 900; }
        .check-row.checked .check-box { background: var(--accent); border-color: var(--accent); color: #ffffff; }
        .check-row.checked .check-text { text-decoration: line-through; color: var(--text-muted); }

        /* 6 位數 PIN 鎖屏（讀取 secure_data.js 解密） */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-app);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
        }

        .pin-dots { display: flex; gap: 15px; margin-bottom: 26px; }
        .pin-dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--text-muted); transition: all 0.15s ease; }
        .pin-dot.filled { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
        .pin-dot.error { background: var(--danger); border-color: var(--danger); }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 264px; }
        .key-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .key-btn:active { border-color: var(--accent); color: var(--accent); transform: scale(0.93); }
        .key-btn.empty, .key-btn.del { background: transparent; border-color: transparent; color: var(--text-secondary); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.35s ease; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div style="font-size: 2rem; margin-bottom: 10px;">🔐</div>
    <div style="font-family: 'Noto Serif TC', serif; font-size: 1.22rem; font-weight: 900; margin-bottom: 4px;">輸入 6 位數通行碼</div>
    <div id="auth-msg" style="font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 22px; min-height: 20px;">行程資料已加密保護 (secure_data.js)</div>

    <div class="pin-dots" id="pin-dots">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    </div>

    <div class="keypad">
        <div class="key-btn" onclick="pressKey('1')">1</div><div class="key-btn" onclick="pressKey('2')">2</div><div class="key-btn" onclick="pressKey('3')">3</div>
        <div class="key-btn" onclick="pressKey('4')">4</div><div class="key-btn" onclick="pressKey('5')">5</div><div class="key-btn" onclick="pressKey('6')">6</div>
        <div class="key-btn" onclick="pressKey('7')">7</div><div class="key-btn" onclick="pressKey('8')">8</div><div class="key-btn" onclick="pressKey('9')">9</div>
        <div class="key-btn empty"></div><div class="key-btn" onclick="pressKey('0')">0</div><div class="key-btn del" onclick="pressKey('del')">⌫</div>
    </div>
</div>

<div class="app-shell">

    <header class="app-topbar" id="app-topbar">
        <div class="topbar-left">
            <span id="meta-sub" class="topbar-kicker">TRAVEL COMPASS</span>
            <span id="topbar-title" class="topbar-heading">旅程看板</span>
        </div>
        <div class="topbar-actions">
            <button id="theme-toggle-btn" class="icon-pill-btn" onclick="toggleTheme()">☀️ 米色</button>
            <button id="topbar-action-btn" class="icon-pill-btn" onclick="handleTopAction()">🔒 鎖定</button>
        </div>
    </header>

    <main class="app-canvas" id="app-canvas">
        <div id="dashboard" class="view active"></div>
        <div id="itinerary" class="view"></div>
        <div id="flights" class="view"></div>

        <div id="explore" class="view">
            <div class="segmented-bar">
                <button class="seg-btn active" id="seg-theme" onclick="switchSubPane('explore', 'theme')">✨ 主題絕景</button>
                <button class="seg-btn" id="seg-poi" onclick="switchSubPane('explore', 'poi')">☕ 美食與咖啡</button>
            </div>
            <div id="theme" class="sub-pane active"></div>
            <div id="poi" class="sub-pane">
                <input type="search" id="poi-search-input" class="search-input" placeholder="🔍 搜尋店名、特色或關鍵字..." oninput="renderPOIList()">
                <div class="filter-row" id="poi-cat-filters"></div>
                <div class="filter-row" id="poi-area-filters"></div>
                <div id="poi-list"></div>
            </div>
        </div>

        <div id="tools" class="view">
            <div class="segmented-bar">
                <button class="seg-btn active" id="seg-money" onclick="switchSubPane('tools', 'money')">💱 匯率</button>
                <button class="seg-btn" id="seg-checklist" onclick="switchSubPane('tools', 'checklist')">✅ 行李</button>
                <button class="seg-btn" id="seg-logistics" onclick="switchSubPane('tools', 'logistics')">☀️ 筆記</button>
                <button class="seg-btn" id="seg-emergency" onclick="switchSubPane('tools', 'emergency')">🛡️ 應變</button>
            </div>

            <div id="money" class="sub-pane active">
                <div class="panel-card">
                    <div class="panel-head">
                        <span class="panel-title">💱 即時匯率換算</span>
                        <span id="rate-status" class="tabular-nums" style="font-size: 0.7rem; color: var(--text-muted); font-weight: 700;">參考匯率</span>
                    </div>
                    <div style="display: flex; gap: 7px;">
                        <select id="currency-selector" class="select-control" style="flex: 1;">
                            <option value="jpy">🇯🇵 JPY</option>
                            <option value="thb">🇹🇭 THB</option>
                            <option value="eur">🇪🇺 EUR</option>
                            <option value="gbp">🇬🇧 GBP</option>
                            <option value="usd">🇺🇸 USD</option>
                            <option value="isk">🇮🇸 ISK</option>
                            <option value="idr">🇮🇩 IDR</option>
                            <option value="myr">🇲🇾 MYR</option>
                            <option value="sgd">🇸🇬 SGD</option>
                        </select>
                        <input type="number" inputmode="decimal" id="foreign-amount" class="input-control tabular-nums" placeholder="輸入外幣" style="flex: 2;">
                    </div>
                    <div class="quick-add-row">
                        <button type="button" class="step-btn tabular-nums" onclick="addAmount(100)">+100</button>
                        <button type="button" class="step-btn tabular-nums" onclick="addAmount(500)">+500</button>
                        <button type="button" class="step-btn tabular-nums" onclick="addAmount(1000)">+1,000</button>
                        <button type="button" class="step-btn tabular-nums" onclick="addAmount(5000)">+5,000</button>
                        <button type="button" class="step-btn" onclick="clearAmount()" style="color: var(--danger);">清除</button>
                    </div>
                    <div class="fx-result-box">
                        <span style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary);">約合台幣 TWD</span>
                        <span class="fx-amount tabular-nums">NT$ <span id="twd-result">0</span></span>
                    </div>
                </div>
                <div id="budget-render"></div>
            </div>

            <div id="checklist" class="sub-pane">
                <div class="panel-card">
                    <div class="panel-head" style="margin-bottom: 7px;">
                        <span class="panel-title">行前準備進度</span>
                        <span id="chk-label" class="tabular-nums" style="font-size: 0.82rem; font-weight: 900; color: var(--accent);">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar-fill" id="chk-fill"></div>
                    </div>
                </div>
                <div id="chk-list"></div>
            </div>

            <div id="logistics" class="sub-pane"></div>
            <div id="emergency" class="sub-pane"></div>
        </div>
    </main>

    <nav class="bottom-dock" id="bottom-dock">
        <button class="b-tab active" data-tab="dashboard" onclick="switchTab('dashboard')">
            <div class="b-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></div>
            <span class="b-tab-label">看板</span>
        </button>
        <button class="b-tab" data-tab="itinerary" onclick="switchTab('itinerary')">
            <div class="b-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
            <span class="b-tab-label">行程</span>
        </button>
        <button class="b-tab" data-tab="flights" onclick="switchTab('flights')">
            <div class="b-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></div>
            <span class="b-tab-label">票宿</span>
        </button>
        <button class="b-tab" data-tab="explore" onclick="switchTab('explore')">
            <div class="b-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
            <span class="b-tab-label">探索</span>
        </button>
        <button class="b-tab" data-tab="tools" onclick="switchTab('tools')">
            <div class="b-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></div>
            <span class="b-tab-label">工具</span>
        </button>
    </nav>

</div>

<script>
    function syncChromeHeights() {
        const topbar = document.getElementById('app-topbar');
        const dock = document.getElementById('bottom-dock');
        if (topbar) {
            const h = Math.round(topbar.getBoundingClientRect().height);
            if (h > 0) document.documentElement.style.setProperty('--topbar-h', `${h}px`);
        }
        if (dock) {
            const h = Math.round(dock.getBoundingClientRect().height);
            if (h > 0) document.documentElement.style.setProperty('--dock-h', `${h}px`);
        }
    }

    window.addEventListener('DOMContentLoaded', syncChromeHeights);
    window.addEventListener('resize', syncChromeHeights);
    window.addEventListener('orientationchange', () => setTimeout(syncChromeHeights, 150));

    function applySavedTheme() {
        const saved = localStorage.getItem('trip_ui_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        const metaTheme = document.getElementById('meta-theme-color');
        if (metaTheme) metaTheme.setAttribute('content', saved === 'dark' ? '#090b0e' : '#f8f5ef');
        const btn = document.getElementById('theme-toggle-btn');
        if (btn) btn.innerText = saved === 'dark' ? '☀️ 米色' : '🌙 暗黑';
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'paper' : 'dark';
        localStorage.setItem('trip_ui_theme', next);
        applySavedTheme();
    }

    applySavedTheme();

    let globalData = null;
    let tripDiffDays = 0;
    let activeDayNum = null;
    let itineraryOverviewMode = false;
    let poiAreaFilter = '全部地區';
    let poiCategoryFilter = '全部';
    const offlineRates = { isk: 0.235, eur: 34.80, gbp: 40.50, jpy: 0.207, usd: 32.50, thb: 0.90, idr: 0.002, myr: 6.80, sgd: 23.80 };
    let currentRate = 0;
    let currentMainTab = 'dashboard';
    let checkedItems = JSON.parse(localStorage.getItem('tripChecklist_v9')) || [];

    const TAB_TITLES = {
        dashboard: '旅程看板',
        itinerary: '每日行程',
        flights: '航班與住宿',
        explore: '探索絕景與美食',
        tools: '隨身工具箱'
    };

    const SUB_TO_PARENT = {
        theme: 'explore', poi: 'explore',
        money: 'tools', checklist: 'tools', logistics: 'tools', emergency: 'tools'
    };

    function bootSystem() {
        const sub = (globalData.trip_meta && globalData.trip_meta.subtitle) || 'TRAVEL COMPASS';
        document.getElementById('meta-sub').innerText = sub;

        const days = globalData.itinerary || [];
        if (days.length > 0 && (!activeDayNum || !days.some(d => d.day === activeDayNum))) {
            activeDayNum = days[0].day;
        }

        calculateDiff();
        renderItinerary(days);
        renderFlights(globalData.flights_and_hotels || { flights: [], hotels: [] });
        enrichAllFlightsWithAdsbdb(false);
        renderLogistics(globalData.logistics || { items: [], alerts: [] });
        renderBudget(globalData.budget || { regions: [] });
        renderTheme(globalData.theme_guide || []);
        initPOI(globalData.poi_database || []);
        renderChecklist(globalData.checklist_items || []);
        renderEmergency(globalData.emergency || { guides: [] });
        initCurrencyWidget((globalData.trip_meta && globalData.trip_meta.currency) || 'jpy');
        updateTopbarContext(currentMainTab);
        syncChromeHeights();
    }

    function switchTab(id) {
        if (SUB_TO_PARENT[id]) {
            const parent = SUB_TO_PARENT[id];
            switchTab(parent);
            switchSubPane(parent, id);
            return;
        }
        currentMainTab = id;
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.b-tab').forEach(b => b.classList.remove('active'));
        const targetView = document.getElementById(id);
        if (targetView) targetView.classList.add('active');
        const targetBtn = document.querySelector(`.b-tab[data-tab="${id}"]`);
        if (targetBtn) targetBtn.classList.add('active');
        updateTopbarContext(id);
        syncChromeHeights();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchSubPane(parentId, paneId) {
        const parentEl = document.getElementById(parentId);
        if (!parentEl) return;
        parentEl.querySelectorAll('.sub-pane').forEach(p => p.classList.remove('active'));
        parentEl.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        const targetPane = document.getElementById(paneId);
        const targetSeg = document.getElementById(`seg-${paneId}`);
        if (targetPane) targetPane.classList.add('active');
        if (targetSeg) targetSeg.classList.add('active');
    }

    function selectDayTab(dayNum) {
        activeDayNum = dayNum;
        itineraryOverviewMode = false;
        updateTopbarContext('itinerary');

        document.querySelectorAll('.day-tab-btn').forEach(btn => {
            btn.classList.toggle('active', Number(btn.dataset.day) === Number(dayNum));
        });

        const activeBtn = document.querySelector(`.day-tab-btn[data-day="${dayNum}"]`);
        if (activeBtn) {
            activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        document.querySelectorAll('.day-page').forEach(page => {
            page.classList.toggle('active', Number(page.dataset.day) === Number(dayNum));
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function calculateDiff() {
        if (!globalData.itinerary || globalData.itinerary.length === 0) {
            document.getElementById('dashboard').innerHTML = '<div class="panel-card">尚未建立行程資料。</div>';
            return;
        }
        const rawDate = globalData.itinerary[0].date_full;
        if (rawDate) {
            const start = new Date(rawDate);
            if (!isNaN(start.getTime())) {
                const today = new Date();
                start.setHours(0, 0, 0, 0);
                today.setHours(0, 0, 0, 0);
                tripDiffDays = Math.ceil((start - today) / (1000 * 60 * 60 * 24));
            } else {
                tripDiffDays = 0;
            }
        } else {
            tripDiffDays = 0;
        }
        renderDashboard();
    }

    function getChecklistPct() {
        const items = (globalData && globalData.checklist_items) || [];
        if (items.length === 0) return '0%';
        const validChecked = checkedItems.filter(i => items.includes(i)).length;
        return Math.round((validChecked / items.length) * 100) + '%';
    }

        if (f.aircraft_reg) return sanitizeCallsign(f.aircraft_reg);
        if (f.reg) return sanitizeCallsign(f.reg);
        if (f.icao24) return sanitizeCallsign(f.icao24);

        const regMatch = note.match(/\b([A-Z]{1,2}-[A-Z0-9]{3,5}|JA[0-9]{3,4}[A-Z]{0,2}|HL[0-9]{4}|N[0-9]{1,5}[A-Z]{0,2})\b/);

    }

    function calcGreatCircleStats(lat1, lon1, lat2, lon2) {
        if ([lat1, lon1, lat2, lon2].some(v => typeof v !== 'number' || isNaN(v))) return null;
        const R = 6371;
        const toRad = d => d * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        const km = Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        if (km <= 0) return null;
        const estMins = Math.round((km / 820) * 60 + 30);
        const h = Math.floor(estMins / 60);
        const m = estMins % 60;
        return { km, estMins, estDuration: h > 0 ? `~${h}h ${m}m` : `~${m}m` };
    }

    function formatIsoToLocalHHMM(isoOrStr) {
        if (!isoOrStr) return '';
        const s = String(isoOrStr).trim();
        const directMatch = s.match(/(?:T|\s)(\d{2}:\d{2})/);
        if (directMatch) return directMatch[1];
        const hhmmMatch = s.match(/^(\d{1,2}:\d{2})$/);
        if (hhmmMatch) return hhmmMatch[1].padStart(5, '0');
        return '';
    }

    function extractAllTimesFromText(str) {
        if (!str) return [];
        const matches = String(str).match(/\b([01]?\d|2[0-3]):[0-5]\d(?:\s*\+\d)?\b/g);
        return matches ? matches.map(t => t.replace(/\s+/g, '')) : [];
    }

    function parseDurationToMins(durStr) {
        if (!durStr) return 0;
        const s = String(durStr);
        const hm = s.match(/(\d+)\s*h(?:ours?|r)?\s*(\d+)?/i);
        if (hm) return parseInt(hm[1], 10) * 60 + (hm[2] ? parseInt(hm[2], 10) : 0);
        const zhHm = s.match(/(\d+)\s*小時\s*(\d+)?/);
        if (zhHm) return parseInt(zhHm[1], 10) * 60 + (zhHm[2] ? parseInt(zhHm[2], 10) : 0);
        return 0;
    }

    function estimateArrivalWithTimezone(depHHMM, durationMins, depTz, arrTz) {
        if (!depHHMM || !durationMins) return '';
        const m = depHHMM.match(/^(\d{1,2}):(\d{2})/);
        if (!m) return '';
        const depMins = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
        let tzShiftMins = 0;
        if (typeof depTz === 'number' && !isNaN(depTz) && typeof arrTz === 'number' && !isNaN(arrTz)) {
            tzShiftMins = Math.round((arrTz - depTz) * 60);
        }
        let total = depMins + durationMins + tzShiftMins;
        let dayOffset = 0;
        while (total >= 1440) { total -= 1440; dayOffset += 1; }
        while (total < 0) { total += 1440; dayOffset -= 1; }
        const hh = String(Math.floor(total / 60)).padStart(2, '0');
        const mm = String(total % 60).padStart(2, '0');
        const suffix = dayOffset > 0 ? `+${dayOffset}` : (dayOffset < 0 ? `${dayOffset}` : '');
        return `~${hh}:${mm}${suffix}`;
    }

    function normalizeAdsbAirport(ap) {
        if (!ap) return null;
        const iata = String(ap.iata_code || '').toUpperCase();
        const ref = AIRPORT_REF_DB[iata];
        const lat = Number(ap.latitude);
        const lon = Number(ap.longitude);
        return {
            iata,
            icao: ap.icao_code || ref?.icao || '',
            name: ap.name || ref?.name || '',
            city: ap.municipality || ref?.city || '',
            lat: !isNaN(lat) ? lat : ref?.lat,
            lon: !isNaN(lon) ? lon : ref?.lon,
            tz: ref ? ref.tz : (!isNaN(lon) ? Math.round(lon / 15) : null)
        };
    }

    async function queryAdsbdbForFlight(f, forceRefresh = false) {
        const callsign = sanitizeCallsign(f.flight_no);
        const reg = extractRegOrHex(f);
        if (!callsign && !reg) return null;

        const cacheKey = `${callsign}|${reg}`;
        const cached = adsbdbMemoryCache[cacheKey];
        if (!forceRefresh && cached && (Date.now() - cached.ts < ADSBDB_TTL_MS)) {
            return cached.data;
        }
        if (adsbdbInFlight[cacheKey]) return adsbdbInFlight[cacheKey];

        adsbdbInFlight[cacheKey] = (async () => {
            const result = {
                matchedRoute: false,
                airlineName: '',
                airlineIcao: '',
                airlineCallsign: '',
                origin: null,
                midpoint: null,
                destination: null,
                airportsByIata: {},
                aircraftType: '',
                aircraftManufacturer: ''
            };

            try {
                if (callsign) {
                    const res = await fetch(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(callsign)}`);
                    if (res.ok) {
                        const json = await res.json();
                        const fr = json?.response?.flightroute;
                        if (fr) {
                            result.matchedRoute = true;
                            if (fr.airline) {
                                result.airlineName = fr.airline.name || '';
                                result.airlineIcao = fr.airline.icao || '';
                                result.airlineCallsign = fr.airline.callsign || '';
                            }
                            result.origin = normalizeAdsbAirport(fr.origin);
                            result.midpoint = normalizeAdsbAirport(fr.midpoint);
                            result.destination = normalizeAdsbAirport(fr.destination);

                            [result.origin, result.midpoint, result.destination].forEach(ap => {
                                if (ap && ap.iata) result.airportsByIata[ap.iata] = ap;
                            });
                        }
                    }

                    if (!result.airlineName) {
                        const prefixMatch = callsign.match(/^([A-Z]{2,3})[0-9]/);
                        if (prefixMatch) {
                            const aRes = await fetch(`https://api.adsbdb.com/v0/airline/${encodeURIComponent(prefixMatch[1])}`);
                            if (aRes.ok) {
                                const aJson = await aRes.json();
                                const al = Array.isArray(aJson?.response) ? aJson.response[0] : aJson?.response;
                                if (al) {
                                    result.airlineName = al.name || '';
                                    result.airlineIcao = al.icao || '';
                                    result.airlineCallsign = al.callsign || '';
                                }
                            }
                        }
                    }
                }

                if (reg) {
                    const acRes = await fetch(`https://api.adsbdb.com/v0/aircraft/${encodeURIComponent(reg)}`);
                    if (acRes.ok) {
                        const acJson = await acRes.json();
                        const ac = acJson?.response?.aircraft;
                        if (ac) {
                            result.aircraftType = ac.type || '';
                            result.aircraftManufacturer = ac.manufacturer || '';
                        }
                    }
                }
            } catch (err) {
                // 離線狀態自動靜默降級
            } finally {
                delete adsbdbInFlight[cacheKey];
            }

            adsbdbMemoryCache[cacheKey] = { ts: Date.now(), data: result };
            saveAdsbdbCache();
            return result;
        })();

        return adsbdbInFlight[cacheKey];
    }

    async function queryLiveScheduleForFlight(f, forceRefresh = false) {
        const callsign = sanitizeCallsign(f.flight_no);
        if (!callsign) return null;

        const cfg = getLiveApiConfig();
        const provider = cfg.provider || 'airlabs';
        const apiKey = (cfg.apiKey || '').trim();
        if (!apiKey) return null;

        const routeStr = f.route || '';
        const iataMatches = routeStr.match(/\b[A-Z]{3}\b/g);
        const wantDep = (f.dep_code || (iataMatches && iataMatches[0]) || '').toUpperCase();
        const wantArr = (f.arr_code || (iataMatches && iataMatches[1]) || '').toUpperCase();

        const cacheKey = `${provider}|${callsign}|${wantDep}-${wantArr}|${f.date || ''}`;
        const cached = liveSchedMemoryCache[cacheKey];
        if (!forceRefresh && cached && (Date.now() - cached.ts < LIVE_SCHED_TTL_MS)) {
            return cached.data;
        }
        if (liveSchedInFlight[cacheKey]) return liveSchedInFlight[cacheKey];

        liveSchedInFlight[cacheKey] = (async () => {
            let liveResult = null;
            try {
                if (provider === 'airlabs') {
                    const schedParams = new URLSearchParams({ flight_iata: callsign, api_key: apiKey });
                    if (wantDep) schedParams.set('dep_iata', wantDep);
                    if (wantArr) schedParams.set('arr_iata', wantArr);
                    const schedRes = await fetch(`https://airlabs.co/api/v9/schedules?${schedParams.toString()}`);
                    let r = null;
                    if (schedRes.ok) {
                        const sJson = await schedRes.json();
                        const list = Array.isArray(sJson?.response) ? sJson.response : [];
                        r = list.find(item =>
                            (!wantDep || String(item.dep_iata || '').toUpperCase() === wantDep) &&
                            (!wantArr || String(item.arr_iata || '').toUpperCase() === wantArr)
                        ) || list[0] || null;
                    }
                    if (!r) {
                        const fRes = await fetch(`https://airlabs.co/api/v9/flight?flight_iata=${encodeURIComponent(callsign)}&api_key=${encodeURIComponent(apiKey)}`);
                        if (fRes.ok) {
                            const fJson = await fRes.json();
                            const cand = fJson?.response;
                            if (cand && (!wantDep || String(cand.dep_iata || '').toUpperCase() === wantDep) && (!wantArr || String(cand.arr_iata || '').toUpperCase() === wantArr)) {
                                r = cand;
                            }
                        }
                    }
                    if (r && (r.dep_time || r.arr_time)) {
                        liveResult = {
                            provider: 'AirLabs LIVE',
                            depTime: formatIsoToLocalHHMM(r.dep_actual || r.dep_estimated || r.dep_time),
                            arrTime: formatIsoToLocalHHMM(r.arr_actual || r.arr_estimated || r.arr_time),
                            depTerminal: r.dep_terminal || '',
                            arrTerminal: r.arr_terminal || '',
                            depGate: r.dep_gate || '',
                            arrGate: r.arr_gate || '',
                            status: r.status || '',
                            durationMins: Number(r.duration) || 0,
                            aircraftIcao: r.aircraft_icao || '',
                            regNumber: r.reg_number || ''
                        };
                    }
                } else if (provider === 'aviationstack') {
                    const params = new URLSearchParams({ access_key: apiKey, flight_iata: callsign, limit: '10' });
                    if (wantDep) params.set('dep_iata', wantDep);
                    if (wantArr) params.set('arr_iata', wantArr);
                    const res = await fetch(`https://api.aviationstack.com/v1/flights?${params.toString()}`);
                    if (res.ok) {
                        const json = await res.json();
                        const list = Array.isArray(json?.data) ? json.data : [];
                        const r = list.find(item =>
                            (!wantDep || String(item.departure?.iata || '').toUpperCase() === wantDep) &&
                            (!wantArr || String(item.arrival?.iata || '').toUpperCase() === wantArr)
                        ) || list[0] || null;
                        if (r && (r.departure || r.arrival)) {
                            liveResult = {
                                provider: 'AviationStack LIVE',
                                depTime: formatIsoToLocalHHMM(r.departure?.actual || r.departure?.estimated || r.departure?.scheduled),
                                arrTime: formatIsoToLocalHHMM(r.arrival?.actual || r.arrival?.estimated || r.arrival?.scheduled),
                                depTerminal: r.departure?.terminal || '',
                                arrTerminal: r.arrival?.terminal || '',
                                depGate: r.departure?.gate || '',
                                arrGate: r.arrival?.gate || '',
                                status: r.flight_status || '',
                                durationMins: 0,
                                aircraftIcao: r.aircraft?.icao || '',
                                regNumber: r.aircraft?.registration || ''
                            };
                        }
                    }
                } else if (provider === 'aerodatabox') {
                    const dateMatch = String(f.date || '').match(/(\d{4}-\d{2}-\d{2})/);
                    const targetDate = dateMatch ? dateMatch[1] : new Date().toISOString().slice(0, 10);
                    const url = `https://aerodatabox.p.rapidapi.com/flights/number/${encodeURIComponent(callsign)}/${targetDate}`;
                    const res = await fetch(url, {
                        headers: {
                            'X-RapidAPI-Key': apiKey,
                            'X-RapidAPI-Host': 'aerodatabox.p.rapidapi.com'
                        }
                    });
                    if (res.ok) {
                        const json = await res.json();
                        const list = Array.isArray(json) ? json : [];
                        const r = list.find(item =>
                            (!wantDep || String(item.departure?.airport?.iata || '').toUpperCase() === wantDep) &&
                            (!wantArr || String(item.arrival?.airport?.iata || '').toUpperCase() === wantArr)
                        ) || list[0] || null;
                        if (r && (r.departure || r.arrival)) {
                            liveResult = {
                                provider: 'AeroDataBox LIVE',
                                depTime: formatIsoToLocalHHMM(r.departure?.revisedTime?.local || r.departure?.scheduledTime?.local),
                                arrTime: formatIsoToLocalHHMM(r.arrival?.revisedTime?.local || r.arrival?.scheduledTime?.local),
                                depTerminal: r.departure?.terminal || '',
                                arrTerminal: r.arrival?.terminal || '',
                                depGate: r.departure?.gate || '',
                                arrGate: r.arrival?.gate || '',
                                status: r.status || '',
                                durationMins: 0,
                                aircraftIcao: r.aircraft?.model || '',
                                regNumber: r.aircraft?.reg || ''
                            };
                        }
                    }
                }
            } catch (e) {
                liveResult = null;
            } finally {
                delete liveSchedInFlight[cacheKey];
            }

            if (liveResult) {
                liveSchedMemoryCache[cacheKey] = { ts: Date.now(), data: liveResult };
                saveLiveSchedCache();
            }
            return liveResult;
        })();

        return liveSchedInFlight[cacheKey];
    }

    async function enrichAllFlightsWithAdsbdb(forceRefresh = false) {

    function resolveAirportEndpoint(iataCode, adsb) {
        const code = String(iataCode || '').toUpperCase();
        const adsbAp = adsb?.airportsByIata?.[code] || null;
        const refAp = AIRPORT_REF_DB[code] || null;
        if (!adsbAp && !refAp) return null;
        return {
            iata: code,
            icao: adsbAp?.icao || refAp?.icao || '',
            name: adsbAp?.name || refAp?.name || '',
            city: adsbAp?.city || refAp?.city || '',
            lat: typeof adsbAp?.lat === 'number' && !isNaN(adsbAp.lat) ? adsbAp.lat : refAp?.lat,
            lon: typeof adsbAp?.lon === 'number' && !isNaN(adsbAp.lon) ? adsbAp.lon : refAp?.lon,
            tz: refAp ? refAp.tz : (typeof adsbAp?.tz === 'number' ? adsbAp.tz : null)
        };
    }

    function parseFlightMeta(f) {
        const routeStr = f.route || '';
        const timeStr = f.time || '';
        const iataMatches = routeStr.match(/\b[A-Z]{3}\b/g);
        const parts = routeStr.split(/➔|->|→|—|-|至/).map(s => s.trim()).filter(Boolean);

        const callsign = sanitizeCallsign(f.flight_no);
        const reg = extractRegOrHex(f);
        const cachedEntry = adsbdbMemoryCache[`${callsign}|${reg}`];
        const adsb = cachedEntry ? cachedEntry.data : null;

        const depCode = (f.dep_code || (iataMatches && iataMatches[0]) || adsb?.origin?.iata || (parts[0] ? parts[0].slice(0, 4) : 'DEP')).toUpperCase();
        const arrCode = (f.arr_code || (iataMatches && iataMatches[1]) || adsb?.destination?.iata || (parts[1] ? parts[1].slice(0, 4) : 'ARR')).toUpperCase();

        const cfg = getLiveApiConfig();
        const liveEntry = liveSchedMemoryCache[`${cfg.provider || 'airlabs'}|${callsign}|${depCode}-${arrCode}|${f.date || ''}`];
        const live = liveEntry ? liveEntry.data : null;

        const depEndpoint = resolveAirportEndpoint(depCode, adsb);
        const arrEndpoint = resolveAirportEndpoint(arrCode, adsb);

        const parsedDepCity = f.dep_city || (parts[0] ? parts[0].replace(depCode, '').replace(/[()]/g, '').trim() : '');
        const parsedArrCity = f.arr_city || (parts[1] ? parts[1].replace(arrCode, '').replace(/[()]/g, '').trim() : '');

        const depCity = parsedDepCity || depEndpoint?.city || depCode;
        const arrCity = parsedArrCity || arrEndpoint?.city || arrCode;

        const legStats = (depEndpoint && arrEndpoint)
            ? calcGreatCircleStats(depEndpoint.lat, depEndpoint.lon, arrEndpoint.lat, arrEndpoint.lon)
            : null;

        const extractedTimes = [
            ...extractAllTimesFromText(timeStr),
            ...extractAllTimesFromText(f.note)
        ];
        let depTime = live?.depTime || f.dep_time || extractedTimes[0] || '';
        let arrTime = live?.arrTime || f.arr_time || extractedTimes[1] || '';

        const knownDurMins = parseDurationToMins(f.duration) || live?.durationMins || legStats?.estMins || 0;
        let arrIsEstimated = false;
        if (depTime && !arrTime && knownDurMins > 0) {
            arrTime = estimateArrivalWithTimezone(
                depTime,
                knownDurMins,
                depEndpoint?.tz,
                arrEndpoint?.tz
            );
            arrIsEstimated = Boolean(arrTime);
        }

        if (!depTime) depTime = '--:--';
        if (!arrTime) arrTime = '--:--';

        const terminalLabel = f.terminal || [
            live?.depTerminal ? `T${live.depTerminal}` : '',
            live?.arrTerminal ? `T${live.arrTerminal}` : ''
        ].filter(Boolean).join(' ➔ ');

        const gateLabel = [
            live?.depGate ? `登機門 ${live.depGate}` : '',
            live?.arrGate ? `抵達門 ${live.arrGate}` : ''
        ].filter(Boolean).join(' · ');

        const isFifthFreedomLeg = Boolean(
            adsb && adsb.matchedRoute &&
            (adsb.origin?.iata !== depCode || adsb.destination?.iata !== arrCode) &&
            (adsb.airportsByIata[depCode] || adsb.airportsByIata[arrCode])
        );

        return {
            flightNo: f.flight_no || 'FLIGHT',
            callsign,
            date: f.date || '',
            depCode,
            arrCode,
            depCity,
            arrCity,
            depIcao: depEndpoint?.icao || '',
            arrIcao: arrEndpoint?.icao || '',
            depFullName: depEndpoint?.name || '',
            arrFullName: arrEndpoint?.name || '',
            depTime,
            arrTime,
            arrIsEstimated,
            liveSource: live?.provider || '',
            liveStatus: live?.status || '',
            duration: f.duration || (live?.durationMins ? `${Math.floor(live.durationMins / 60)}h ${live.durationMins % 60}m` : '') || legStats?.estDuration || 'DIRECT',
            distanceKm: legStats?.km || null,
            isFifthFreedomLeg,
            fullRouteHint: isFifthFreedomLeg && adsb?.origin?.iata && adsb?.destination?.iata
                ? `全航線 ${adsb.origin.iata}→${adsb.midpoint?.iata ? adsb.midpoint.iata + '→' : ''}${adsb.destination.iata}`
                : '',
            airlineName: f.airline || adsb?.airlineName || '',
            airlineIcao: adsb?.airlineIcao || '',
            airlineCallsign: adsb?.airlineCallsign || '',
            aircraftType: f.aircraft || live?.aircraftIcao || (adsb?.aircraftType ? `${adsb.aircraftManufacturer} ${adsb.aircraftType}`.trim() : ''),
            adsbMatched: Boolean(live || (adsb && (adsb.matchedRoute || adsb.airlineName || adsb.aircraftType))),
            adsbPending: !adsb && !live && Boolean(callsign),
            terminal: terminalLabel,
            gate: gateLabel,
            seat: f.seat || '',
            pnr: f.pnr || '',
            note: f.note || ''
        };
    }

    function getMoveIcon(t) {
        if (!t) return '🚗';
        const txt = t.toLowerCase();
        if (txt.includes('walk') || txt.includes('步行')) return '🚶';
        if (txt.includes('flight') || txt.includes('機')) return '✈️';
        if (txt.includes('ferry') || txt.includes('渡輪') || txt.includes('船')) return '⛴️';
        if (txt.includes('bus') || txt.includes('巴士') || txt.includes('專車')) return '🚌';
        if (txt.includes('jr') || txt.includes('train') || txt.includes('火車') || txt.includes('鐵') || txt.includes('線') || txt.includes('metro')) return '🚆';
        return '🚗';
    }

    function detectSlotKind(s) {
        const text = `${s.activity || ''} ${s.desc || ''} ${s.transport || ''}`.toLowerCase();
        if (text.includes('搭') || text.includes('移動') || text.includes('機場') || text.includes('站') || s.transport) return 'kind-move';
        if (text.includes('check-in') || text.includes('飯店') || text.includes('旅館') || text.includes('hotel')) return 'kind-stay';
        return 'kind-spot';
    }

    function formatMinutes(totalMins) {
        if (!totalMins || totalMins <= 0) return '';
        const h = Math.floor(totalMins / 60);
        const m = totalMins % 60;
        if (h > 0 && m > 0) return `${h}h ${m}m`;
        if (h > 0) return `${h}h`;
        return `${m}m`;
    }
