    function calcGreatCircleStats(lat1, lon1, lat2, lon2) {
        if ([lat1, lon1, lat2, lon2].some(v => typeof v !== 'number' || isNaN(v))) return null;
        const R = 6371;
        const toRad = d => d * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        const km = Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        if (km <= 0) return null;
        const estMins = Math.round((km / 820) * 60 + 30);
        const h = Math.floor(estMins / 60);
        const m = estMins % 60;
        return { km, estMins, estDuration: h > 0 ? `~${h}h ${m}m` : `~${m}m` };
    }

    function formatIsoToLocalHHMM(isoOrStr) {
        if (!isoOrStr) return '';
        const s = String(isoOrStr).trim();
        const directMatch = s.match(/(?:T|\s)(\d{2}:\d{2})/);
        if (directMatch) return directMatch[1];
        const hhmmMatch = s.match(/^(\d{1,2}:\d{2})$/);
        if (hhmmMatch) return hhmmMatch[1].padStart(5, '0');
        return '';
    }

    function extractAllTimesFromText(str) {
        if (!str) return [];
        const matches = String(str).match(/\b([01]?\d|2[0-3]):[0-5]\d(?:\s*\+\d)?\b/g);
        return matches ? matches.map(t => t.replace(/\s+/g, '')) : [];
    }

    function parseDurationToMins(durStr) {
        if (!durStr) return 0;
        const s = String(durStr);
        const hm = s.match(/(\d+)\s*h(?:ours?|r)?\s*(\d+)?/i);
        if (hm) return parseInt(hm[1], 10) * 60 + (hm[2] ? parseInt(hm[2], 10) : 0);
        const zhHm = s.match(/(\d+)\s*小時\s*(\d+)?/);
        if (zhHm) return parseInt(zhHm[1], 10) * 60 + (zhHm[2] ? parseInt(zhHm[2], 10) : 0);
        return 0;
    }

    function estimateArrivalWithTimezone(depHHMM, durationMins, depTz, arrTz) {
        if (!depHHMM || !durationMins) return '';
        const m = depHHMM.match(/^(\d{1,2}):(\d{2})/);
        if (!m) return '';
        const depMins = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
        let tzShiftMins = 0;
        if (typeof depTz === 'number' && !isNaN(depTz) && typeof arrTz === 'number' && !isNaN(arrTz)) {
            tzShiftMins = Math.round((arrTz - depTz) * 60);
        }
        let total = depMins + durationMins + tzShiftMins;
        let dayOffset = 0;
        while (total >= 1440) { total -= 1440; dayOffset += 1; }
        while (total < 0) { total += 1440; dayOffset -= 1; }
        const hh = String(Math.floor(total / 60)).padStart(2, '0');
        const mm = String(total % 60).padStart(2, '0');
        const suffix = dayOffset > 0 ? `+${dayOffset}` : (dayOffset < 0 ? `${dayOffset}` : '');
        return `~${hh}:${mm}${suffix}`;
    }

    function normalizeAdsbAirport(ap) {
        if (!ap) return null;
        const iata = String(ap.iata_code || '').toUpperCase();
        const ref = AIRPORT_REF_DB[iata];
        const lat = Number(ap.latitude);
        const lon = Number(ap.longitude);
        return {
            iata,
            icao: ap.icao_code || ref?.icao || '',
            name: ap.name || ref?.name || '',
            city: ap.municipality || ref?.city || '',
            lat: !isNaN(lat) ? lat : ref?.lat,
            lon: !isNaN(lon) ? lon : ref?.lon,
            tz: ref ? ref.tz : (!isNaN(lon) ? Math.round(lon / 15) : null)
        };
    }

    async function queryAdsbdbForFlight(f, forceRefresh = false) {
        const callsign = sanitizeCallsign(f.flight_no);
        const reg = extractRegOrHex(f);
        if (!callsign && !reg) return null;

        const cacheKey = `${callsign}|${reg}`;
        const cached = adsbdbMemoryCache[cacheKey];
        if (!forceRefresh && cached && (Date.now() - cached.ts < ADSBDB_TTL_MS)) {
            return cached.data;
        }
        if (adsbdbInFlight[cacheKey]) return adsbdbInFlight[cacheKey];

        adsbdbInFlight[cacheKey] = (async () => {
            const result = {
                matchedRoute: false,
                airlineName: '',
                airlineIcao: '',
                airlineCallsign: '',
                origin: null,
                midpoint: null,
                destination: null,
                airportsByIata: {},
                aircraftType: '',
                aircraftManufacturer: ''
            };

            try {
                if (callsign) {
                    const res = await fetch(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(callsign)}`);
                    if (res.ok) {
                        const json = await res.json();
                        const fr = json?.response?.flightroute;
                        if (fr) {
                            result.matchedRoute = true;
                            if (fr.airline) {
                                result.airlineName = fr.airline.name || '';
                                result.airlineIcao = fr.airline.icao || '';
                                result.airlineCallsign = fr.airline.callsign || '';
                            }
                            result.origin = normalizeAdsbAirport(fr.origin);
                            result.midpoint = normalizeAdsbAirport(fr.midpoint);
                            result.destination = normalizeAdsbAirport(fr.destination);

                            [result.origin, result.midpoint, result.destination].forEach(ap => {
                                if (ap && ap.iata) result.airportsByIata[ap.iata] = ap;
                            });
                        }
                    }

                    if (!result.airlineName) {
                        const prefixMatch = callsign.match(/^([A-Z]{2,3})[0-9]/);
                        if (prefixMatch) {
                            const aRes = await fetch(`https://api.adsbdb.com/v0/airline/${encodeURIComponent(prefixMatch[1])}`);
                            if (aRes.ok) {
                                const aJson = await aRes.json();
                                const al = Array.isArray(aJson?.response) ? aJson.response[0] : aJson?.response;
                                if (al) {
                                    result.airlineName = al.name || '';
                                    result.airlineIcao = al.icao || '';
                                    result.airlineCallsign = al.callsign || '';
                                }
                            }
                        }
                    }
                }

                if (reg) {
                    const acRes = await fetch(`https://api.adsbdb.com/v0/aircraft/${encodeURIComponent(reg)}`);
                    if (acRes.ok) {
                        const acJson = await acRes.json();
                        const ac = acJson?.response?.aircraft;
                        if (ac) {
                            result.aircraftType = ac.type || '';
                            result.aircraftManufacturer = ac.manufacturer || '';
                        }
                    }
                }
            } catch (err) {
                // 離線狀態靜默降級
            } finally {
                delete adsbdbInFlight[cacheKey];
            }

            adsbdbMemoryCache[cacheKey] = { ts: Date.now(), data: result };
            saveAdsbdbCache();
            return result;
        })();

        return adsbdbInFlight[cacheKey];
    }

    async function queryLiveScheduleForFlight(f, forceRefresh = false) {
        const callsign = sanitizeCallsign(f.flight_no);
        if (!callsign) return null;

        const cfg = getLiveApiConfig();
        const provider = cfg.provider || 'airlabs';
        const apiKey = (cfg.apiKey || '').trim();
        if (!apiKey) return null;

        const routeStr = f.route || '';
        const iataMatches = routeStr.match(/\b[A-Z]{3}\b/g);
        const wantDep = (f.dep_code || (iataMatches && iataMatches[0]) || '').toUpperCase();
        const wantArr = (f.arr_code || (iataMatches && iataMatches[1]) || '').toUpperCase();

        const cacheKey = `${provider}|${callsign}|${wantDep}-${wantArr}|${f.date || ''}`;
        const cached = liveSchedMemoryCache[cacheKey];
        if (!forceRefresh && cached && (Date.now() - cached.ts < LIVE_SCHED_TTL_MS)) {
            return cached.data;
        }
        if (liveSchedInFlight[cacheKey]) return liveSchedInFlight[cacheKey];

        liveSchedInFlight[cacheKey] = (async () => {
            let liveResult = null;
            try {
                if (provider === 'airlabs') {
                    const schedParams = new URLSearchParams({ flight_iata: callsign, api_key: apiKey });
                    if (wantDep) schedParams.set('dep_iata', wantDep);
                    if (wantArr) schedParams.set('arr_iata', wantArr);
                    const schedRes = await fetch(`https://airlabs.co/api/v9/schedules?${schedParams.toString()}`);
                    let r = null;
                    if (schedRes.ok) {
                        const sJson = await schedRes.json();
                        const list = Array.isArray(sJson?.response) ? sJson.response : [];
                        r = list.find(item =>
                            (!wantDep || String(item.dep_iata || '').toUpperCase() === wantDep) &&
                            (!wantArr || String(item.arr_iata || '').toUpperCase() === wantArr)
                        ) || list[0] || null;
                    }
                    if (!r) {
                        const fRes = await fetch(`https://airlabs.co/api/v9/flight?flight_iata=${encodeURIComponent(callsign)}&api_key=${encodeURIComponent(apiKey)}`);
                        if (fRes.ok) {
                            const fJson = await fRes.json();
                            const cand = fJson?.response;
                            if (cand && (!wantDep || String(cand.dep_iata || '').toUpperCase() === wantDep) && (!wantArr || String(cand.arr_iata || '').toUpperCase() === wantArr)) {
                                r = cand;
                            }
                        }
                    }
                    if (r && (r.dep_time || r.arr_time)) {
                        liveResult = {
                            provider: 'AirLabs LIVE',
                            depTime: formatIsoToLocalHHMM(r.dep_actual || r.dep_estimated || r.dep_time),
                            arrTime: formatIsoToLocalHHMM(r.arr_actual || r.arr_estimated || r.arr_time),
                            depTerminal: r.dep_terminal || '',
                            arrTerminal: r.arr_terminal || '',
                            depGate: r.dep_gate || '',
                            arrGate: r.arr_gate || '',
                            status: r.status || '',
                            durationMins: Number(r.duration) || 0,
                            aircraftIcao: r.aircraft_icao || '',
                            regNumber: r.reg_number || ''
                        };
                    }
                } else if (provider === 'aviationstack') {
                    const params = new URLSearchParams({ access_key: apiKey, flight_iata: callsign, limit: '10' });
                    if (wantDep) params.set('dep_iata', wantDep);
                    if (wantArr) params.set('arr_iata', wantArr);
                    const res = await fetch(`https://api.aviationstack.com/v1/flights?${params.toString()}`);
                    if (res.ok) {
                        const json = await res.json();
                        const list = Array.isArray(json?.data) ? json.data : [];
                        const r = list.find(item =>
                            (!wantDep || String(item.departure?.iata || '').toUpperCase() === wantDep) &&
                            (!wantArr || String(item.arrival?.iata || '').toUpperCase() === wantArr)
                        ) || list[0] || null;
                        if (r && (r.departure || r.arrival)) {
                            liveResult = {
                                provider: 'AviationStack LIVE',
                                depTime: formatIsoToLocalHHMM(r.departure?.actual || r.departure?.estimated || r.departure?.scheduled),
                                arrTime: formatIsoToLocalHHMM(r.arrival?.actual || r.arrival?.estimated || r.arrival?.scheduled),
                                depTerminal: r.departure?.terminal || '',
                                arrTerminal: r.arrival?.terminal || '',
                                depGate: r.departure?.gate || '',
                                arrGate: r.arrival?.gate || '',
                                status: r.flight_status || '',
                                durationMins: 0,
                                aircraftIcao: r.aircraft?.icao || '',
                                regNumber: r.aircraft?.registration || ''
                            };
                        }
                    }
                } else if (provider === 'aerodatabox') {
                    const dateMatch = String(f.date || '').match(/(\d{4}-\d{2}-\d{2})/);
                    const targetDate = dateMatch ? dateMatch[1] : getLocalTodayIso();
                    const url = `https://aerodatabox.p.rapidapi.com/flights/number/${encodeURIComponent(callsign)}/${targetDate}`;
                    const res = await fetch(url, {
                        headers: {
                            'X-RapidAPI-Key': apiKey,
                            'X-RapidAPI-Host': 'aerodatabox.p.rapidapi.com'
                        }
                    });
                    if (res.ok) {
                        const json = await res.json();
                        const list = Array.isArray(json) ? json : [];
                        const r = list.find(item =>
                            (!wantDep || String(item.departure?.airport?.iata || '').toUpperCase() === wantDep) &&
                            (!wantArr || String(item.arrival?.airport?.iata || '').toUpperCase() === wantArr)
                        ) || list[0] || null;
                        if (r && (r.departure || r.arrival)) {
                            liveResult = {
                                provider: 'AeroDataBox LIVE',
                                depTime: formatIsoToLocalHHMM(r.departure?.revisedTime?.local || r.departure?.scheduledTime?.local),
                                arrTime: formatIsoToLocalHHMM(r.arrival?.revisedTime?.local || r.arrival?.scheduledTime?.local),
                                depTerminal: r.departure?.terminal || '',
                                arrTerminal: r.arrival?.terminal || '',
                                depGate: r.departure?.gate || '',
                                arrGate: r.arrival?.gate || '',
                                status: r.status || '',
                                durationMins: 0,
                                aircraftIcao: r.aircraft?.model || '',
                                regNumber: r.aircraft?.reg || ''
                            };
                        }
                    }
                }
            } catch (e) {
                liveResult = null;
            } finally {
                delete liveSchedInFlight[cacheKey];
            }

            if (liveResult) {
                liveSchedMemoryCache[cacheKey] = { ts: Date.now(), data: liveResult };
                saveLiveSchedCache();
            }
            return liveResult;
        })();

        return liveSchedInFlight[cacheKey];
    }

    async function enrichAllFlightsWithAdsbdb(forceRefresh = false) {
        const flights = (globalData?.flights_and_hotels?.flights) || [];
        if (!flights.length) return;
        await Promise.all(flights.map(async (f) => {
            await Promise.all([
                queryAdsbdbForFlight(f, forceRefresh),
                queryLiveScheduleForFlight(f, forceRefresh)
            ]);
        }));
        if (globalData?.itinerary?.length > 0) renderDashboard();
        renderFlights(globalData.flights_and_hotels || { flights: [], hotels: [] });
    }

    function resolveAirportEndpoint(iataCode, adsb) {
        const code = String(iataCode || '').toUpperCase();
        const adsbAp = adsb?.airportsByIata?.[code]
            || [adsb?.origin, adsb?.midpoint, adsb?.destination].find(ap => ap && String(ap.iata || '').toUpperCase() === code)
            || null;
        const refAp = AIRPORT_REF_DB[code] || null;
        if (!adsbAp && !refAp) return null;
        return {
            iata: code,
            icao: adsbAp?.icao || refAp?.icao || '',
            name: adsbAp?.name || refAp?.name || '',
            city: adsbAp?.city || refAp?.city || '',
            lat: typeof adsbAp?.lat === 'number' && !isNaN(adsbAp.lat) ? adsbAp.lat : refAp?.lat,
            lon: typeof adsbAp?.lon === 'number' && !isNaN(adsbAp.lon) ? adsbAp.lon : refAp?.lon,
            tz: refAp ? refAp.tz : (typeof adsbAp?.tz === 'number' ? adsbAp.tz : null)
        };
    }

    function parseFlightMeta(f) {
        const routeStr = f.route || '';
        const timeStr = f.time || '';
        const iataMatches = routeStr.match(/\b[A-Z]{3}\b/g);
        const parts = routeStr.split(/➔|->|→|—|-|至/).map(s => s.trim()).filter(Boolean);

        const callsign = sanitizeCallsign(f.flight_no);
        const reg = extractRegOrHex(f);
        const cachedEntry = adsbdbMemoryCache[`${callsign}|${reg}`];
        const adsb = cachedEntry ? cachedEntry.data : null;

        const depCode = (f.dep_code || (iataMatches && iataMatches[0]) || adsb?.origin?.iata || (parts[0] ? parts[0].slice(0, 4) : 'DEP')).toUpperCase();
        const arrCode = (f.arr_code || (iataMatches && iataMatches[1]) || adsb?.destination?.iata || (parts[1] ? parts[1].slice(0, 4) : 'ARR')).toUpperCase();

        const cfg = getLiveApiConfig();
        const liveEntry = liveSchedMemoryCache[`${cfg.provider || 'airlabs'}|${callsign}|${depCode}-${arrCode}|${f.date || ''}`];
        const live = liveEntry ? liveEntry.data : null;

        const depEndpoint = resolveAirportEndpoint(depCode, adsb);
        const arrEndpoint = resolveAirportEndpoint(arrCode, adsb);

        const parsedDepCity = f.dep_city || (parts[0] ? parts[0].replace(depCode, '').replace(/[()]/g, '').trim() : '');
        const parsedArrCity = f.arr_city || (parts[1] ? parts[1].replace(arrCode, '').replace(/[()]/g, '').trim() : '');

        const depCity = parsedDepCity || depEndpoint?.city || depCode;
        const arrCity = parsedArrCity || arrEndpoint?.city || arrCode;

        const legStats = (depEndpoint && arrEndpoint)
            ? calcGreatCircleStats(depEndpoint.lat, depEndpoint.lon, arrEndpoint.lat, arrEndpoint.lon)
            : null;

        const extractedTimes = [
            ...extractAllTimesFromText(timeStr),
            ...extractAllTimesFromText(f.note)
        ];
        let depTime = live?.depTime || f.dep_time || extractedTimes[0] || '';
        let arrTime = live?.arrTime || f.arr_time || extractedTimes[1] || '';

        const knownDurMins = parseDurationToMins(f.duration) || live?.durationMins || legStats?.estMins || 0;
        let arrIsEstimated = false;
        if (depTime && !arrTime && knownDurMins > 0) {
            arrTime = estimateArrivalWithTimezone(
                depTime,
                knownDurMins,
                depEndpoint?.tz,
                arrEndpoint?.tz
            );
            arrIsEstimated = Boolean(arrTime);
        }

        if (!depTime) depTime = '--:--';
        if (!arrTime) arrTime = '--:--';

        const terminalLabel = f.terminal || [
            live?.depTerminal ? `T${live.depTerminal}` : '',
            live?.arrTerminal ? `T${live.arrTerminal}` : ''
        ].filter(Boolean).join(' ➔ ');

        const gateLabel = [
            live?.depGate ? `登機門 ${live.depGate}` : '',
            live?.arrGate ? `抵達門 ${live.arrGate}` : ''
        ].filter(Boolean).join(' · ');

        const adsbMap = adsb?.airportsByIata || {};
        const adsbHasLegPoint = Boolean(
            adsbMap[depCode] || adsbMap[arrCode] ||
            adsb?.origin?.iata === depCode || adsb?.origin?.iata === arrCode ||
            adsb?.midpoint?.iata === depCode || adsb?.midpoint?.iata === arrCode ||
            adsb?.destination?.iata === depCode || adsb?.destination?.iata === arrCode
        );
        const isFifthFreedomLeg = Boolean(
            adsb && adsb.matchedRoute &&
            (adsb.origin?.iata !== depCode || adsb.destination?.iata !== arrCode) &&
            adsbHasLegPoint
        );

        return {
            flightNo: f.flight_no || 'FLIGHT',
            callsign,
            date: f.date || '',
            depCode,
            arrCode,
            depCity,
            arrCity,
            depIcao: depEndpoint?.icao || '',
            arrIcao: arrEndpoint?.icao || '',
            depFullName: depEndpoint?.name || '',
            arrFullName: arrEndpoint?.name || '',
            depTime,
            arrTime,
            arrIsEstimated,
            liveSource: live?.provider || '',
            liveStatus: live?.status || '',
            duration: f.duration || (live?.durationMins ? `${Math.floor(live.durationMins / 60)}h ${live.durationMins % 60}m` : '') || legStats?.estDuration || 'DIRECT',
            distanceKm: legStats?.km || null,
            isFifthFreedomLeg,
            fullRouteHint: isFifthFreedomLeg && adsb?.origin?.iata && adsb?.destination?.iata
                ? `全航線 ${adsb.origin.iata}→${adsb.midpoint?.iata ? adsb.midpoint.iata + '→' : ''}${adsb.destination.iata}`
                : '',
            airlineName: f.airline || adsb?.airlineName || '',
            airlineIcao: adsb?.airlineIcao || '',
            airlineCallsign: adsb?.airlineCallsign || '',
            aircraftType: f.aircraft || live?.aircraftIcao || (adsb?.aircraftType ? `${adsb.aircraftManufacturer} ${adsb.aircraftType}`.trim() : ''),
            adsbMatched: Boolean(live || (adsb && (adsb.matchedRoute || adsb.airlineName || adsb.aircraftType))),
            adsbPending: !adsb && !live && Boolean(callsign),
            terminal: terminalLabel,
            gate: gateLabel,
            seat: f.seat || '',
            pnr: f.pnr || '',
            note: f.note || ''
        };
    }

    function buildFlightyCardHtml(f, compact = false) {
        const m = parseFlightMeta(f);
        const liveTrackUrl = m.callsign
            ? `https://www.flightradar24.com/data/flights/${encodeURIComponent(m.callsign.toLowerCase())}`
            : `https://www.google.com/search?q=${encodeURIComponent(`${m.flightNo} ${m.date}`.trim())}`;

        const metaPills = [

    /* ================= 行程渲染（滿寬單層卡片 + 精簡時間表切換） ================= */
    let itineraryCompactMode = false;

    function parseActivityTitle(rawTitle) {
        const str = String(rawTitle || '').trim();
        if (!str) return { kicker: '', title: '未命名節點' };
        const colonMatch = str.match(/^([^：:]{2,26})[：:]\s*(.+)$/);
        if (colonMatch) {
            const k = colonMatch[1].replace(/[（(]/g, ' · ').replace(/[）)]/g, '').replace(/\s*·\s*$/, '').trim();
            return { kicker: k, title: colonMatch[2].trim() };
        }
        return { kicker: '', title: str };
    }

    function formatCleanParagraphs(text) {
        const lines = String(text || '').trim().split(/\n+/).map(s => s.trim()).filter(Boolean);
        if (!lines.length) return '';
        if (lines.length === 1) return lines[0];
        return lines.map(l => `<p>${l}</p>`).join('');
    }

    function toggleItineraryCompactMode() {
        itineraryCompactMode = !itineraryCompactMode;
        renderItinerary((globalData && globalData.itinerary) || []);
    }

    function scrollToDayNotes(dayNum) {
        const el = document.getElementById(`day-notes-${dayNum}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function getMoveIcon(t) {
        if (!t) return '🚗';
        const txt = t.toLowerCase();
        if (txt.includes('walk') || txt.includes('步行')) return '🚶';
        if (txt.includes('flight') || txt.includes('機')) return '✈️';
        if (txt.includes('ferry') || txt.includes('渡輪') || txt.includes('船')) return '⛴️';
        if (txt.includes('bus') || txt.includes('巴士') || txt.includes('專車')) return '🚌';
        if (txt.includes('jr') || txt.includes('train') || txt.includes('火車') || txt.includes('鐵') || txt.includes('線') || txt.includes('metro')) return '🚆';
        return '🚗';
    }

    function detectSlotKind(s) {
        const text = `${s.activity || ''} ${s.desc || ''} ${s.transport || ''}`.toLowerCase();
        if (text.includes('搭') || text.includes('移動') || text.includes('機場') || text.includes('站') || s.transport) return 'kind-move';
        if (text.includes('check-in') || text.includes('飯店') || text.includes('旅館') || text.includes('hotel')) return 'kind-stay';
        return 'kind-spot';
    }

    function formatMinutes(totalMins) {
        if (!totalMins || totalMins <= 0) return '';
        const h = Math.floor(totalMins / 60);
        const m = totalMins % 60;
        if (h > 0 && m > 0) return `${h}h ${m}m`;
        if (h > 0) return `${h}h`;
        return `${m}m`;
    }

    /* ================= 智能預算解析與帳本渲染引擎 ================= */
    const BUDGET_PALETTE = ['#f59e0b', '#38bdf8', '#34d399', '#a78bfa', '#fb7185'];

    function guessBudgetIcon(text) {
        const s = String(text || '');
        if (/宿|飯|旅|酒店|hotel|inn|野乃|hyatt|hilton|marriott|intercontinental/i.test(s)) return '🏨';
        if (/鐵|車票|周遊|jr|haruka|新幹線|地鐵|交通|巴士|pass/i.test(s)) return '🚄';
        if (/單車|自行車|越野車|腳踏車|bike|cycle/i.test(s)) return '🚲';
        if (/機|航|flight|貴賓室|lounge/i.test(s)) return '✈️';
        if (/咖|餐|食|牛|拉麵|酒|茶|coffee|cafe|food/i.test(s)) return '☕';
        if (/門票|票|寺|城|館|神社|ticket/i.test(s)) return '🎟️';
        if (/sim|esim|網|保險|wifi/i.test(s)) return '📶';
        return '🧾';
    }

    function parseLeadingEmoji(str) {
        const s = String(str || '').trim();
        const m = s.match(/^([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2300}-\u{23FF}][\uFE0F\u200D\u{1F300}-\u{1FAFF}]*)\s*(.*)$/u);
        if (m) return { icon: m[1], rest: m[2].trim() };
        return { icon: '', rest: s };
    }

    function splitParentheticalNotes(str) {
        const notes = [];
        const cleaned = String(str || '').replace(/\s*[（(]([^（）()]+)[）)]/g, (_, inner) => {
            if (inner.trim()) notes.push(inner.trim());
            return '';
        }).replace(/\s{2,}/g, ' ').trim();
        return { main: cleaned || String(str || '').trim(), notes };
    }

    function detectCurrencyFromSymbol(str) {
        const s = String(str || '');
        if (/NT\$|TWD/i.test(s)) return { sym: 'NT$', code: 'twd' };
        if (/¥|￥|JPY/i.test(s)) return { sym: '¥', code: 'jpy' };
        if (/€|EUR/i.test(s)) return { sym: '€', code: 'eur' };
        if (/£|GBP/i.test(s)) return { sym: '£', code: 'gbp' };
        if (/฿|THB/i.test(s)) return { sym: '฿', code: 'thb' };
        if (/SGD|S\$/i.test(s)) return { sym: 'S$', code: 'sgd' };
        if (/MYR|RM\s*\d/i.test(s)) return { sym: 'RM', code: 'myr' };
        if (/USD|\$/i.test(s)) return { sym: '$', code: 'usd' };
        return { sym: '', code: '' };
    }

    function parseMoneyRange(str) {
        const { main } = splitParentheticalNotes(str);
        const curInfo = detectCurrencyFromSymbol(main);
        const nums = (main.match(/\d[\d,]*(?:\.\d+)?/g) || []).map(n => parseFloat(n.replace(/,/g, ''))).filter(n => !isNaN(n));
        if (!nums.length) return null;
        const isRange = /[-–—~～至]/.test(main) && nums.length >= 2;
        return {
            min: nums[0],
            max: isRange ? nums[1] : nums[0],
            sym: curInfo.sym,
            code: curInfo.code
        };
    }

    function getRateToTwd(code) {
        if (!code) return 0;
        if (code === 'twd') return 1;
        const sel = document.getElementById('currency-selector');
        if (sel && sel.value === code && currentRate > 0) return currentRate;
        return offlineRates[code] || 0;
    }

    function formatRangeTwd(rangeObj) {
        if (!rangeObj || !rangeObj.code || rangeObj.code === 'twd') return '';
        const rate = getRateToTwd(rangeObj.code);
        if (!rate) return '';
        const minTwd = Math.round(rangeObj.min * rate);
        const maxTwd = Math.round(rangeObj.max * rate);
        if (minTwd === maxTwd) return `≈ NT$ ${minTwd.toLocaleString()}`;
        return `≈ NT$ ${minTwd.toLocaleString()}–${maxTwd.toLocaleString()}`;
    }

    function parseBudgetRow(item) {
        const { icon: rawIcon, rest: labelNoIcon } = parseLeadingEmoji(item.label || '');
        const labelParts = splitParentheticalNotes(labelNoIcon);
        const valParts = splitParentheticalNotes(item.value || '');

        let rawAmount = valParts.main;
        let isApprox = false;
        if (/^約\s*/.test(rawAmount)) {
            isApprox = true;
            rawAmount = rawAmount.replace(/^約\s*/, '').trim();
        }
        // 壓縮區間重複幣別符號，避免手機窄螢幕斷行（例如 "¥8,000 - ¥15,000" -> "¥8,000–15,000"）
        const curInfo = detectCurrencyFromSymbol(rawAmount);
        let compactAmount = rawAmount;
        if (curInfo.sym) {
            const escSym = curInfo.sym.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            compactAmount = rawAmount.replace(
                new RegExp(`(${escSym}\\s*[\\d,]+(?:\\.\\d+)?)\\s*[-–—~～]\\s*${escSym}?\\s*([\\d,]+(?:\\.\\d+)?)`),
                '$1–$2'
            ).replace(/\s+–\s+/g, '–');
        }

        const statusTags = [];
        const breakdowns = [];
        valParts.notes.forEach(n => {
            if (/已確認|已付|已預訂|已結清|免費|包含|confirmed|paid|free/i.test(n) && n.length <= 10) {
                statusTags.push(n);
            } else {
                breakdowns.push(n);
            }
        });

        return {
            icon: rawIcon || guessBudgetIcon(labelNoIcon),
            title: labelParts.main,
            details: labelParts.notes,
            amount: compactAmount,
            isApprox,
            statusTags,
            breakdowns
        };
    }

    function renderBudget(data) {
        const container = document.getElementById('budget-render');
        if (!container) return;
        const regions = (data && data.regions) || [];
        if (!regions.length) {
            container.innerHTML = '';
            return;
        }

        // 計算各分組數值範圍與幣別
        const regionStats = regions.map((r, idx) => {
            let range = r.total ? parseMoneyRange(r.total) : null;
            if (!range && Array.isArray(r.items)) {
                const parsedItems = r.items.map(i => parseMoneyRange(i.value)).filter(Boolean);
                const codes = [...new Set(parsedItems.map(p => p.code).filter(Boolean))];
                if (parsedItems.length && codes.length <= 1) {
                    range = {
                        min: parsedItems.reduce((s, p) => s + p.min, 0),
                        max: parsedItems.reduce((s, p) => s + p.max, 0),
                        sym: parsedItems[0].sym,
                        code: parsedItems[0].code
                    };
                }
            }
            return {
                name: r.name || `分類 ${idx + 1}`,
                color: BUDGET_PALETTE[idx % BUDGET_PALETTE.length],
                range,
                mid: range ? (range.min + range.max) / 2 : 0
            };
        });

        const validRanges = regionStats.filter(s => s.range && s.range.code);
        const uniqueCodes = [...new Set(validRanges.map(s => s.range.code))];
        let summaryHtml = '';

        if (validRanges.length === regions.length && uniqueCodes.length === 1) {
            const sym = validRanges[0].range.sym;
            const code = uniqueCodes[0];
            const grandMin = validRanges.reduce((a, s) => a + s.range.min, 0);
            const grandMax = validRanges.reduce((a, s) => a + s.range.max, 0);
            const totalMid = validRanges.reduce((a, s) => a + s.mid, 0);
            const grandStr = grandMin === grandMax
                ? `${sym}${Math.round(grandMin).toLocaleString()}`
                : `${sym}${Math.round(grandMin).toLocaleString()}–${Math.round(grandMax).toLocaleString()}`;
            const grandTwd = formatRangeTwd({ min: grandMin, max: grandMax, code });

            const barSegs = regionStats.map(s => {
                const pct = totalMid > 0 ? Math.max(6, Math.round((s.mid / totalMid) * 100)) : Math.round(100 / regionStats.length);
                return `<div class="budget-bar-seg" style="width:${pct}%; background:${s.color};"></div>`;
            }).join('');

            const legendItems = regionStats.map(s => {
                const pct = totalMid > 0 ? Math.round((s.mid / totalMid) * 100) : 0;
                const shortName = s.name.length > 12 ? s.name.slice(0, 12) + '…' : s.name;
                return `<span class="budget-legend-item"><span class="budget-dot" style="background:${s.color};"></span><span>${shortName}</span><span class="mono" style="color:var(--text-primary);">${pct}%</span></span>`;
            }).join('');

            summaryHtml = `
                <div class="budget-hero-card">
                    <div class="budget-hero-kicker">ESTIMATED TRIP BUDGET · 總預算概覽</div>
                    <div class="budget-hero-total tabular-nums">${grandStr}</div>
                    ${grandTwd ? `<div class="budget-hero-twd tabular-nums">${grandTwd}</div>` : ''}
                    <div class="budget-bar-track">${barSegs}</div>
                    <div class="budget-legend">${legendItems}</div>
                </div>`;
        }

        const ledgerCardsHtml = regions.map((r, idx) => {
            const color = BUDGET_PALETTE[idx % BUDGET_PALETTE.length];
            const items = r.items || [];
            const rowsHtml = items.map(rawItem => {
                const p = parseBudgetRow(rawItem);
                const subMetaParts = [
                    ...p.details.map(d => `<span class="ledger-detail">${d}</span>`),
                    ...p.breakdowns.map(b => `<span class="ledger-breakdown">${b}</span>`),
                    ...p.statusTags.map(st => `<span class="ledger-status-chip">✓ ${st}</span>`)
                ].join('');

                return `
                    <div class="ledger-row">
                        <div class="ledger-icon">${p.icon}</div>
                        <div class="ledger-main">
                            <div class="ledger-top-line">
                                <div class="ledger-item-name">${p.title}</div>
                                <div class="ledger-price-col">
                                    <span class="ledger-amount tabular-nums">${p.isApprox ? '<span class="ledger-approx-tag">約</span>' : ''}${p.amount}</span>
                                </div>
                            </div>
                            ${subMetaParts ? `<div class="ledger-sub-meta">${subMetaParts}</div>` : ''}
                        </div>
                    </div>`;
            }).join('');

            const totalParts = r.total ? parseBudgetRow({ label: '', value: r.total }) : null;
            const totalRange = regionStats[idx].range;
            const totalTwd = formatRangeTwd(totalRange);

            return `
                <div class="ledger-card">
                    <div class="ledger-head">
                        <div class="ledger-head-left">
                            <span class="budget-dot" style="background:${color}; width:9px; height:9px;"></span>
                            <span class="ledger-cat-title">${r.name || '預算明細'}</span>
                        </div>
                        <span class="ledger-count tabular-nums">${items.length} 項</span>
                    </div>
                    ${rowsHtml}
                    ${totalParts ? `
                        <div class="ledger-footer">
                            <span class="ledger-footer-label">預估小計</span>
                            <div class="ledger-footer-val-wrap">
                                <span class="ledger-footer-val tabular-nums">${totalParts.isApprox ? '<span class="ledger-approx-tag" style="color:var(--accent); opacity:0.8;">約</span>' : ''}${totalParts.amount}</span>
                                ${totalTwd ? `<span class="ledger-footer-twd tabular-nums">${totalTwd}</span>` : ''}
                            </div>
                        </div>` : ''}
                </div>`;
        }).join('');

        const noteText = data.note ? parseLeadingEmoji(data.note) : null;
        const noteHtml = noteText ? `
            <div class="budget-insight-card">
                <span class="budget-insight-icon">${noteText.icon || '💡'}</span>
                <div class="budget-insight-text">${noteText.rest}</div>
            </div>` : '';

        container.innerHTML = `
            <div class="section-kicker">
                <span class="section-kicker-title">💳 旅途預算帳本</span>
                <span class="section-kicker-meta">${regions.length} 大類</span>
            </div>
            ${summaryHtml}
            ${ledgerCardsHtml}
            ${noteHtml}`;
    }

    function initCurrencyWidget(defaultCur) {
        const sel = document.getElementById('currency-selector');
        const inp = document.getElementById('foreign-amount');
        if (!sel || !inp) return;
        if (defaultCur && offlineRates[defaultCur.toLowerCase()]) sel.value = defaultCur.toLowerCase();
        fetchRate(sel.value);
        sel.onchange = e => fetchRate(e.target.value);
        inp.oninput = calculateTWD;

    function fetchRate(cur) {
        const box = document.getElementById('rate-status');
        if (box) box.innerText = '更新中...';
        fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${encodeURIComponent(cur)}.json`)
            .then(r => r.json())
            .then(data => {
                if (!data || !data[cur] || typeof data[cur].twd !== 'number') throw new Error('bad fx');
                currentRate = data[cur].twd;
                if (box) box.innerText = `1 ${cur.toUpperCase()} ≈ ${currentRate.toFixed(currentRate < 1 ? 4 : 2)} TWD`;
                syncDashboardFxText(cur, currentRate);
                calculateTWD();
                if (globalData && globalData.budget) renderBudget(globalData.budget);
            })
            .catch(() => {
                currentRate = offlineRates[cur] || 0.207;
                if (box) box.innerText = `離線 1 ${cur.toUpperCase()} ≈ ${currentRate} TWD`;
                syncDashboardFxText(cur, currentRate);
                calculateTWD();
                if (globalData && globalData.budget) renderBudget(globalData.budget);
            });
    }

    function addAmount(delta) {
        const inp = document.getElementById('foreign-amount');
        inp.value = (parseFloat(inp.value) || 0) + delta;
        calculateTWD();

    function clearAmount() {
        document.getElementById('foreign-amount').value = '';

    function calculateTWD() {
        const amt = parseFloat(document.getElementById('foreign-amount').value) || 0;
        document.getElementById('twd-result').innerText = Math.round(amt * currentRate).toLocaleString();
    }


    /* ================= PIN 鎖屏與 secure_data.js 解密 ================= */
    let currentPin = '';
    const MAX_ATTEMPTS = 5;
    const LOCK_MINUTES = 3;
    let isLockedOut = false;
    let lockTimer = null;

    function lockApp() {
        currentPin = '';
        updateDots();
        const msg = document.getElementById('auth-msg');
        msg.style.color = 'var(--text-secondary)';
        msg.innerText = '已重新鎖定行程';
        document.body.style.overflow = 'hidden';
        document.getElementById('lock-screen').style.display = 'flex';
    }

    function checkLockStatus() {
        const lockUntil = localStorage.getItem('trip_lockout_time');
        if (lockUntil && Date.now() < parseInt(lockUntil, 10)) {
            startLockdown(parseInt(lockUntil, 10));
        } else if (lockUntil) {
            localStorage.removeItem('trip_lockout_time');
            localStorage.removeItem('trip_failed_attempts');
        }
    }

    function startLockdown(endTime) {
        isLockedOut = true;
        currentPin = '';
        updateDots();
        const msg = document.getElementById('auth-msg');
        msg.style.color = 'var(--danger)';
        lockTimer = setInterval(() => {
            const remaining = Math.ceil((endTime - Date.now()) / 1000);
            if (remaining <= 0) {
                clearInterval(lockTimer);
                isLockedOut = false;
                localStorage.removeItem('trip_lockout_time');
                localStorage.removeItem('trip_failed_attempts');
                msg.style.color = 'var(--text-secondary)';
                msg.innerText = '系統已解鎖，請輸入通行碼';
            } else {
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                msg.innerText = `錯誤次數過多，請等待 ${m}分 ${s}秒`;
            }
        }, 1000);
    }

    function pressKey(val) {
        if (isLockedOut) {
            triggerShake();
            return;
        }
        if (navigator.vibrate) navigator.vibrate(25);
        const msg = document.getElementById('auth-msg');
        msg.style.color = 'var(--text-secondary)';
        msg.innerText = '行程資料已加密保護';

        if (val === 'del') {
            currentPin = currentPin.slice(0, -1);
        } else if (currentPin.length < 6) {
            currentPin += val;
        }
        updateDots();
        if (currentPin.length === 6) setTimeout(verifyPin, 90);
    }

    document.addEventListener('keydown', (e) => {
        const lockEl = document.getElementById('lock-screen');
        if (!lockEl || lockEl.style.display === 'none') return;
        if (e.key >= '0' && e.key <= '9') pressKey(e.key);
        else if (e.key === 'Backspace') pressKey('del');
    });

    function updateDots() {
        const dots = document.querySelectorAll('.pin-dot');
        dots.forEach((dot, i) => {
            dot.classList.remove('filled', 'error');
            if (i < currentPin.length) dot.classList.add('filled');
        });
    }

    function triggerShake() {
        const dotsBox = document.getElementById('pin-dots');
        document.querySelectorAll('.pin-dot').forEach(d => d.classList.add('error'));
        dotsBox.classList.remove('shake');
        void dotsBox.offsetWidth;
        dotsBox.classList.add('shake');
    }

    function verifyPin() {
        const msg = document.getElementById('auth-msg');
        if (typeof encryptedTripData === 'undefined') {
            triggerShake();
            currentPin = '';
            updateDots();
            msg.style.color = 'var(--danger)';
            msg.innerText = '找不到 secure_data.js（請確認與 index.html 同資料夾）';
            return;
        }

        let failedAttempts = parseInt(localStorage.getItem('trip_failed_attempts') || '0', 10);
        try {
            const bytes = CryptoJS.AES.decrypt(encryptedTripData, currentPin);
            const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
            if (!decryptedStr) throw new Error('Empty decryption');
            globalData = JSON.parse(decryptedStr);
            if (!globalData || typeof globalData !== 'object') throw new Error('Invalid JSON');

            localStorage.removeItem('trip_failed_attempts');
            document.getElementById('lock-screen').style.display = 'none';
            document.body.style.overflow = '';
            bootSystem();
        } catch (e) {
            triggerShake();
            failedAttempts++;
            localStorage.setItem('trip_failed_attempts', failedAttempts);

            if (failedAttempts >= MAX_ATTEMPTS) {
                const unlockTime = Date.now() + (LOCK_MINUTES * 60 * 1000);
                localStorage.setItem('trip_lockout_time', unlockTime);
                startLockdown(unlockTime);
            } else {
                currentPin = '';
                updateDots();
                msg.style.color = 'var(--danger)';
                msg.innerText = `密碼錯誤，剩餘 ${MAX_ATTEMPTS - failedAttempts} 次機會`;
            }
        }
    }

    function copyTextNative(text, label = '內容') {
        const clean = String(text || '').trim();
        if (!clean) return;
        hapticTick(10);
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(clean)
                .then(() => showNativeToast(`✓ 已複製${label}：${clean.slice(0, 18)}${clean.length > 18 ? '…' : ''}`))
                .catch(() => fallbackCopyText(clean, label));
        } else {
            fallbackCopyText(clean, label);
        }
    }

    function fallbackCopyText(text, label) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showNativeToast(`✓ 已複製${label}`); } catch (e) {}
        document.body.removeChild(ta);
    }

    function openItemActionSheet(payload) {
        currentSheetPayload = payload;
        hapticTick(8);
        const body = document.getElementById('native-sheet-body');
        const sheet = document.getElementById('native-sheet');
        const backdrop = document.getElementById('sheet-backdrop');
        if (!body || !sheet || !backdrop) return;

        const cleanTitle = String(payload.title || '').trim();
        const gmapsUrl = payload.mapUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanTitle)}`;
        const appleMapsUrl = `https://maps.apple.com/?q=${encodeURIComponent(cleanTitle)}`;
        const favBtnHtml = payload.favKey ? `
            <button type="button" class="sheet-action-btn" id="sheet-fav-btn" onclick="toggleSheetFavorite()">
                ${isFavItem(payload.favKey) ? '★ 已在收藏中' : '☆ 加入收藏'}
            </button>` : '';

        body.innerHTML = `
            ${payload.kicker ? `<div class="sheet-kicker tabular-nums">${payload.kicker}</div>` : ''}
            <h3 class="sheet-title">${cleanTitle}</h3>
            ${payload.meta ? `<div style="font-size:0.76rem; font-weight:700; color:var(--text-muted); margin-bottom:10px;" class="tabular-nums">${payload.meta}</div>` : ''}
            ${payload.desc ? `<div class="sheet-desc">${formatCleanParagraphs(payload.desc)}</div>` : ''}
            ${payload.extra ? `<div style="font-size:0.8rem; color:var(--accent); font-weight:700; margin-bottom:12px; line-height:1.55;">${payload.extra}</div>` : ''}
            <div class="sheet-actions-grid">
                <a href="${gmapsUrl}" target="_blank" rel="noopener" class="sheet-action-btn primary" onclick="closeNativeSheet()">🗺️ 開啟 Google Maps 導航</a>
                <a href="${appleMapsUrl}" target="_blank" rel="noopener" class="sheet-action-btn" onclick="closeNativeSheet()">🧭 Apple 地圖</a>
                <button type="button" class="sheet-action-btn" onclick="copyTextNative('${escapeJsQuote(cleanTitle)}', '地點名稱')">📋 複製名稱</button>
                ${favBtnHtml}
            </div>
        `;
        backdrop.classList.add('open');
        sheet.classList.add('open');
    }

    function toggleSheetFavorite() {
        if (!currentSheetPayload || !currentSheetPayload.favKey) return;
        toggleFavItem(currentSheetPayload.favKey, currentSheetPayload.favScope || 'poi');
        const btn = document.getElementById('sheet-fav-btn');
        const active = isFavItem(currentSheetPayload.favKey);
        if (btn) btn.innerText = active ? '★ 已在收藏中' : '☆ 加入收藏';
        showNativeToast(active ? '★ 已加入收藏口袋' : '已從收藏移除');
    }

    function closeNativeSheet() {
        const sheet = document.getElementById('native-sheet');
        const backdrop = document.getElementById('sheet-backdrop');
        if (sheet) {
            sheet.style.transform = '';
            sheet.classList.remove('open');
        }
        if (backdrop) backdrop.classList.remove('open');
    }

    function openSchedCardSheet(dayNum, slotIdx, event) {
        if (event && event.target && event.target.closest('a, button')) return;
        const dayObj = ((globalData && globalData.itinerary) || []).find(d => Number(d.day) === Number(dayNum));
        const s = dayObj && dayObj.schedule && dayObj.schedule[slotIdx];
        if (!s) return;
        const parsed = parseActivityTitle(s.activity);
        const metaParts = [
            s.time || '',
            s.transport ? `${getMoveIcon(s.transport)} ${s.from && s.to ? `${s.from} → ${s.to}` : s.transport}` : '',
            s.stay > 0 ? `停留 ${s.stay} 分鐘` : '',
            s.move > 0 ? `移動 ${s.move} 分鐘` : ''
        ].filter(Boolean).join(' · ');
        openItemActionSheet({
            kicker: `DAY ${dayNum}${parsed.kicker ? ` · ${parsed.kicker}` : ''}`,
            title: parsed.title,
            meta: metaParts,
            desc: s.desc || '',
            mapUrl: s.map_url || ''
        });
    }

    function openThemeCardSheet(idx, event) {
        if (event && event.target && event.target.closest('a, button')) return;
        const g = ((globalData && globalData.theme_guide) || [])[idx];
        if (!g) return;
        const meta = [g.area, g.tag, g.hours || g.time, g.fee].filter(Boolean).join(' · ');
        const extra = [g.photo_tip ? `📸 ${g.photo_tip}` : '', g.goshuin ? `⛩️ ${g.goshuin}` : '', g.tips ? `💡 ${g.tips}` : ''].filter(Boolean).join('<br>');
        openItemActionSheet({
            kicker: '✨ 主題絕景指南',
            title: g.name,
            meta,
            desc: g.desc || '',
            extra,
            mapUrl: g.map_url || '',
            favKey: `theme::${g.name || ''}`,
            favScope: 'theme'
        });
    }

    function openPoiCardSheet(poiName, event) {
        if (event && event.target && event.target.closest('a, button')) return;
        const f = ((globalData && globalData.poi_database) || []).find(item => item.name === poiName);
        if (!f) return;
        const meta = [f.area, f.tag, f.hours ? `營業 ${f.hours}` : '', f.closed ? `休 ${f.closed}` : '', f.price].filter(Boolean).join(' · ');
        const extra = [f.signature ? `★ 推薦：${f.signature}` : '', f.access ? `🚶 ${f.access}` : '', f.tips ? `💡 ${f.tips}` : ''].filter(Boolean).join('<br>');
        openItemActionSheet({
            kicker: '☕ 探索雷達詳情',
            title: f.name,
            meta,
            desc: f.desc || '',
            extra,
            mapUrl: f.map_url || '',
            favKey: `poi::${f.name || ''}`,
            favScope: 'poi'
        });
    }

    /* 左右滑動切換單日行程 + Bottom Sheet 往下滑動關閉 */
    function initNativeGestures() {
        const itinEl = document.getElementById('itinerary');
        if (itinEl) {
            let startX = 0, startY = 0, tracking = false;
            itinEl.addEventListener('touchstart', (e) => {
                if (itineraryOverviewMode || e.touches.length !== 1) { tracking = false; return; }
                if (e.target.closest('.day-tab-strip, .filter-row, input, textarea, select')) { tracking = false; return; }
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                tracking = true;
            }, { passive: true });

            itinEl.addEventListener('touchend', (e) => {
                if (!tracking || !e.changedTouches.length) return;
                tracking = false;
                const dx = e.changedTouches[0].clientX - startX;
                const dy = e.changedTouches[0].clientY - startY;
                if (Math.abs(dx) > 58 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                    const days = (globalData && globalData.itinerary) || [];
                    const curIdx = days.findIndex(d => Number(d.day) === Number(activeDayNum));
                    if (dx < 0 && curIdx >= 0 && curIdx < days.length - 1) {
                        selectDayTab(days[curIdx + 1].day, 'next');
                    } else if (dx > 0 && curIdx > 0) {
                        selectDayTab(days[curIdx - 1].day, 'prev');
                    }
                }
            }, { passive: true });
        }

        const sheet = document.getElementById('native-sheet');
        const grabZone = document.getElementById('sheet-grabber-zone');
        if (sheet && grabZone) {
            let sy = 0, dragging = false;
            grabZone.addEventListener('touchstart', (e) => {
                sy = e.touches[0].clientY;
                dragging = true;
                sheet.style.transition = 'none';
            }, { passive: true });
            grabZone.addEventListener('touchmove', (e) => {
                if (!dragging) return;
                const delta = Math.max(0, e.touches[0].clientY - sy);
                sheet.style.transform = `translate(-50%, ${delta}px)`;
            }, { passive: true });
            grabZone.addEventListener('touchend', (e) => {
                if (!dragging) return;
                dragging = false;
                sheet.style.transition = '';
                const delta = e.changedTouches[0].clientY - sy;
                if (delta > 70) closeNativeSheet();
                else sheet.style.transform = '';
            }, { passive: true });
        }
    }

    initPwaAppExperience();
    window.addEventListener('DOMContentLoaded', initNativeGestures);

</script>
</body>
</html>
