    function switchTab(id) {
        if (SUB_TO_PARENT[id]) {
            const parent = SUB_TO_PARENT[id];
            switchTab(parent);
            switchSubPane(parent, id);
            return;
        }
        hapticTick(6);
        if (currentMainTab === id) {
            scrollAppToTop(true);
            return;
        }
        tabScrollMemory[currentMainTab] = getAppScrollTop();
        currentMainTab = id;
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.b-tab').forEach(b => b.classList.remove('active'));
        const targetView = document.getElementById(id);
        if (targetView) targetView.classList.add('active');
        const targetBtn = document.querySelector(`.b-tab[data-tab="${id}"]`);
        if (targetBtn) targetBtn.classList.add('active');
        updateTopbarContext(id);
        setAppScrollTop(tabScrollMemory[id] || 0, false);
    }

    function switchSubPane(parentId, paneId) {
        const parentEl = document.getElementById(parentId);
        if (!parentEl) return;
        parentEl.querySelectorAll('.sub-pane').forEach(p => p.classList.remove('active'));
        parentEl.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        const targetPane = document.getElementById(paneId);
        const targetSeg = document.getElementById(`seg-${paneId}`);
        if (targetPane) targetPane.classList.add('active');
        if (targetSeg) targetSeg.classList.add('active');
        scrollAppToTop();
    }

    function selectDayTab(dayNum, slideDir = '') {
        const prevNum = Number(activeDayNum);
        const dir = slideDir || (Number(dayNum) > prevNum ? 'next' : (Number(dayNum) < prevNum ? 'prev' : ''));
        activeDayNum = dayNum;
        hapticTick(8);
        const needRerender = itineraryOverviewMode || !document.querySelector('#itinerary .day-page');
        itineraryOverviewMode = false;
        if (needRerender) {
            renderItinerary((globalData && globalData.itinerary) || []);
        } else {
            document.querySelectorAll('#itinerary .day-tab-btn').forEach(btn => {
                btn.classList.toggle('active', Number(btn.dataset.day) === Number(dayNum));
            });
            document.querySelectorAll('#itinerary .day-page').forEach(page => {
                const isTarget = Number(page.dataset.day) === Number(dayNum);
                page.classList.remove('slide-next', 'slide-prev');
                page.classList.toggle('active', isTarget);
                if (isTarget && dir) {
                    void page.offsetWidth;
                    page.classList.add(dir === 'next' ? 'slide-next' : 'slide-prev');
                }
            });
        }
        updateTopbarContext('itinerary');

        const activeBtn = document.querySelector(`#itinerary .day-tab-btn[data-day="${dayNum}"]`);
        if (activeBtn) {
            activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
        tabScrollMemory.itinerary = 0;
        scrollAppToTop();
    }

    function calculateDiff() {
        if (!globalData.itinerary || globalData.itinerary.length === 0) {
            document.getElementById('dashboard').innerHTML = '<div class="panel-card">尚未建立行程資料。</div>';
            return;
        }
        const rawDate = globalData.itinerary[0].date_full;
        if (rawDate) {
            const parts = String(rawDate).split('-').map(Number);
            if (parts.length === 3 && !parts.some(isNaN)) {
                const start = new Date(parts[0], parts[1] - 1, parts[2]);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                tripDiffDays = Math.ceil((start - today) / (1000 * 60 * 60 * 24));
            } else {
                tripDiffDays = 0;
            }
        } else {
            tripDiffDays = 0;
        }
        renderDashboard();
    }

    function getFocusDay() {
        const days = (globalData && globalData.itinerary) || [];
        if (!days.length) return null;
        if (tripDiffDays > 0) return days[0];
        const todayStr = getLocalTodayIso();
        return days.find(d => d.date_full === todayStr) || days[days.length - 1];
    }

    function getChecklistPct() {
        const items = (globalData && globalData.checklist_items) || [];
        if (items.length === 0) return '0%';
        const validChecked = checkedItems.filter(i => items.includes(i)).length;
        return Math.round((validChecked / items.length) * 100) + '%';
    }

    /* ================= Open-Meteo 即時天氣 ================= */
    function fetchWeather() {
        const days = (globalData && globalData.itinerary) || [];
        const focusDay = getFocusDay();
        days.forEach(d => {
            if (!d.coords || !d.date_full) return;
            const parts = String(d.coords).split(',');
            if (parts.length < 2) return;
            const lat = parts[0].trim();
            const lon = parts[1].trim();
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`)
                .then(r => r.json())
                .then(data => {
                    if (!data.daily || !data.daily.time) return;
                    const idx = data.daily.time.indexOf(d.date_full);
                    if (idx === -1) return;
                    const code = data.daily.weathercode[idx];
                    const tMax = Math.round(data.daily.temperature_2m_max[idx]);
                    const tMin = Math.round(data.daily.temperature_2m_min[idx]);

                    let emoji = '☁️';
                    if (code === 0) emoji = '☀️';
                    else if (code >= 1 && code <= 3) emoji = '⛅';
                    else if (code >= 45 && code <= 48) emoji = '🌫️';
                    else if (code >= 51 && code <= 67) emoji = '🌧️';
                    else if (code >= 71 && code <= 82) emoji = '❄️';
                    else if (code >= 95) emoji = '⛈️';

                    const tempStr = `${emoji} ${tMin}°~${tMax}°C`;
                    liveWeatherCache[d.day] = tempStr;

                    const dayPill = document.getElementById(`weather-day-${d.day}`);
                    if (dayPill) dayPill.innerText = tempStr;

                    if (focusDay && d.day === focusDay.day) {
                        const dashEl = document.getElementById('dash-weather');
                        if (dashEl) dashEl.innerText = tempStr;
                    }
                })
                .catch(() => {});
        });
    }

    function calcGreatCircleStats(lat1, lon1, lat2, lon2) {
        if ([lat1, lon1, lat2, lon2].some(v => typeof v !== 'number' || isNaN(v))) return null;
        const R = 6371;
        const toRad = d => d * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        const km = Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        if (km <= 0) return null;
        const estMins = Math.round((km / 820) * 60 + 30);
        const h = Math.floor(estMins / 60);
        const m = estMins % 60;
        return { km, estMins, estDuration: h > 0 ? `~${h}h ${m}m` : `~${m}m` };
    }

    function formatIsoToLocalHHMM(isoOrStr) {
        if (!isoOrStr) return '';
        const s = String(isoOrStr).trim();
        const directMatch = s.match(/(?:T|\s)(\d{2}:\d{2})/);
        if (directMatch) return directMatch[1];
        const hhmmMatch = s.match(/^(\d{1,2}:\d{2})$/);
        if (hhmmMatch) return hhmmMatch[1].padStart(5, '0');
        return '';
    }

    function extractAllTimesFromText(str) {
        if (!str) return [];
        const matches = String(str).match(/\b([01]?\d|2[0-3]):[0-5]\d(?:\s*\+\d)?\b/g);
        return matches ? matches.map(t => t.replace(/\s+/g, '')) : [];
    }

    function parseDurationToMins(durStr) {
        if (!durStr) return 0;
        const s = String(durStr);
        const hm = s.match(/(\d+)\s*h(?:ours?|r)?\s*(\d+)?/i);
        if (hm) return parseInt(hm[1], 10) * 60 + (hm[2] ? parseInt(hm[2], 10) : 0);
        const zhHm = s.match(/(\d+)\s*小時\s*(\d+)?/);
        if (zhHm) return parseInt(zhHm[1], 10) * 60 + (zhHm[2] ? parseInt(zhHm[2], 10) : 0);
        return 0;
    }

    function estimateArrivalWithTimezone(depHHMM, durationMins, depTz, arrTz) {
        if (!depHHMM || !durationMins) return '';
        const m = depHHMM.match(/^(\d{1,2}):(\d{2})/);
        if (!m) return '';
        const depMins = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
        let tzShiftMins = 0;
        if (typeof depTz === 'number' && !isNaN(depTz) && typeof arrTz === 'number' && !isNaN(arrTz)) {
            tzShiftMins = Math.round((arrTz - depTz) * 60);
        }
        let total = depMins + durationMins + tzShiftMins;
        let dayOffset = 0;
        while (total >= 1440) { total -= 1440; dayOffset += 1; }
        while (total < 0) { total += 1440; dayOffset -= 1; }
        const hh = String(Math.floor(total / 60)).padStart(2, '0');
        const mm = String(total % 60).padStart(2, '0');
        const suffix = dayOffset > 0 ? `+${dayOffset}` : (dayOffset < 0 ? `${dayOffset}` : '');
        return `~${hh}:${mm}${suffix}`;
    }

    function normalizeAdsbAirport(ap) {
        if (!ap) return null;
        const iata = String(ap.iata_code || '').toUpperCase();
        const ref = AIRPORT_REF_DB[iata];
        const lat = Number(ap.latitude);
        const lon = Number(ap.longitude);
        return {
            iata,
            icao: ap.icao_code || ref?.icao || '',
            name: ap.name || ref?.name || '',
            city: ap.municipality || ref?.city || '',
            lat: !isNaN(lat) ? lat : ref?.lat,
            lon: !isNaN(lon) ? lon : ref?.lon,
            tz: ref ? ref.tz : (!isNaN(lon) ? Math.round(lon / 15) : null)
        };
    }

    async function queryAdsbdbForFlight(f, forceRefresh = false) {
        const callsign = sanitizeCallsign(f.flight_no);
        const reg = extractRegOrHex(f);
        if (!callsign && !reg) return null;

        const cacheKey = `${callsign}|${reg}`;
        const cached = adsbdbMemoryCache[cacheKey];
        if (!forceRefresh && cached && (Date.now() - cached.ts < ADSBDB_TTL_MS)) {
            return cached.data;
        }
        if (adsbdbInFlight[cacheKey]) return adsbdbInFlight[cacheKey];

        adsbdbInFlight[cacheKey] = (async () => {
            const result = {
                matchedRoute: false,
                airlineName: '',
                airlineIcao: '',
                airlineCallsign: '',
                origin: null,
                midpoint: null,
                destination: null,
                airportsByIata: {},
                aircraftType: '',
                aircraftManufacturer: ''
            };

            try {
                if (callsign) {
                    const res = await fetch(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(callsign)}`);
                    if (res.ok) {
                        const json = await res.json();
                        const fr = json?.response?.flightroute;
                        if (fr) {
                            result.matchedRoute = true;
                            if (fr.airline) {
                                result.airlineName = fr.airline.name || '';
                                result.airlineIcao = fr.airline.icao || '';
                                result.airlineCallsign = fr.airline.callsign || '';
                            }
                            result.origin = normalizeAdsbAirport(fr.origin);
                            result.midpoint = normalizeAdsbAirport(fr.midpoint);
                            result.destination = normalizeAdsbAirport(fr.destination);

                            [result.origin, result.midpoint, result.destination].forEach(ap => {
                                if (ap && ap.iata) result.airportsByIata[ap.iata] = ap;
                            });
                        }
                    }

                    if (!result.airlineName) {
                        const prefixMatch = callsign.match(/^([A-Z]{2,3})[0-9]/);
                        if (prefixMatch) {
                            const aRes = await fetch(`https://api.adsbdb.com/v0/airline/${encodeURIComponent(prefixMatch[1])}`);
                            if (aRes.ok) {
                                const aJson = await aRes.json();
                                const al = Array.isArray(aJson?.response) ? aJson.response[0] : aJson?.response;
                                if (al) {
                                    result.airlineName = al.name || '';
                                    result.airlineIcao = al.icao || '';
                                    result.airlineCallsign = al.callsign || '';
                                }
                            }
                        }
                    }
                }

                if (reg) {
                    const acRes = await fetch(`https://api.adsbdb.com/v0/aircraft/${encodeURIComponent(reg)}`);
                    if (acRes.ok) {
                        const acJson = await acRes.json();
                        const ac = acJson?.response?.aircraft;
                        if (ac) {
                            result.aircraftType = ac.type || '';
                            result.aircraftManufacturer = ac.manufacturer || '';
                        }
                    }
                }
            } catch (err) {
                // 離線狀態靜默降級
            } finally {
                delete adsbdbInFlight[cacheKey];
            }

            adsbdbMemoryCache[cacheKey] = { ts: Date.now(), data: result };
            saveAdsbdbCache();
            return result;
        })();

        return adsbdbInFlight[cacheKey];
    }

    async function queryLiveScheduleForFlight(f, forceRefresh = false) {
        const callsign = sanitizeCallsign(f.flight_no);
        if (!callsign) return null;

        const cfg = getLiveApiConfig();
        const provider = cfg.provider || 'airlabs';
        const apiKey = (cfg.apiKey || '').trim();
        if (!apiKey) return null;

        const routeStr = f.route || '';
        const iataMatches = routeStr.match(/\b[A-Z]{3}\b/g);
        const wantDep = (f.dep_code || (iataMatches && iataMatches[0]) || '').toUpperCase();
        const wantArr = (f.arr_code || (iataMatches && iataMatches[1]) || '').toUpperCase();

        const cacheKey = `${provider}|${callsign}|${wantDep}-${wantArr}|${f.date || ''}`;
        const cached = liveSchedMemoryCache[cacheKey];
        if (!forceRefresh && cached && (Date.now() - cached.ts < LIVE_SCHED_TTL_MS)) {
            return cached.data;
        }
        if (liveSchedInFlight[cacheKey]) return liveSchedInFlight[cacheKey];

        liveSchedInFlight[cacheKey] = (async () => {
            let liveResult = null;
            try {
                if (provider === 'airlabs') {
                    const schedParams = new URLSearchParams({ flight_iata: callsign, api_key: apiKey });
                    if (wantDep) schedParams.set('dep_iata', wantDep);
                    if (wantArr) schedParams.set('arr_iata', wantArr);
                    const schedRes = await fetch(`https://airlabs.co/api/v9/schedules?${schedParams.toString()}`);
                    let r = null;
                    if (schedRes.ok) {
                        const sJson = await schedRes.json();
                        const list = Array.isArray(sJson?.response) ? sJson.response : [];
                        r = list.find(item =>
                            (!wantDep || String(item.dep_iata || '').toUpperCase() === wantDep) &&
                            (!wantArr || String(item.arr_iata || '').toUpperCase() === wantArr)
                        ) || list[0] || null;
                    }
                    if (!r) {
                        const fRes = await fetch(`https://airlabs.co/api/v9/flight?flight_iata=${encodeURIComponent(callsign)}&api_key=${encodeURIComponent(apiKey)}`);
                        if (fRes.ok) {
                            const fJson = await fRes.json();
                            const cand = fJson?.response;
                            if (cand && (!wantDep || String(cand.dep_iata || '').toUpperCase() === wantDep) && (!wantArr || String(cand.arr_iata || '').toUpperCase() === wantArr)) {
                                r = cand;
                            }
                        }
                    }
                    if (r && (r.dep_time || r.arr_time)) {
                        liveResult = {
                            provider: 'AirLabs LIVE',
                            depTime: formatIsoToLocalHHMM(r.dep_actual || r.dep_estimated || r.dep_time),
                            arrTime: formatIsoToLocalHHMM(r.arr_actual || r.arr_estimated || r.arr_time),
                            depTerminal: r.dep_terminal || '',
                            arrTerminal: r.arr_terminal || '',
                            depGate: r.dep_gate || '',
                            arrGate: r.arr_gate || '',
                            status: r.status || '',
                            durationMins: Number(r.duration) || 0,
                            aircraftIcao: r.aircraft_icao || '',
                            regNumber: r.reg_number || ''
                        };
                    }
                } else if (provider === 'aviationstack') {
                    const params = new URLSearchParams({ access_key: apiKey, flight_iata: callsign, limit: '10' });
                    if (wantDep) params.set('dep_iata', wantDep);
                    if (wantArr) params.set('arr_iata', wantArr);
                    const res = await fetch(`https://api.aviationstack.com/v1/flights?${params.toString()}`);
                    if (res.ok) {
                        const json = await res.json();
                        const list = Array.isArray(json?.data) ? json.data : [];
                        const r = list.find(item =>
                            (!wantDep || String(item.departure?.iata || '').toUpperCase() === wantDep) &&
                            (!wantArr || String(item.arrival?.iata || '').toUpperCase() === wantArr)
                        ) || list[0] || null;
                        if (r && (r.departure || r.arrival)) {
                            liveResult = {
                                provider: 'AviationStack LIVE',
                                depTime: formatIsoToLocalHHMM(r.departure?.actual || r.departure?.estimated || r.departure?.scheduled),
                                arrTime: formatIsoToLocalHHMM(r.arrival?.actual || r.arrival?.estimated || r.arrival?.scheduled),
                                depTerminal: r.departure?.terminal || '',
                                arrTerminal: r.arrival?.terminal || '',
                                depGate: r.departure?.gate || '',
                                arrGate: r.arrival?.gate || '',
                                status: r.flight_status || '',
                                durationMins: 0,
                                aircraftIcao: r.aircraft?.icao || '',
                                regNumber: r.aircraft?.registration || ''
                            };
                        }
                    }
                } else if (provider === 'aerodatabox') {
                    const dateMatch = String(f.date || '').match(/(\d{4}-\d{2}-\d{2})/);
                    const targetDate = dateMatch ? dateMatch[1] : getLocalTodayIso();
                    const url = `https://aerodatabox.p.rapidapi.com/flights/number/${encodeURIComponent(callsign)}/${targetDate}`;
                    const res = await fetch(url, {
                        headers: {
                            'X-RapidAPI-Key': apiKey,
                            'X-RapidAPI-Host': 'aerodatabox.p.rapidapi.com'
                        }
                    });
                    if (res.ok) {
                        const json = await res.json();
                        const list = Array.isArray(json) ? json : [];
                        const r = list.find(item =>
                            (!wantDep || String(item.departure?.airport?.iata || '').toUpperCase() === wantDep) &&
                            (!wantArr || String(item.arrival?.airport?.iata || '').toUpperCase() === wantArr)
                        ) || list[0] || null;
                        if (r && (r.departure || r.arrival)) {
                            liveResult = {
                                provider: 'AeroDataBox LIVE',
                                depTime: formatIsoToLocalHHMM(r.departure?.revisedTime?.local || r.departure?.scheduledTime?.local),
                                arrTime: formatIsoToLocalHHMM(r.arrival?.revisedTime?.local || r.arrival?.scheduledTime?.local),
                                depTerminal: r.departure?.terminal || '',
                                arrTerminal: r.arrival?.terminal || '',
                                depGate: r.departure?.gate || '',
                                arrGate: r.arrival?.gate || '',
                                status: r.status || '',
                                durationMins: 0,
                                aircraftIcao: r.aircraft?.model || '',
                                regNumber: r.aircraft?.reg || ''
                            };
                        }
                    }
                }
            } catch (e) {
                liveResult = null;
            } finally {
                delete liveSchedInFlight[cacheKey];
            }

            if (liveResult) {
                liveSchedMemoryCache[cacheKey] = { ts: Date.now(), data: liveResult };
                saveLiveSchedCache();
            }
            return liveResult;
        })();

        return liveSchedInFlight[cacheKey];
    }

    async function enrichAllFlightsWithAdsbdb(forceRefresh = false) {

            ]);

    function resolveAirportEndpoint(iataCode, adsb) {
        const code = String(iataCode || '').toUpperCase();
        const adsbAp = adsb?.airportsByIata?.[code]
            || [adsb?.origin, adsb?.midpoint, adsb?.destination].find(ap => ap && String(ap.iata || '').toUpperCase() === code)
            || null;
        const refAp = AIRPORT_REF_DB[code] || null;
        if (!adsbAp && !refAp) return null;
        return {
            iata: code,
            icao: adsbAp?.icao || refAp?.icao || '',
            name: adsbAp?.name || refAp?.name || '',
            city: adsbAp?.city || refAp?.city || '',
            lat: typeof adsbAp?.lat === 'number' && !isNaN(adsbAp.lat) ? adsbAp.lat : refAp?.lat,
            lon: typeof adsbAp?.lon === 'number' && !isNaN(adsbAp.lon) ? adsbAp.lon : refAp?.lon,
            tz: refAp ? refAp.tz : (typeof adsbAp?.tz === 'number' ? adsbAp.tz : null)
        };
    }

    function parseFlightMeta(f) {
        const routeStr = f.route || '';
        const timeStr = f.time || '';
        const iataMatches = routeStr.match(/\b[A-Z]{3}\b/g);
        const parts = routeStr.split(/➔|->|→|—|-|至/).map(s => s.trim()).filter(Boolean);

        const callsign = sanitizeCallsign(f.flight_no);
        const reg = extractRegOrHex(f);
        const cachedEntry = adsbdbMemoryCache[`${callsign}|${reg}`];
        const adsb = cachedEntry ? cachedEntry.data : null;

        const depCode = (f.dep_code || (iataMatches && iataMatches[0]) || adsb?.origin?.iata || (parts[0] ? parts[0].slice(0, 4) : 'DEP')).toUpperCase();
        const arrCode = (f.arr_code || (iataMatches && iataMatches[1]) || adsb?.destination?.iata || (parts[1] ? parts[1].slice(0, 4) : 'ARR')).toUpperCase();

        const cfg = getLiveApiConfig();
        const liveEntry = liveSchedMemoryCache[`${cfg.provider || 'airlabs'}|${callsign}|${depCode}-${arrCode}|${f.date || ''}`];
        const live = liveEntry ? liveEntry.data : null;

        const depEndpoint = resolveAirportEndpoint(depCode, adsb);
        const arrEndpoint = resolveAirportEndpoint(arrCode, adsb);

        const parsedDepCity = f.dep_city || (parts[0] ? parts[0].replace(depCode, '').replace(/[()]/g, '').trim() : '');
        const parsedArrCity = f.arr_city || (parts[1] ? parts[1].replace(arrCode, '').replace(/[()]/g, '').trim() : '');

        const depCity = parsedDepCity || depEndpoint?.city || depCode;
        const arrCity = parsedArrCity || arrEndpoint?.city || arrCode;

        const legStats = (depEndpoint && arrEndpoint)
            ? calcGreatCircleStats(depEndpoint.lat, depEndpoint.lon, arrEndpoint.lat, arrEndpoint.lon)
            : null;

        const extractedTimes = [
            ...extractAllTimesFromText(timeStr),
            ...extractAllTimesFromText(f.note)
        ];
        let depTime = live?.depTime || f.dep_time || extractedTimes[0] || '';
        let arrTime = live?.arrTime || f.arr_time || extractedTimes[1] || '';

        const knownDurMins = parseDurationToMins(f.duration) || live?.durationMins || legStats?.estMins || 0;
        let arrIsEstimated = false;
        if (depTime && !arrTime && knownDurMins > 0) {
            arrTime = estimateArrivalWithTimezone(
                depTime,
                knownDurMins,
                depEndpoint?.tz,
                arrEndpoint?.tz
            );
            arrIsEstimated = Boolean(arrTime);
        }

        if (!depTime) depTime = '--:--';
        if (!arrTime) arrTime = '--:--';

        const terminalLabel = f.terminal || [
            live?.depTerminal ? `T${live.depTerminal}` : '',
            live?.arrTerminal ? `T${live.arrTerminal}` : ''
        ].filter(Boolean).join(' ➔ ');

        const gateLabel = [
            live?.depGate ? `登機門 ${live.depGate}` : '',
            live?.arrGate ? `抵達門 ${live.arrGate}` : ''
        ].filter(Boolean).join(' · ');

        const adsbMap = adsb?.airportsByIata || {};
        const adsbHasLegPoint = Boolean(
            adsbMap[depCode] || adsbMap[arrCode] ||
            adsb?.origin?.iata === depCode || adsb?.origin?.iata === arrCode ||
            adsb?.midpoint?.iata === depCode || adsb?.midpoint?.iata === arrCode ||
            adsb?.destination?.iata === depCode || adsb?.destination?.iata === arrCode
        );
        const isFifthFreedomLeg = Boolean(
            adsb && adsb.matchedRoute &&
            (adsb.origin?.iata !== depCode || adsb.destination?.iata !== arrCode) &&
            adsbHasLegPoint
        );

        return {
            flightNo: f.flight_no || 'FLIGHT',
            callsign,
            date: f.date || '',
            depCode,
            arrCode,
            depCity,
            arrCity,
            depIcao: depEndpoint?.icao || '',
            arrIcao: arrEndpoint?.icao || '',
            depFullName: depEndpoint?.name || '',
            arrFullName: arrEndpoint?.name || '',
            depTime,
            arrTime,
            arrIsEstimated,
            liveSource: live?.provider || '',
            liveStatus: live?.status || '',
            duration: f.duration || (live?.durationMins ? `${Math.floor(live.durationMins / 60)}h ${live.durationMins % 60}m` : '') || legStats?.estDuration || 'DIRECT',
            distanceKm: legStats?.km || null,
            isFifthFreedomLeg,
            fullRouteHint: isFifthFreedomLeg && adsb?.origin?.iata && adsb?.destination?.iata
                ? `全航線 ${adsb.origin.iata}→${adsb.midpoint?.iata ? adsb.midpoint.iata + '→' : ''}${adsb.destination.iata}`
                : '',
            airlineName: f.airline || adsb?.airlineName || '',
            airlineIcao: adsb?.airlineIcao || '',
            airlineCallsign: adsb?.airlineCallsign || '',
            aircraftType: f.aircraft || live?.aircraftIcao || (adsb?.aircraftType ? `${adsb.aircraftManufacturer} ${adsb.aircraftType}`.trim() : ''),
            adsbMatched: Boolean(live || (adsb && (adsb.matchedRoute || adsb.airlineName || adsb.aircraftType))),
            adsbPending: !adsb && !live && Boolean(callsign),
            terminal: terminalLabel,
            gate: gateLabel,
            seat: f.seat || '',
            pnr: f.pnr || '',
            note: f.note || ''
        };
    }

                    <div id="dash-fx-val" class="bento-val tabular-nums">1 ${cur.toUpperCase()} ≈ ${displayRate}</div>
                    <div class="bento-sub">點此開啟即時換算</div>
                </div>
                <div class="bento-tile" onclick="switchTab('checklist')">
                    <div class="bento-label"><span>✅ 行前清單</span><span>CHECKLIST</span></div>
                    <div id="dash-chk-val" class="bento-val tabular-nums">${chkPct}</div>
                    <div class="bento-sub">裝備與證件進度</div>
                </div>
                <div class="bento-tile" onclick="switchTab('flights')">
                    <div class="bento-label"><span>✈️ 航班住宿</span><span>VAULT</span></div>
                    <div class="bento-val tabular-nums">${flights.length} 航段 / ${hotels.length} 宿</div>
                    <div class="bento-sub">憑證與飯店導航</div>
                </div>
            </div>

            ${focusSlotsHtml ? `
                <div class="panel-card">
                    <div class="panel-head">
                        <span class="panel-title">📌 Day ${focusDay.day} 重點節點</span>
                        <span class="panel-link" onclick="switchTab('itinerary'); selectDayTab(${focusDay.day});">查看當日 ›</span>
                    </div>
                    ${focusSlotsHtml}
                </div>` : ''}
        `;
    }

    /* ================= 行程渲染（滿寬單層卡片 + 精簡時間表切換） ================= */
    let itineraryCompactMode = false;

    function parseActivityTitle(rawTitle) {
        const str = String(rawTitle || '').trim();
        if (!str) return { kicker: '', title: '未命名節點' };
        const colonMatch = str.match(/^([^：:]{2,26})[：:]\s*(.+)$/);
        if (colonMatch) {
            const k = colonMatch[1].replace(/[（(]/g, ' · ').replace(/[）)]/g, '').replace(/\s*·\s*$/, '').trim();
            return { kicker: k, title: colonMatch[2].trim() };
        }
        return { kicker: '', title: str };
    }

    function formatCleanParagraphs(text) {
        const lines = String(text || '').trim().split(/\n+/).map(s => s.trim()).filter(Boolean);
        if (!lines.length) return '';
        if (lines.length === 1) return lines[0];
        return lines.map(l => `<p>${l}</p>`).join('');
    }

    function toggleItineraryCompactMode() {
        itineraryCompactMode = !itineraryCompactMode;
        renderItinerary((globalData && globalData.itinerary) || []);
    }

    function scrollToDayNotes(dayNum) {
        const el = document.getElementById(`day-notes-${dayNum}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function getMoveIcon(t) {
        if (!t) return '🚗';
        const txt = t.toLowerCase();
        if (txt.includes('walk') || txt.includes('步行')) return '🚶';
        if (txt.includes('flight') || txt.includes('機')) return '✈️';
        if (txt.includes('ferry') || txt.includes('渡輪') || txt.includes('船')) return '⛴️';
        if (txt.includes('bus') || txt.includes('巴士') || txt.includes('專車')) return '🚌';
        if (txt.includes('jr') || txt.includes('train') || txt.includes('火車') || txt.includes('鐵') || txt.includes('線') || txt.includes('metro')) return '🚆';
        return '🚗';
    }

    function detectSlotKind(s) {
        const text = `${s.activity || ''} ${s.desc || ''} ${s.transport || ''}`.toLowerCase();
        if (text.includes('搭') || text.includes('移動') || text.includes('機場') || text.includes('站') || s.transport) return 'kind-move';
        if (text.includes('check-in') || text.includes('飯店') || text.includes('旅館') || text.includes('hotel')) return 'kind-stay';
        return 'kind-spot';
    }

    function formatMinutes(totalMins) {
        if (!totalMins || totalMins <= 0) return '';
        const h = Math.floor(totalMins / 60);
        const m = totalMins % 60;
        if (h > 0 && m > 0) return `${h}h ${m}m`;
        if (h > 0) return `${h}h`;
        return `${m}m`;
    }

    function renderItinerary(days) {
        const container = document.getElementById('itinerary');
        if (!days || !days.length) {
            container.innerHTML = '<div class="panel-card" style="margin-top: 12px;">尚無每日行程資料。</div>';
            return;
        }

        if (!activeDayNum || !days.some(d => d.day === activeDayNum)) {
            activeDayNum = days[0].day;
        }

        if (itineraryOverviewMode) {
            container.innerHTML = `
                <div style="padding-top: 12px;">
                    <div class="section-kicker">
                        <span class="section-kicker-title">🗓️ 全行程總覽</span>
                        <span class="section-kicker-meta">共 ${days.length} 天 · 點擊進入單日</span>
                    </div>
                    ${days.map(d => `
                        <div class="overview-card" onclick="selectDayTab(${d.day})">
                            <div style="min-width: 0; flex: 1;">
                                <div class="day-kicker tabular-nums">DAY ${d.day} · ${d.date || ''} ${liveWeatherCache[d.day] || d.weather || ''}</div>
                                <div style="font-family: 'Noto Serif TC', serif; font-size: 0.96rem; font-weight: 900; margin-top: 2px; overflow-wrap: anywhere;">${d.title || '未命名行程'}</div>
                                <div style="font-size: 0.74rem; color: var(--text-secondary); margin-top: 3px;">
                                    ${(d.schedule || []).length} 個節點 ${d.hotel && d.hotel.name ? `· 🏨 ${d.hotel.name}` : ''}
                                </div>
                            </div>
                            <span class="mini-pill accent" style="flex-shrink: 0;">進入 ›</span>
                        </div>
                    `).join('')}
                </div>
            `;
            return;
        }

        const tabBarHtml = '<div class="day-tab-strip is-sticky" id="day-tab-strip">' + days.map(d => `
            <button type="button" class="day-tab-btn ${d.day === activeDayNum ? 'active' : ''}" data-day="${d.day}" onclick="selectDayTab(${d.day})">
                <span class="dp-day tabular-nums">D${d.day}</span>
                <span class="dp-date">${(d.date || '').split(' ')[0]}</span>
            </button>
        `).join('') + '</div>';

        const pagesHtml = days.map((d, idx) => {
            const isActive = d.day === activeDayNum ? 'active' : '';
            const prevDay = idx > 0 ? days[idx - 1] : null;
            const nextDay = idx < days.length - 1 ? days[idx + 1] : null;

            const scheduleList = d.schedule || [];
            const totalStay = scheduleList.reduce((acc, s) => acc + (Number(s.stay) || 0), 0);
            const totalMove = scheduleList.reduce((acc, s) => acc + (Number(s.move) || 0), 0);

            const statsSummary = [
                `${scheduleList.length} 節點`,
                totalStay > 0 ? `停留 ${formatMinutes(totalStay)}` : '',
                totalMove > 0 ? `移動 ${formatMinutes(totalMove)}` : ''
            ].filter(Boolean).join(' · ');

            // 備案 / 導讀 / 攝影筆記 / 營運資訊集中為單層扁平備忘卡，置於時間軸下方（上方提供快速跳轉）
            const noteSections = [];
            if (d.plan_b) {
                noteSections.push(`
                    <div class="day-note-section">
                        <div class="day-note-label">💡 備案提示</div>
                        <div class="day-note-body">${formatCleanParagraphs(d.plan_b)}</div>
                    </div>`);
            }
            if (d.story_block) {
                noteSections.push(`
                    <div class="day-note-section">
                        <div class="day-note-label">📖 今日導讀</div>
                        <div class="day-note-body is-serif">${formatCleanParagraphs(d.story_block)}</div>
                    </div>`);
            }
            if (d.photo_notes) {
                noteSections.push(`
                    <div class="day-note-section">
                        <div class="day-note-label">📸 攝影筆記</div>
                        <div class="day-note-body">${formatCleanParagraphs(d.photo_notes)}</div>
                    </div>`);
            }
            if (Array.isArray(d.operational_modules) && d.operational_modules.length) {
                d.operational_modules.forEach(op => {
                    noteSections.push(`
                        <div class="day-note-section">
                            <div class="day-note-label">📋 ${op.title}</div>
                            <div class="day-note-kv">
                                ${(op.fields || []).map(f => `
                                    <div style="min-width: 0; ${f.full_width ? 'grid-column: 1 / -1;' : ''}">
                                        <div style="font-size: 0.7rem; color: var(--text-muted);">${f.label}</div>
                                        <div style="font-size: 0.81rem; font-weight: 700; color: var(--text-primary); overflow-wrap: anywhere;">${f.value}</div>
                                    </div>`).join('')}
                            </div>
                        </div>`);
                });
            }

            const notesJumpHtml = noteSections.length
                ? `<button type="button" class="day-jump-link" onclick="scrollToDayNotes(${d.day})">備案與筆記 ↓</button>`
                : '';

            const alertHtml = d.critical_alert ? `
                <div class="day-alert-strip">
                    <div class="day-alert-label">⚠️ 關鍵提醒</div>
                    <div>${formatCleanParagraphs(d.critical_alert)}</div>
                </div>` : '';

            // 時間軸：100% 滿寬卡片（詳細閱讀 vs 精簡時間表）
            let schedBodyHtml = '<div class="panel-card">當日尚未新增時間軸節點。</div>';
            if (scheduleList.length) {
                if (itineraryCompactMode) {
                    schedBodyHtml = `
                        <div class="sched-list is-compact">
                            ${scheduleList.map((s, sIdx) => {
                                const kind = detectSlotKind(s);
                                const parsed = parseActivityTitle(s.activity);
                                const subParts = [];
                                if (s.transport) subParts.push(`${getMoveIcon(s.transport)} ${s.from && s.to ? `${s.from} → ${s.to}` : s.transport}`);
                                if (s.stay > 0) subParts.push(`停留 ${s.stay}m`);
                                if (s.move > 0) subParts.push(`移動 ${s.move}m`);
                                return `
                                    <div class="sched-compact-row ${kind}" onclick="openSchedCardSheet(${d.day}, ${sIdx}, event)">
                                        <div class="sched-compact-left">
                                            <div class="sched-compact-time tabular-nums">${s.time || '--:--'}${subParts.length ? ` · ${subParts.join(' · ')}` : ''}</div>
                                            <div class="sched-compact-title">${parsed.title}</div>
                                        </div>
                                        ${s.map_url ? `<a href="${s.map_url}" target="_blank" rel="noopener" class="map-chip">📍 導航</a>` : ''}
                                    </div>`;
                            }).join('')}
                        </div>`;
                } else {
                    schedBodyHtml = `
                        <div class="sched-list">
                            ${scheduleList.map((s, sIdx) => {
                                const kind = detectSlotKind(s);
                                const parsed = parseActivityTitle(s.activity);
                                const subParts = [];
                                if (s.transport) subParts.push(`${getMoveIcon(s.transport)} ${s.from && s.to ? `${s.from} → ${s.to}` : s.transport}`);
                                if (s.stay > 0) subParts.push(`停留 ${s.stay}m`);
                                if (s.move > 0) subParts.push(`移動 ${s.move}m`);
                                return `
                                    <div class="sched-card ${kind}" onclick="openSchedCardSheet(${d.day}, ${sIdx}, event)">
                                        <div class="sched-meta-row">
                                            <div class="sched-time-meta tabular-nums">
                                                <span class="sched-time">${s.time || '--:--'}</span>
                                                ${subParts.length ? `<span class="sched-submeta">${subParts.join(' · ')}</span>` : ''}
                                            </div>
                                            ${s.map_url ? `<a href="${s.map_url}" target="_blank" rel="noopener" class="map-chip">📍 導航</a>` : ''}
                                        </div>
                                        ${parsed.kicker ? `<div class="sched-kicker">${parsed.kicker}</div>` : ''}
                                        <div class="sched-title">${parsed.title}</div>
                                        ${s.desc ? `<div class="sched-desc">${formatCleanParagraphs(s.desc)}</div>` : ''}
                                    </div>`;
                            }).join('')}
                        </div>`;
                }
            }

            const schedSectionHtml = `
                <div class="section-kicker" style="padding-top: 2px;">
                    <span class="section-kicker-title">行程動線</span>
                    <button type="button" class="mode-switch-btn ${itineraryCompactMode ? 'active' : ''}" onclick="toggleItineraryCompactMode()">
                        ${itineraryCompactMode ? '切換詳細閱讀' : '切換精簡時間表'}
                    </button>
                </div>
                ${schedBodyHtml}`;

            const dayNotesHtml = noteSections.length ? `
                <div id="day-notes-${d.day}" class="section-kicker">
                    <span class="section-kicker-title">當日備案與筆記</span>
                </div>
                <div class="day-notes-card">${noteSections.join('')}</div>` : '';

            const hotelHtml = d.hotel ? `
                <div class="stay-card">
                    <div class="stay-top">
                        <span class="stay-date-pill">🏨 今晚下榻</span>
                        ${d.hotel.map_url ? `<a href="${d.hotel.map_url}" target="_blank" rel="noopener" class="map-chip">📍 導航</a>` : ''}
                    </div>
                    <div class="stay-name" style="margin-bottom: 0;">${d.hotel.name}</div>
                </div>` : '';

            const pagerHtml = days.length > 1 ? `
                <div class="day-pager">
                    <button type="button" class="pager-btn" ${prevDay ? `onclick="selectDayTab(${prevDay.day})"` : 'disabled'}>
                        ◀ ${prevDay ? `Day ${prevDay.day}` : '已是最前一天'}
                    </button>
                    <button type="button" class="pager-btn" ${nextDay ? `onclick="selectDayTab(${nextDay.day})"` : 'disabled'}>
                        ${nextDay ? `Day ${nextDay.day}` : '已是最後一天'} ▶
                    </button>
                </div>` : '';

            const dayWeather = liveWeatherCache[d.day] || d.weather || '';

            return `
                <section class="day-page ${isActive}" data-day="${d.day}">
                    <div class="day-hero-card">
                        <div class="day-hero-top">
                            <span class="day-kicker tabular-nums">DAY ${d.day} · ${d.date || ''}</span>
                            ${dayWeather ? `<span class="day-weather-pill" id="weather-day-${d.day}">${dayWeather}</span>` : `<span class="day-weather-pill" id="weather-day-${d.day}" style="display:none;"></span>`}
                        </div>
                        <h2 class="day-card-title">${d.title || '未命名行程'}</h2>
                        ${d.subtitle ? `<div class="day-card-sub">${d.subtitle}</div>` : ''}
                        <div class="day-jump-bar">
                            <span class="day-stats-inline tabular-nums">${statsSummary}</span>
                            ${notesJumpHtml}
                        </div>
                    </div>
                    ${alertHtml}
                    ${schedSectionHtml}
                    ${dayNotesHtml}
                    ${hotelHtml}
                    ${pagerHtml}
                </section>`;
        }).join('');

        container.innerHTML = tabBarHtml + pagesHtml;
    }

    function renderFlights(data) {
        const flights = (data && data.flights) || [];
        const hotels = (data && data.hotels) || [];

        const ticketsHtml = flights.length
            ? flights.map(f => buildFlightyCardHtml(f, false)).join('')
            : '<div class="callout-box">尚無航班資訊</div>';

        const hotelsHtml = hotels.length ? hotels.map(h => `
            <div class="stay-card">
                <div class="stay-top">
                    <span class="stay-date-pill tabular-nums">📅 ${h.date_str || '入住日期未填'}</span>
                    ${h.map_url ? `<a href="${h.map_url}" target="_blank" rel="noopener" class="map-chip">📍 導航</a>` : ''}
                </div>
                <div class="stay-name">🏨 ${h.name || ''}</div>
                ${h.note ? `<div class="stay-note">${h.note}</div>` : ''}
            </div>
        `).join('') : '<div class="callout-box">尚無住宿資訊</div>';

        document.getElementById('flights').innerHTML = `
            <div class="panel-head" style="padding: 0 2px;">
                <span class="panel-title">✈️ 航班登機證 (${flights.length} 航段)</span>
                ${flights.length ? `<div style="display:flex; gap:5px; align-items:center;"><button type="button" class="adsb-sync-btn" onclick="openLiveApiSettings()">🔑 真實時刻 API</button><button type="button" class="adsb-sync-btn" onclick="enrichAllFlightsWithAdsbdb(true)">↻ 同步</button></div>` : ''}
            </div>
            ${ticketsHtml}
            ${data && data.flight_note ? `<div class="budget-insight-card"><span class="budget-insight-icon">💡</span><div class="budget-insight-text">${data.flight_note}</div></div>` : ''}
            <div class="section-kicker" style="margin-top: 14px;">
                <span class="section-kicker-title">🏨 住宿憑證與導航</span>
                <span class="section-kicker-meta">${hotels.length} 間住宿</span>
            </div>
            ${hotelsHtml}`;
    }

    let themeAreaFilter = '全部地區';
    let exploreFavs = [];
    try {
        exploreFavs = JSON.parse(localStorage.getItem('tripExploreFavs_v1') || '[]') || [];
    } catch (e) { exploreFavs = []; }

    function isFavItem(key) {
        return exploreFavs.includes(key);
    }

    function toggleFavItem(key, scope) {
        if (exploreFavs.includes(key)) {
            exploreFavs = exploreFavs.filter(k => k !== key);
        } else {
            exploreFavs.push(key);
        }
        try { localStorage.setItem('tripExploreFavs_v1', JSON.stringify(exploreFavs)); } catch (e) {}
        if (scope === 'theme') renderTheme(globalData.theme_guide || []);
        if (scope === 'poi') initPOI(globalData.poi_database || []);
    }

    function escapeJsQuote(str) {
        return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function renderTheme(guide) {
        const areaBox = document.getElementById('theme-area-filters');
        const listBox = document.getElementById('theme-list');
        if (!listBox) return;
        if (!guide || !guide.length) {
            if (areaBox) areaBox.innerHTML = '';
            listBox.innerHTML = '<div class="panel-card">尚無主題絕景資料。</div>';
            return;
        }
        const areas = ['全部地區', '★ 已收藏', ...new Set(guide.map(g => g.area).filter(Boolean))];
        if (areaBox) {
            areaBox.innerHTML = areas.map(a => `
                <button type="button" class="filter-chip ${a === themeAreaFilter ? 'active' : ''}" onclick="setThemeAreaFilter('${escapeJsQuote(a)}')">${a}</button>
            `).join('');
        }
        renderThemeList();
    }

    function setThemeAreaFilter(val) {
        themeAreaFilter = val;
        renderTheme((globalData && globalData.theme_guide) || []);
    }

    function buildThemeItemHtml(g, globalIdx) {
        const num = String(globalIdx + 1).padStart(2, '0');
        const favKey = `theme::${g.name || ''}`;
        const favActive = isFavItem(favKey);
        const metaLine = [g.area || '', g.tag || ''].filter(Boolean).join(' · ');

        const facts = [];
        const timeVal = g.hours || g.time || '';
        if (timeVal) facts.push({ k: '🕒 營業／時段', v: timeVal, full: timeVal.length > 18 });
        if (g.fee) facts.push({ k: '🎟️ 費用門票', v: g.fee, full: g.fee.length > 18 });
        if (g.stay) facts.push({ k: '⏳ 建議停留', v: g.stay, full: false });
        if (g.access) facts.push({ k: '🚆 交通動線', v: g.access, full: true });

        const factsHtml = facts.length ? `
            <div class="guide-facts tabular-nums">
                ${facts.map(f => `
                    <div class="guide-fact ${f.full ? 'full' : ''}">
                        <span class="guide-fact-k">${f.k}</span>
                        <span class="guide-fact-v">${f.v}</span>
                    </div>`).join('')}
            </div>` : '';

        const notes = [];
        if (g.photo_tip) notes.push(`<div class="guide-note-line photo"><span class="guide-note-tag">📸 攝影光線</span>${g.photo_tip}</div>`);
        if (g.goshuin) notes.push(`<div class="guide-note-line goshuin"><span class="guide-note-tag">⛩️ 御朱印／印章</span>${g.goshuin}</div>`);
        if (g.tips) notes.push(`<div class="guide-note-line tip"><span class="guide-note-tag">💡 實戰貼士</span>${g.tips}</div>`);

        const tagsArr = Array.isArray(g.highlights) ? g.highlights : [];
        const tagsHtml = tagsArr.length ? `
            <div class="guide-tags-row">
                ${tagsArr.map(t => `<span class="guide-tag-pill"># ${t}</span>`).join('')}
            </div>` : '';

        return `
            <div class="guide-item" onclick="openThemeCardSheet(${globalIdx}, event)">
                <div class="guide-head-row">
                    <div class="guide-title-wrap">
                        <div class="guide-name"><span class="guide-idx">${num}</span>${g.name}</div>
                        ${metaLine ? `<div class="guide-meta-line">${metaLine}</div>` : ''}
                    </div>
                    <div class="guide-actions">
                        <button type="button" class="fav-btn ${favActive ? 'active' : ''}" title="收藏想去" onclick="toggleFavItem('${escapeJsQuote(favKey)}', 'theme')">${favActive ? '★' : '☆'}</button>
                        ${g.map_url ? `<a href="${g.map_url}" target="_blank" rel="noopener" class="map-chip">📍 導航</a>` : ''}
                    </div>
                </div>
                ${factsHtml}
                ${g.best ? `<div class="guide-highlight">★ 核心看點｜${g.best}</div>` : ''}
                ${g.desc ? `<div class="guide-desc">${formatCleanParagraphs(g.desc)}</div>` : ''}
                ${notes.length ? `<div class="guide-notes">${notes.join('')}</div>` : ''}
                ${tagsHtml}
            </div>`;
    }

    function renderThemeList() {
        const listBox = document.getElementById('theme-list');
        if (!listBox) return;
        const allGuide = (globalData && globalData.theme_guide) || [];
        const kw = (document.getElementById('theme-search-input')?.value || '').trim().toLowerCase();

        const indexed = allGuide.map((g, idx) => ({ g, idx })).filter(({ g }) => {
            const matchArea = themeAreaFilter === '全部地區'
                || (themeAreaFilter === '★ 已收藏' ? isFavItem(`theme::${g.name || ''}`) : g.area === themeAreaFilter);
            const hay = `${g.name || ''} ${g.area || ''} ${g.tag || ''} ${g.best || ''} ${g.desc || ''} ${g.photo_tip || ''} ${g.goshuin || ''} ${g.tips || ''} ${(g.highlights || []).join(' ')}`.toLowerCase();
            const matchKw = !kw || hay.includes(kw);
            return matchArea && matchKw;
        });

        if (!indexed.length) {
            listBox.innerHTML = `<div class="panel-card">${themeAreaFilter === '★ 已收藏' ? '尚未收藏任何主題絕景，點卡片右上角 ☆ 即可加入。' : '無符合條件的主題絕景。'}</div>`;
            return;
        }

        const hasAreas = indexed.some(({ g }) => Boolean(g.area));
        if (!hasAreas) {
            listBox.innerHTML = `
                <div class="guide-group">
                    <div class="guide-group-head">
                        <span>✨ 主題絕景指南</span>

                    </div>
                    ${indexed.map(({ g, idx }) => buildThemeItemHtml(g, idx)).join('')}
                </div>`;
            return;
        }

        const groups = [];
        const groupMap = {};
        indexed.forEach(entry => {
            const areaKey = entry.g.area || '精選絕景';
            if (!groupMap[areaKey]) {
                groupMap[areaKey] = { area: areaKey, entries: [] };
                groups.push(groupMap[areaKey]);
            }
            groupMap[areaKey].entries.push(entry);
        });

        listBox.innerHTML = groups.map(grp => `
            <div class="guide-group">
                <div class="guide-group-head">
                    <span>✨ ${grp.area}</span>
                    <span class="tabular-nums">${grp.entries.length} 處</span>
                </div>
                ${grp.entries.map(({ g, idx }) => buildThemeItemHtml(g, idx)).join('')}
            </div>
        `).join('');
    }

    function classifyPoiTag(tagStr) {
        const t = (tagStr || '').toLowerCase();
        if (t.includes('咖') || t.includes('coffee') || t.includes('roast') || t.includes('茶筒')) return '精品咖啡';
        if (t.includes('酒') || t.includes('bar') || t.includes('精釀') || t.includes('小酌')) return '酒吧小酌';
        if (t.includes('甜') || t.includes('年輪') || t.includes('菓子') || t.includes('伴手') || t.includes('冰')) return '甜點伴手';
        if (t.includes('神') || t.includes('寺') || t.includes('景') || t.includes('古社') || t.includes('館')) return '神社景點';
        if (t.includes('餐') || t.includes('食') || t.includes('牛') || t.includes('鰻') || t.includes('拉麵') || t.includes('燒肉') || t.includes('蕎麥')) return '在地美食';
        return '其他';
    }

            { id: '★ 已收藏', label: '★ 已收藏' },
            { id: '精品咖啡', label: '☕ 精品咖啡' },
            { id: '在地美食', label: '🍽️ 在地美食' },
            { id: '酒吧小酌', label: '🍺 酒吧小酌' },
            { id: '神社景點', label: '⛩️ 神社景點' },
            { id: '甜點伴手', label: '🥐 甜點伴手' },
            { id: '其他', label: '✨ 其他' }

    function setPoiFilter(type, val) {
        if (type === 'cat') poiCategoryFilter = val;
        if (type === 'area') poiAreaFilter = val;
        initPOI(globalData.poi_database || []);

    function buildPoiItemHtml(f) {
        const favKey = `poi::${f.name || ''}`;
        const favActive = isFavItem(favKey);
        const metaLine = [f.tag || '', f.price || ''].filter(Boolean).join(' · ');

        if (f.closed) facts.push({ k: '🚫 公休日', v: f.closed, full: f.closed.length > 18 });
        if (f.access) facts.push({ k: '🚶 位置交通', v: f.access, full: true });
        if (f.reservation) facts.push({ k: '📌 預約建議', v: f.reservation, full: true });

        const factsHtml = facts.length ? `
            <div class="guide-facts tabular-nums">

                        <span class="guide-fact-v">${fc.v}</span>

            <div class="guide-tags-row">

                <div class="guide-head-row">
                    <div class="guide-title-wrap">

                        ${metaLine ? `<div class="guide-meta-line tabular-nums">${metaLine}</div>` : ''}
                    </div>
                    <div class="guide-actions">
                        <button type="button" class="fav-btn ${favActive ? 'active' : ''}" title="收藏想去" onclick="toggleFavItem('${escapeJsQuote(favKey)}', 'poi')">${favActive ? '★' : '☆'}</button>
                        ${f.map_url ? `<a href="${f.map_url}" target="_blank" rel="noopener" class="map-chip">📍 導航</a>` : ''}
                    </div>
                </div>
                ${factsHtml}
                ${f.signature ? `<div class="guide-highlight">★ 推薦必點｜${f.signature}</div>` : ''}
                ${f.desc ? `<div class="guide-desc">${formatCleanParagraphs(f.desc)}</div>` : ''}
                ${f.tips ? `<div class="guide-notes"><div class="guide-note-line tip"><span class="guide-note-tag">💡 內行貼士</span>${f.tips}</div></div>` : ''}

    function renderPOIList() {
        const keyword = (document.getElementById('poi-search-input')?.value || '').trim().toLowerCase();
        const filtered = (globalData.poi_database || []).filter(item => {
            const matchArea = poiAreaFilter === '全部地區' || item.area === poiAreaFilter;
            const matchCat = poiCategoryFilter === '全部'
                || (poiCategoryFilter === '★ 已收藏' ? isFavItem(`poi::${item.name || ''}`) : classifyPoiTag(item.tag) === poiCategoryFilter);
            const hay = `${item.name || ''} ${item.signature || ''} ${item.desc || ''} ${item.tips || ''} ${item.area || ''} ${item.tag || ''} ${item.access || ''} ${(item.highlights || []).join(' ')}`.toLowerCase();
            const matchKw = !keyword || hay.includes(keyword);
            return matchArea && matchCat && matchKw;
        });

        const container = document.getElementById('poi-list');
        if (!filtered.length) {
            container.innerHTML = `<div class="panel-card">${poiCategoryFilter === '★ 已收藏' ? '尚未收藏任何地點，點卡片右上角 ☆ 即可加入口袋名單。' : '無符合條件的地點。'}</div>`;
            return;
        }

        const groups = [];
        const groupMap = {};
        filtered.forEach(item => {
            const areaKey = item.area || '精選地點';
            if (!groupMap[areaKey]) {
                groupMap[areaKey] = { area: areaKey, items: [] };
                groups.push(groupMap[areaKey]);
            }
            groupMap[areaKey].items.push(item);
        });

        container.innerHTML = groups.map(g => `
            <div class="guide-group">
                <div class="guide-group-head">
                    <span>📍 ${g.area}</span>
                    <span class="tabular-nums">${g.items.length} 間</span>
                </div>
                ${g.items.map(buildPoiItemHtml).join('')}
            </div>
        `).join('');
    }

    /* ================= 智能預算解析與帳本渲染引擎 ================= */
    const BUDGET_PALETTE = ['#f59e0b', '#38bdf8', '#34d399', '#a78bfa', '#fb7185'];

    function guessBudgetIcon(text) {
        const s = String(text || '');
        if (/宿|飯|旅|酒店|hotel|inn|野乃|hyatt|hilton|marriott|intercontinental/i.test(s)) return '🏨';
        if (/鐵|車票|周遊|jr|haruka|新幹線|地鐵|交通|巴士|pass/i.test(s)) return '🚄';
        if (/單車|自行車|越野車|腳踏車|bike|cycle/i.test(s)) return '🚲';
        if (/機|航|flight|貴賓室|lounge/i.test(s)) return '✈️';
        if (/咖|餐|食|牛|拉麵|酒|茶|coffee|cafe|food/i.test(s)) return '☕';
        if (/門票|票|寺|城|館|神社|ticket/i.test(s)) return '🎟️';
        if (/sim|esim|網|保險|wifi/i.test(s)) return '📶';
        return '🧾';
    }

    function parseLeadingEmoji(str) {
        const s = String(str || '').trim();
        const m = s.match(/^([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2300}-\u{23FF}][\uFE0F\u200D\u{1F300}-\u{1FAFF}]*)\s*(.*)$/u);
        if (m) return { icon: m[1], rest: m[2].trim() };
        return { icon: '', rest: s };
    }

    function splitParentheticalNotes(str) {
        const notes = [];
        const cleaned = String(str || '').replace(/\s*[（(]([^（）()]+)[）)]/g, (_, inner) => {
            if (inner.trim()) notes.push(inner.trim());
            return '';
        }).replace(/\s{2,}/g, ' ').trim();
        return { main: cleaned || String(str || '').trim(), notes };
    }

    function detectCurrencyFromSymbol(str) {
        const s = String(str || '');
        if (/NT\$|TWD/i.test(s)) return { sym: 'NT$', code: 'twd' };
        if (/¥|￥|JPY/i.test(s)) return { sym: '¥', code: 'jpy' };
        if (/€|EUR/i.test(s)) return { sym: '€', code: 'eur' };
        if (/£|GBP/i.test(s)) return { sym: '£', code: 'gbp' };
        if (/฿|THB/i.test(s)) return { sym: '฿', code: 'thb' };
        if (/SGD|S\$/i.test(s)) return { sym: 'S$', code: 'sgd' };
        if (/MYR|RM\s*\d/i.test(s)) return { sym: 'RM', code: 'myr' };
        if (/USD|\$/i.test(s)) return { sym: '$', code: 'usd' };
        return { sym: '', code: '' };
    }

    function parseMoneyRange(str) {
        const { main } = splitParentheticalNotes(str);
        const curInfo = detectCurrencyFromSymbol(main);
        const nums = (main.match(/\d[\d,]*(?:\.\d+)?/g) || []).map(n => parseFloat(n.replace(/,/g, ''))).filter(n => !isNaN(n));
        if (!nums.length) return null;
        const isRange = /[-–—~～至]/.test(main) && nums.length >= 2;
        return {
            min: nums[0],
            max: isRange ? nums[1] : nums[0],
            sym: curInfo.sym,
            code: curInfo.code
        };
    }

    function getRateToTwd(code) {
        if (!code) return 0;
        if (code === 'twd') return 1;
        const sel = document.getElementById('currency-selector');
        if (sel && sel.value === code && currentRate > 0) return currentRate;
        return offlineRates[code] || 0;
    }

    function formatRangeTwd(rangeObj) {
        if (!rangeObj || !rangeObj.code || rangeObj.code === 'twd') return '';
        const rate = getRateToTwd(rangeObj.code);
        if (!rate) return '';
        const minTwd = Math.round(rangeObj.min * rate);
        const maxTwd = Math.round(rangeObj.max * rate);
        if (minTwd === maxTwd) return `≈ NT$ ${minTwd.toLocaleString()}`;
        return `≈ NT$ ${minTwd.toLocaleString()}–${maxTwd.toLocaleString()}`;
    }

    function parseBudgetRow(item) {
        const { icon: rawIcon, rest: labelNoIcon } = parseLeadingEmoji(item.label || '');
        const labelParts = splitParentheticalNotes(labelNoIcon);
        const valParts = splitParentheticalNotes(item.value || '');

        let rawAmount = valParts.main;
        let isApprox = false;
        if (/^約\s*/.test(rawAmount)) {
            isApprox = true;
            rawAmount = rawAmount.replace(/^約\s*/, '').trim();
        }
        // 壓縮區間重複幣別符號，避免手機窄螢幕斷行（例如 "¥8,000 - ¥15,000" -> "¥8,000–15,000"）
        const curInfo = detectCurrencyFromSymbol(rawAmount);
        let compactAmount = rawAmount;
        if (curInfo.sym) {
            const escSym = curInfo.sym.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            compactAmount = rawAmount.replace(
                new RegExp(`(${escSym}\\s*[\\d,]+(?:\\.\\d+)?)\\s*[-–—~～]\\s*${escSym}?\\s*([\\d,]+(?:\\.\\d+)?)`),
                '$1–$2'
            ).replace(/\s+–\s+/g, '–');
        }

        const statusTags = [];
        const breakdowns = [];
        valParts.notes.forEach(n => {
            if (/已確認|已付|已預訂|已結清|免費|包含|confirmed|paid|free/i.test(n) && n.length <= 10) {
                statusTags.push(n);
            } else {
                breakdowns.push(n);
            }
        });

        return {
            icon: rawIcon || guessBudgetIcon(labelNoIcon),
            title: labelParts.main,
            details: labelParts.notes,
            amount: compactAmount,
            isApprox,
            statusTags,
            breakdowns
        };
    }

    function renderBudget(data) {
        const container = document.getElementById('budget-render');
        if (!container) return;
        const regions = (data && data.regions) || [];
        if (!regions.length) {
            container.innerHTML = '';
            return;
        }

        // 計算各分組數值範圍與幣別
        const regionStats = regions.map((r, idx) => {
            let range = r.total ? parseMoneyRange(r.total) : null;
            if (!range && Array.isArray(r.items)) {
                const parsedItems = r.items.map(i => parseMoneyRange(i.value)).filter(Boolean);
                const codes = [...new Set(parsedItems.map(p => p.code).filter(Boolean))];
                if (parsedItems.length && codes.length <= 1) {
                    range = {
                        min: parsedItems.reduce((s, p) => s + p.min, 0),
                        max: parsedItems.reduce((s, p) => s + p.max, 0),
                        sym: parsedItems[0].sym,
                        code: parsedItems[0].code
                    };
                }
            }
            return {
                name: r.name || `分類 ${idx + 1}`,
                color: BUDGET_PALETTE[idx % BUDGET_PALETTE.length],
                range,
                mid: range ? (range.min + range.max) / 2 : 0
            };
        });

        const validRanges = regionStats.filter(s => s.range && s.range.code);
        const uniqueCodes = [...new Set(validRanges.map(s => s.range.code))];
        let summaryHtml = '';

        if (validRanges.length === regions.length && uniqueCodes.length === 1) {
            const sym = validRanges[0].range.sym;
            const code = uniqueCodes[0];
            const grandMin = validRanges.reduce((a, s) => a + s.range.min, 0);
            const grandMax = validRanges.reduce((a, s) => a + s.range.max, 0);
            const totalMid = validRanges.reduce((a, s) => a + s.mid, 0);
            const grandStr = grandMin === grandMax
                ? `${sym}${Math.round(grandMin).toLocaleString()}`
                : `${sym}${Math.round(grandMin).toLocaleString()}–${Math.round(grandMax).toLocaleString()}`;
            const grandTwd = formatRangeTwd({ min: grandMin, max: grandMax, code });

            const barSegs = regionStats.map(s => {
                const pct = totalMid > 0 ? Math.max(6, Math.round((s.mid / totalMid) * 100)) : Math.round(100 / regionStats.length);
                return `<div class="budget-bar-seg" style="width:${pct}%; background:${s.color};"></div>`;
            }).join('');

            const legendItems = regionStats.map(s => {
                const pct = totalMid > 0 ? Math.round((s.mid / totalMid) * 100) : 0;
                const shortName = s.name.length > 12 ? s.name.slice(0, 12) + '…' : s.name;
                return `<span class="budget-legend-item"><span class="budget-dot" style="background:${s.color};"></span><span>${shortName}</span><span class="mono" style="color:var(--text-primary);">${pct}%</span></span>`;
            }).join('');

            summaryHtml = `
                <div class="budget-hero-card">
                    <div class="budget-hero-kicker">ESTIMATED TRIP BUDGET · 總預算概覽</div>
                    <div class="budget-hero-total tabular-nums">${grandStr}</div>
                    ${grandTwd ? `<div class="budget-hero-twd tabular-nums">${grandTwd}</div>` : ''}
                    <div class="budget-bar-track">${barSegs}</div>
                    <div class="budget-legend">${legendItems}</div>
                </div>`;
        }

        const ledgerCardsHtml = regions.map((r, idx) => {
            const color = BUDGET_PALETTE[idx % BUDGET_PALETTE.length];
            const items = r.items || [];
            const rowsHtml = items.map(rawItem => {
                const p = parseBudgetRow(rawItem);
                const subMetaParts = [
                    ...p.details.map(d => `<span class="ledger-detail">${d}</span>`),
                    ...p.breakdowns.map(b => `<span class="ledger-breakdown">${b}</span>`),
                    ...p.statusTags.map(st => `<span class="ledger-status-chip">✓ ${st}</span>`)
                ].join('');

                return `
                    <div class="ledger-row">
                        <div class="ledger-icon">${p.icon}</div>
                        <div class="ledger-main">
                            <div class="ledger-top-line">
                                <div class="ledger-item-name">${p.title}</div>
                                <div class="ledger-price-col">
                                    <span class="ledger-amount tabular-nums">${p.isApprox ? '<span class="ledger-approx-tag">約</span>' : ''}${p.amount}</span>
                                </div>
                            </div>
                            ${subMetaParts ? `<div class="ledger-sub-meta">${subMetaParts}</div>` : ''}
                        </div>
                    </div>`;
            }).join('');

            const totalParts = r.total ? parseBudgetRow({ label: '', value: r.total }) : null;
            const totalRange = regionStats[idx].range;
            const totalTwd = formatRangeTwd(totalRange);

            return `
                <div class="ledger-card">
                    <div class="ledger-head">
                        <div class="ledger-head-left">
                            <span class="budget-dot" style="background:${color}; width:9px; height:9px;"></span>
                            <span class="ledger-cat-title">${r.name || '預算明細'}</span>
                        </div>
                        <span class="ledger-count tabular-nums">${items.length} 項</span>
                    </div>
                    ${rowsHtml}
                    ${totalParts ? `
                        <div class="ledger-footer">
                            <span class="ledger-footer-label">預估小計</span>
                            <div class="ledger-footer-val-wrap">
                                <span class="ledger-footer-val tabular-nums">${totalParts.isApprox ? '<span class="ledger-approx-tag" style="color:var(--accent); opacity:0.8;">約</span>' : ''}${totalParts.amount}</span>
                                ${totalTwd ? `<span class="ledger-footer-twd tabular-nums">${totalTwd}</span>` : ''}
                            </div>
                        </div>` : ''}
                </div>`;
        }).join('');

        const noteText = data.note ? parseLeadingEmoji(data.note) : null;
        const noteHtml = noteText ? `
            <div class="budget-insight-card">
                <span class="budget-insight-icon">${noteText.icon || '💡'}</span>
                <div class="budget-insight-text">${noteText.rest}</div>
            </div>` : '';

        container.innerHTML = `
            <div class="section-kicker">
                <span class="section-kicker-title">💳 旅途預算帳本</span>
                <span class="section-kicker-meta">${regions.length} 大類</span>
            </div>
            ${summaryHtml}
            ${ledgerCardsHtml}
            ${noteHtml}`;
    }

        const itemsCardHtml = items.length ? `
            <div class="info-list-card">

    function linkifyPhoneNumbers(text) {
        return String(text || '').replace(/(\+?\d{2,4}[-\s]?\d{2,4}[-\s]?\d{3,4}|\b110\b|\b119\b|\b112\b|\b911\b|\b999\b)/g, (m) => {
            const clean = m.replace(/[^\d+]/g, '');
            return `<a href="tel:${clean}" class="tel-chip">📞 ${m}</a>`;
        });

    function fetchRate(cur) {

        fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${encodeURIComponent(cur)}.json`)
            .then(r => r.json())
            .then(data => {

                currentRate = data[cur].twd;

    function startLockdown(endTime) {
        isLockedOut = true;
        currentPin = '';
        updateDots();
        const msg = document.getElementById('auth-msg');
        msg.style.color = 'var(--danger)';
        lockTimer = setInterval(() => {
            const remaining = Math.ceil((endTime - Date.now()) / 1000);
            if (remaining <= 0) {
                clearInterval(lockTimer);
                isLockedOut = false;
                localStorage.removeItem('trip_lockout_time');
                localStorage.removeItem('trip_failed_attempts');
                msg.style.color = 'var(--text-secondary)';
                msg.innerText = '系統已解鎖，請輸入通行碼';
            } else {
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                msg.innerText = `錯誤次數過多，請等待 ${m}分 ${s}秒`;
            }
        }, 1000);
    }

    function pressKey(val) {
        if (isLockedOut) {
            triggerShake();
            return;
        }
        if (navigator.vibrate) navigator.vibrate(25);
        const msg = document.getElementById('auth-msg');
        msg.style.color = 'var(--text-secondary)';
        msg.innerText = '行程資料已加密保護';

        if (val === 'del') {
            currentPin = currentPin.slice(0, -1);

        updateDots();

    function triggerShake() {
        const dotsBox = document.getElementById('pin-dots');
        document.querySelectorAll('.pin-dot').forEach(d => d.classList.add('error'));
        dotsBox.classList.remove('shake');
        void dotsBox.offsetWidth;

    function verifyPin() {
        const msg = document.getElementById('auth-msg');
        if (typeof encryptedTripData === 'undefined') {
            triggerShake();
            currentPin = '';
            updateDots();
            msg.style.color = 'var(--danger)';
            msg.innerText = '找不到 secure_data.js（請確認與 index.html 同資料夾）';
            return;
        }

        let failedAttempts = parseInt(localStorage.getItem('trip_failed_attempts') || '0', 10);
        try {
            const bytes = CryptoJS.AES.decrypt(encryptedTripData, currentPin);
            const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
            if (!decryptedStr) throw new Error('Empty decryption');
            globalData = JSON.parse(decryptedStr);
            if (!globalData || typeof globalData !== 'object') throw new Error('Invalid JSON');

            localStorage.removeItem('trip_failed_attempts');
            document.getElementById('lock-screen').style.display = 'none';
            document.body.style.overflow = '';
            bootSystem();
        } catch (e) {
            triggerShake();
            failedAttempts++;
            localStorage.setItem('trip_failed_attempts', failedAttempts);

            if (failedAttempts >= MAX_ATTEMPTS) {
                const unlockTime = Date.now() + (LOCK_MINUTES * 60 * 1000);
                localStorage.setItem('trip_lockout_time', unlockTime);
                startLockdown(unlockTime);
            } else {
                currentPin = '';
                updateDots();
                msg.style.color = 'var(--danger)';
                msg.innerText = `密碼錯誤，剩餘 ${MAX_ATTEMPTS - failedAttempts} 次機會`;
            }
        }
    }

        if (/酒|精釀|酒館|酒吧|微醺|小酌|bar|pub|brewery|wine|cocktail|izakaya|biergarten/.test(s)) dims.push('酒吧小酌');

    /* 1. 智慧營業與公休狀態即時判讀 */
    const WEEKDAY_NAMES_ZH = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];

    function parseTripDateWeekday(dateFullStr) {
        if (!dateFullStr) return null;
        const parts = String(dateFullStr).split('-').map(Number);
        if (parts.length !== 3 || parts.some(isNaN)) return null;
        const dt = new Date(parts[0], parts[1] - 1, parts[2]);
        return { dayIdx: dt.getDay(), label: WEEKDAY_NAMES_ZH[dt.getDay()], dateStr: dateFullStr };
    }

    function evaluateOperatingStatus(ctx) {
        const hoursStr = ctx.hours || '';
        const closedStr = ctx.closed || '';
        const targetDayObj = ctx.dayNum
            ? ((globalData && globalData.itinerary) || []).find(d => Number(d.day) === Number(ctx.dayNum))
            : null;
        const tripWd = targetDayObj ? parseTripDateWeekday(targetDayObj.date_full) : null;

        const now = new Date();
        const nowWdLabel = WEEKDAY_NAMES_ZH[now.getDay()];
        const nowMins = now.getHours() * 60 + now.getMinutes();

        if (!hoursStr && !closedStr) return null;

        let isClosedOnTripDay = false;
        if (tripWd && closedStr && !/無休/.test(closedStr)) {
            if (closedStr.includes(tripWd.label)) isClosedOnTripDay = true;
        }
        let isClosedToday = false;
        if (closedStr && !/無休/.test(closedStr) && closedStr.includes(nowWdLabel)) {
            isClosedToday = true;
        }

        const timeRange = hoursStr.match(/(\d{1,2}):(\d{2})\s*[-–—~～]\s*(\d{1,2}):(\d{2})/);
        let liveClockNote = '';
        let level = 'ok';

        if (timeRange) {
            const openM = parseInt(timeRange[1], 10) * 60 + parseInt(timeRange[2], 10);
            let closeM = parseInt(timeRange[3], 10) * 60 + parseInt(timeRange[4], 10);
            if (closeM <= openM) closeM += 1440;
            const adjNow = nowMins < openM && closeM > 1440 ? nowMins + 1440 : nowMins;

            if (isClosedToday) {
                liveClockNote = `今日（${nowWdLabel}）表定公休`;
                level = 'warn';
            } else if (adjNow >= openM && adjNow <= closeM) {
                const left = closeM - adjNow;
                liveClockNote = left <= 45
                    ? `此刻營業中（距打烊僅剩 ${left} 分鐘）`
                    : `此刻營業中（${timeRange[0]}）`;
                if (left <= 45) level = 'warn';
            } else if (adjNow < openM) {
                const diff = openM - adjNow;
                liveClockNote = diff <= 90
                    ? `尚未開門（再 ${diff} 分鐘於 ${timeRange[1]}:${timeRange[2]} 營業）`
                    : `今日 ${timeRange[1]}:${timeRange[2]} 開始營業`;
            } else {
                liveClockNote = `今日已過營業時間（${timeRange[0]}）`;
            }
        }

        if (isClosedOnTripDay) {
            return {
                level: 'closed',
                text: `🚨 撞期警告：表定「${closedStr}」公休，與 Day ${ctx.dayNum}（${tripWd.label}）衝突，請改用同區備案！`
            };
        }

        const parts = [];
        if (tripWd) {
            parts.push(`✅ 行程排程檢核：Day ${ctx.dayNum} 為${tripWd.label}，${closedStr ? `公休（${closedStr}）無衝突` : '正常開放'}`);
        }
        if (liveClockNote) {

        }
        const hay = `${ctx.title || ''} ${ctx.area || ''} ${ctx.kicker || ''}`.toLowerCase();
        for (const entry of SPOT_COORDS_DB) {
            if (entry.kw.some(k => hay.includes(k))) return entry;
        }
        const allDays = (globalData && globalData.itinerary) || [];
        if (ctx.dayNum) {
            const d = allDays.find(item => Number(item.day) === Number(ctx.dayNum));

                if (!isNaN(lat) && !isNaN(lon)) return { lat, lon, label: d.date || `Day ${d.day}`, mode: 'walk', city: '' };
            }
        }
        // 嘗試比對與該地點同區的行程日座標
        const matchedDay = allDays.find(d => {
            const dText = `${d.title || ''} ${d.subtitle || ''} ${(d.schedule || []).map(s => s.activity).join(' ')}`.toLowerCase();
            return (ctx.area && dText.includes(String(ctx.area).toLowerCase())) || (ctx.title && dText.includes(String(ctx.title).toLowerCase()));
        }) || allDays[0];
        if (matchedDay && matchedDay.coords) {

            if (!isNaN(lat) && !isNaN(lon)) {
                return { lat, lon, label: ctx.area || matchedDay.title || `Day ${matchedDay.day}`, mode: 'walk', city: ctx.area || '' };
            }
        }
