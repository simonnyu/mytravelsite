<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universal 頂級路書 (App 加密版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="secure_data.js"></script>

    <style>
        :root {
            --primary: #FF9A3E; --dark: #0A0A0A; --surface: #141414; --border: #2A2A2A;
            --text-main: #F3F3F3; --text-muted: #888; --alert: #ff4d4d;
            --stay: rgba(0,200,0,0.15); --stay-text: #4cff4c;
            --move: rgba(0,150,255,0.15); --move-text: #4cb2ff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Noto Sans TC', 'Inter', sans-serif; background: var(--dark); color: var(--text-main); margin: 0; padding: 0; line-height: 1.6; user-select: none; -webkit-user-select: none; }
        
        header { padding: 40px 20px 20px; background: #000; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .cover-subtitle { font-size: 0.75rem; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; }
        .cover-title { font-size: 1.4rem; font-weight: 900; margin: 4px 0 0; }
        
        nav { display: flex; overflow-x: auto; background: var(--dark); border-bottom: 1px solid var(--border); padding: 0 5px; scrollbar-width: none; position: sticky; top: 90px; z-index: 99;}
        nav::-webkit-scrollbar { display: none; }
        .tab-btn { flex: 0 0 auto; padding: 15px 14px; color: #666; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; background: transparent; letter-spacing: 1px;}
        .tab-btn.active { color: var(--text-main); border-bottom: 3px solid var(--primary); }

        .container { padding: 20px 16px 100px; max-width: 600px; margin: auto; }
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .dash-card { background: var(--surface); padding: 20px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px;}
        .grade-text { font-size: 3rem; font-weight: 900; color: var(--alert); line-height: 1; margin: 10px 0; }
        .dash-stat { display: flex; justify-content: space-around; margin-top: 15px; }
        .stat-box { background: #222; padding: 10px 20px; border-radius: 12px; text-align: center; width: 45%; }
        .stat-val { font-size: 1.2rem; font-weight: 700; color: #fff; }

        .card { background: var(--surface); border-radius: 14px; margin-bottom: 30px; overflow: hidden; border: 1px solid var(--border); }
        .card-header { padding: 20px 24px; cursor: pointer; position: relative; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .day-mark { font-family: 'Inter', sans-serif; font-size: 0.8rem; color: var(--alert); font-weight: 700; letter-spacing: 2px; margin-bottom: 6px; display: block; }
        .card-header h3 { font-family: 'Noto Serif TC', serif; margin: 0; font-size: 1.35rem; font-weight: 700; color: var(--text-main); line-height: 1.4; }
        .card-header .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }
        .card-body { padding: 24px; display: none; }
        .card.open .card-body { display: block; animation: fadeIn 0.4s ease; }
        
        .story-block { font-family: 'Noto Serif TC', serif; font-size: 0.95rem; color: #ccc; line-height: 1.8; margin-bottom: 24px; text-align: justify; }
        .drop-cap { font-size: 2.3rem; color: var(--alert); float: left; margin: 6px 8px 0 0; line-height: 0.8; font-weight: 900; }
        .plan-b { background: rgba(255,154,62,0.1); border-left: 4px solid var(--primary); padding: 12px; border-radius: 8px; margin-bottom: 20px; color: #ddd; font-size: 0.9rem;}
        .critical-alert { background: rgba(255,77,77,0.1); border-left: 4px solid var(--alert); padding: 12px; border-radius: 4px; margin-bottom: 20px; color: var(--alert); font-size: 0.9rem; }

        .tl-row { display: flex; margin-bottom: 20px; }
        .tl-left { width: 30px; position: relative; align-items: center; display: flex; flex-direction: column; }
        .tl-dot { width: 10px; height: 10px; background: var(--primary); border-radius: 50%; z-index: 2; margin-top: 6px;}
        .tl-line { width: 2px; background: #333; flex: 1; position: absolute; top: 16px; bottom: -24px; }
        .tl-row:last-child .tl-line { display: none; }
        .tl-card { flex: 1; background: #1a1a1a; padding: 16px; border-radius: 16px; border: 1px solid rgba(255,154,62,0.15); }
        .tl-time { color: var(--alert); font-weight: 800; font-size: 1rem; margin-bottom: 4px; font-family: 'Inter', sans-serif;}
        .tl-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; }
        .tl-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 12px; }
        .map-link { text-decoration: none; font-size: 0.85rem; margin-left: 8px; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 6px; color: #fff; display: inline-block; vertical-align: middle; }

        .badge-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;}
        .badge { padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; font-family: 'Inter', sans-serif;}
        .bg-stay { background: var(--stay); color: var(--stay-text); }
        .bg-move { background: var(--move); color: var(--move-text); }
        .tl-transport { color: #aaa; font-size: 0.85rem; margin-top: 8px; background: #000; padding: 6px 10px; border-radius: 8px; display: inline-block;}

        .op-chip { background: #1a1a1a; border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 20px; }
        .op-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.85rem; color: var(--primary); margin-bottom: 8px; letter-spacing: 1px; }
        .op-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 0.85rem; }
        .op-label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; }
        .op-val { font-weight: 600; color: var(--text-main); }
        .op-full { grid-column: 1 / -1; }
        .photo-note { background: rgba(255,154,62,0.05); border: 1px solid rgba(255,154,62,0.2); padding: 16px; border-radius: 8px; font-size: 0.85rem; color: #ccc; margin-bottom: 20px;}
        .hotel-tag { font-size: 0.9rem; font-weight: 600; margin-top: 10px; padding: 12px; background: #222; border-radius: 6px; }

        table.standard-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; margin-bottom: 10px; }
        table.standard-table th, table.standard-table td { padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .cost-row { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); }
        .cost-row:last-child { border-bottom: none; }

        .grid-card { background: var(--surface); padding: 16px; border-radius: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
        .gc-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 8px; color: var(--primary); display: flex; align-items: center; justify-content: space-between;}
        .gc-info { color: #ccc; font-size: 0.9rem; margin-bottom: 4px; }
        
        .filter-scroll { display: flex; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none;}
        .filter-scroll::-webkit-scrollbar { display: none; }
        .chip { padding: 6px 16px; background: #222; border-radius: 20px; margin-right: 8px; font-size: 0.9rem; color: #aaa; cursor: pointer; white-space: nowrap; transition: 0.2s;}
        .chip.active { background: var(--primary); color: #000; font-weight: 700; }

        .progress-bar { height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
        .chk-item { background: var(--surface); padding: 16px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; cursor: pointer; border: 1px solid var(--border); }
        .chk-box { width: 22px; height: 22px; border: 2px solid #555; border-radius: 6px; margin-right: 14px; display: flex; align-items: center; justify-content: center;}
        .chk-item.checked .chk-box { background: var(--primary); border-color: var(--primary); }
        .chk-item.checked .chk-box::after { content: '✓'; color: #000; font-weight: 900; }
        .chk-item.checked span { color: #666; text-decoration: line-through; }
        input:focus, select:focus { outline: none; border-color: var(--primary) !important; }
        
        .weather-info { font-weight: bold; margin-left: 8px; color: #FFD700; }
        .radar-box { background: #1a1a1a; border-left: 4px solid #4cb2ff; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 0.85rem;}

        /* ⭐ App 級數字密碼鎖 UI */
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .pin-dots { display: flex; gap: 20px; margin-bottom: 40px; }
        .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text-muted); transition: 0.2s; }
        .pin-dot.filled { background: var(--primary); border-color: var(--primary); }
        .pin-dot.error { background: var(--alert); border-color: var(--alert); }
        
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; max-width: 320px; margin: 0 auto; }
        .key-btn { width: 75px; height: 75px; border-radius: 50%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; color: #fff; cursor: pointer; transition: 0.1s; }
        .key-btn:active { background: #333; transform: scale(0.95); }
        .key-btn.empty { background: transparent; cursor: default; }
        .key-btn.empty:active { transform: none; }
        .key-btn.del { font-size: 24px; color: var(--text-muted); background: transparent;}
        
        /* 震動錯誤動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake-animation { animation: shake 0.4s; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div style="font-size: 2rem; margin-bottom: 10px;">🔒</div>
    <div style="color: #fff; font-size: 1.2rem; font-weight: 600; margin-bottom: 5px;">請輸入通行密碼</div>
    <div id="auth-msg" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px; height: 20px;">系統已上鎖</div>
    
    <div class="pin-dots" id="pin-dots">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    
    <div class="keypad">
        <div class="key-btn" onclick="pressKey('1')">1</div>
        <div class="key-btn" onclick="pressKey('2')">2</div>
        <div class="key-btn" onclick="pressKey('3')">3</div>
        <div class="key-btn" onclick="pressKey('4')">4</div>
        <div class="key-btn" onclick="pressKey('5')">5</div>
        <div class="key-btn" onclick="pressKey('6')">6</div>
        <div class="key-btn" onclick="pressKey('7')">7</div>
        <div class="key-btn" onclick="pressKey('8')">8</div>
        <div class="key-btn" onclick="pressKey('9')">9</div>
        <div class="key-btn empty"></div>
        <div class="key-btn" onclick="pressKey('0')">0</div>
        <div class="key-btn del" onclick="pressKey('del')">⌫</div>
    </div>
</div>

<header>
    <div id="meta-sub" class="cover-subtitle">SYSTEM LOCKED</div>
    <div id="meta-title" class="cover-title">等待授權中</div>
</header>

<nav id="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('dashboard')">戰情儀表板</button>
    <button class="tab-btn" onclick="switchTab('itinerary')" id="tab-itinerary">實戰行程</button>
    <button class="tab-btn" onclick="switchTab('flights')">航班與泊宿</button>
    <button class="tab-btn" onclick="switchTab('logistics')">美學與實務</button>
    <button class="tab-btn" onclick="switchTab('money')">財務預算</button>
    <button class="tab-btn" onclick="switchTab('theme')">主題絕景</button>
    <button class="tab-btn" onclick="switchTab('poi')">補給雷達</button>
    <button class="tab-btn" onclick="switchTab('checklist')">裝備清單</button>
    <button class="tab-btn" onclick="switchTab('emergency')">緊急備案</button>
</nav>

<div class="container">
    <div id="dashboard" class="view active"></div>
    <div id="itinerary" class="view"></div>
    <div id="flights" class="view"></div>
    <div id="logistics" class="view"></div>
    
    <div id="money" class="view">
        <div class="dash-card">
            <div style="font-size: 1.1rem; font-weight: 800; color: var(--primary); margin-bottom: 12px;">💱 戰術匯率計算機</div>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <select id="currency-selector" style="flex: 1; padding: 12px; background: #222; color: #fff; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; appearance: none;">
                    <option value="jpy">🇯🇵 JPY</option>
                    <option value="thb">🇹🇭 THB</option>
                    <option value="usd">🇺🇸 USD</option>
                    <option value="eur">🇪🇺 EUR</option>
                    <option value="gbp">🇬🇧 GBP</option>
                    <option value="idr">🇮🇩 IDR</option>
                    <option value="myr">🇲🇾 MYR</option>
                    <option value="sgd">🇸🇬 SGD</option>
                </select>
                <input type="number" id="foreign-amount" placeholder="輸入當地金額" style="flex: 2; padding: 12px; background: #111; color: #fff; border: 1px solid var(--border); border-radius: 8px; font-size: 1.1rem;">
            </div>
            <div style="background: #000; padding: 15px; border-radius: 8px; border-left: 4px solid #4cff4c; display: flex; justify-content: space-between; align-items: center;">
                <span style="color: #999; font-size: 0.9rem;">換算 TWD</span>
                <span style="font-size: 1.5rem; font-weight: 900; color: #fff;">NT$ <span id="twd-result">0</span></span>
            </div>
            <div id="rate-status" style="margin-top: 10px; font-size: 0.75rem; color: #666; text-align: right;">啟動連線中...</div>
        </div>
        <div id="budget-render"></div>
    </div>
    
    <div id="theme" class="view"></div>
    <div id="poi" class="view">
        <div class="filter-scroll" id="poi-area-filters"></div>
        <div class="filter-scroll" id="poi-tag-filters"></div>
        <div id="poi-list"></div>
    </div>
    <div id="checklist" class="view">
        <div style="color:#999; margin-bottom:8px; font-size:0.9rem;" id="chk-label">裝備檢核進度 0%</div>
        <div class="progress-bar"><div class="progress-fill" id="chk-fill"></div></div>
        <div id="chk-list"></div>
    </div>
    <div id="emergency" class="view"></div>
</div>

<script>
    /* ================= ⭐ 密碼盤與防暴力破解邏輯 ================= */
    let currentPin = '';
    const MAX_ATTEMPTS = 5;
    const LOCK_MINUTES = 3;
    let isLockedOut = false;
    let lockTimer = null;

    // 初始化檢查鎖定狀態
    function checkLockStatus() {
        const lockUntil = localStorage.getItem('trip_lockout_time');
        if (lockUntil && Date.now() < parseInt(lockUntil)) {
            startLockdown(parseInt(lockUntil));
        } else if (lockUntil) {
            localStorage.removeItem('trip_lockout_time');
            localStorage.removeItem('trip_failed_attempts');
        }
    }

    // 啟動鎖死倒數
    function startLockdown(endTime) {
        isLockedOut = true;
        currentPin = '';
        updateDots();
        const msg = document.getElementById('auth-msg');
        msg.style.color = 'var(--alert)';
        
        lockTimer = setInterval(() => {
            const remaining = Math.ceil((endTime - Date.now()) / 1000);
            if (remaining <= 0) {
                clearInterval(lockTimer);
                isLockedOut = false;
                localStorage.removeItem('trip_lockout_time');
                localStorage.removeItem('trip_failed_attempts');
                msg.style.color = 'var(--text-muted)';
                msg.innerText = '系統解除鎖定，請輸入密碼';
            } else {
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                msg.innerText = `🚨 系統鎖定中，請等待 ${m}分 ${s}秒`;
            }
        }, 1000);
    }

    // 按鍵觸發
    function pressKey(val) {
        if (isLockedOut) {
            triggerShake();
            return;
        }

        // 觸覺回饋 (Haptic) 支援的手機有效
        if(navigator.vibrate) navigator.vibrate(50);

        const msg = document.getElementById('auth-msg');
        msg.innerText = '請輸入通行密碼';
        msg.style.color = 'var(--text-muted)';

        if (val === 'del') {
            currentPin = currentPin.slice(0, -1);
        } else if (currentPin.length < 6) {
            currentPin += val;
        }

        updateDots();

        // 輸入滿 6 碼自動驗證
        if (currentPin.length === 6) {
            setTimeout(verifyPin, 100);
        }
    }

    // 更新點點 UI
    function updateDots() {
        const dots = document.querySelectorAll('.pin-dot');
        dots.forEach((dot, index) => {
            dot.className = 'pin-dot'; // reset
            if (index < currentPin.length) {
                dot.classList.add('filled');
            }
        });
    }

    // 錯誤動畫
    function triggerShake() {
        if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
        const dotsContainer = document.getElementById('pin-dots');
        dotsContainer.classList.remove('shake-animation');
        void dotsContainer.offsetWidth; // trigger reflow
        dotsContainer.classList.add('shake-animation');
        
        document.querySelectorAll('.pin-dot').forEach(d => {
            if(d.classList.contains('filled')) d.classList.add('error');
        });
    }

    // 驗證邏輯
    function verifyPin() {
        const msg = document.getElementById('auth-msg');
        let failedAttempts = parseInt(localStorage.getItem('trip_failed_attempts') || '0');

        try {
            // 使用 AES 解密
            const bytes = CryptoJS.AES.decrypt(encryptedTripData, currentPin);
            const decryptedString = bytes.toString(CryptoJS.enc.Utf8);
            
            // 轉成 JSON，若密碼錯誤此處會拋出 exception
            globalData = JSON.parse(decryptedString);

            // --- 密碼正確 ---
            localStorage.removeItem('trip_failed_attempts');
            document.getElementById('lock-screen').style.display = 'none';
            bootSystem();

        } catch (e) {
            // --- 密碼錯誤 ---
            triggerShake();
            failedAttempts++;
            localStorage.setItem('trip_failed_attempts', failedAttempts);

            if (failedAttempts >= MAX_ATTEMPTS) {
                const unlockTime = Date.now() + (LOCK_MINUTES * 60 * 1000);
                localStorage.setItem('trip_lockout_time', unlockTime);
                startLockdown(unlockTime);
            } else {
                currentPin = '';
                setTimeout(updateDots, 300);
                msg.style.color = 'var(--alert)';
                msg.innerText = `密碼錯誤，剩餘 ${MAX_ATTEMPTS - failedAttempts} 次機會`;
            }
        }
    }

    // 啟動檢測
    checkLockStatus();

    /* ================= 以下為系統核心模組 ================= */

    let globalData = null;
    let poiAreaFilter = '全部地區';
    let poiTagFilter = '全部分類';
    const offlineRates = { jpy: 0.21, thb: 0.90, usd: 32.50, eur: 34.80, gbp: 40.50, idr: 0.002, myr: 6.80, sgd: 23.80 };
    let currentRate = 0;
    let radarStatusText = "觀測中...";

    function bootSystem() {
        document.getElementById('meta-title').innerText = globalData.trip_meta.title;
        document.getElementById('meta-sub').innerText = globalData.trip_meta.subtitle;
        
        fetchRealtimeWeather(globalData.itinerary);
        renderItinerary(globalData.itinerary);
        renderFlights(globalData.flights_and_hotels);
        renderLogistics(globalData.logistics);
        renderBudget(globalData.budget);
        renderTheme(globalData.theme_guide);
        initPOI(globalData.poi_database);
        renderChecklist(globalData.checklist_items);
        renderEmergency(globalData.emergency);
        initCurrencyWidget(globalData.trip_meta.currency);
        initSmartRouting(globalData.itinerary);
    }

    function switchTab(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.getAttribute('onclick').includes(id));
        if(activeBtn) activeBtn.classList.add('active');
    }

    function initSmartRouting(itinerary) {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const todayStr = `${yyyy}-${mm}-${dd}`;
        const activeDayIndex = itinerary.findIndex(d => d.date_full === todayStr);
        if (activeDayIndex !== -1) {
            switchTab('itinerary');
            setTimeout(() => {
                const targetCardId = `day-${itinerary[activeDayIndex].day}`;
                document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
                const targetCard = document.getElementById(targetCardId);
                if (targetCard) {
                    targetCard.classList.add('open');
                    targetCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
                const nav = document.getElementById('nav-tabs');
                const btn = document.getElementById('tab-itinerary');
                nav.scrollTo({ left: btn.offsetLeft - 20, behavior: 'smooth' });
            }, 300);
        }
    }

    function getWeatherEmoji(code) {
        if(code === 0) return '☀️'; 
        if(code >= 1 && code <= 3) return '⛅'; 
        if(code >= 45 && code <= 48) return '🌫️'; 
        if(code >= 51 && code <= 67) return '🌧️'; 
        if(code >= 71 && code <= 82) return '❄️'; 
        if(code >= 95) return '⛈️'; 
        return '☁️';
    }

    function fetchRealtimeWeather(itinerary) {
        if (itinerary.length > 0 && itinerary[0].date_full) {
            const startDate = new Date(itinerary[0].date_full);
            const today = new Date();
            const diffTime = startDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays > 16) {
                radarStatusText = `📡 距離出發還有 <b style="color:#FF9A3E">${diffDays}</b> 天。即時氣象雷達將於出發前 16 天自動啟動解鎖。`;
                renderDashboard(itinerary); 
                return; 
            } else if (diffDays > 0) {
                radarStatusText = `🟢 氣象雷達已上線！正為您追蹤未來 ${diffDays} 天後的天候狀態。`;
            } else {
                radarStatusText = `🟢 作戰進行中！即時氣象雷達全面覆蓋。`;
            }
            renderDashboard(itinerary);
        } else {
            renderDashboard(itinerary);
        }

        itinerary.forEach(d => {
            if (!d.coords || !d.date_full) return;
            const [lat, lon] = d.coords.split(',');
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`;
            
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.daily && data.daily.time) {
                        const dateIndex = data.daily.time.indexOf(d.date_full);
                        if (dateIndex !== -1) {
                            const code = data.daily.weathercode[dateIndex];
                            const tMax = Math.round(data.daily.temperature_2m_max[dateIndex]);
                            const tMin = Math.round(data.daily.temperature_2m_min[dateIndex]);
                            const emoji = getWeatherEmoji(code);
                            
                            const weatherSpan = document.getElementById(`weather-${d.day}`);
                            if (weatherSpan) {
                                weatherSpan.innerHTML = `${emoji} <span style="font-size:0.85rem; color:#aaa;">${tMin}°~${tMax}°C</span>`;
                                weatherSpan.classList.add('weather-info');
                            }
                        }
                    }
                })
                .catch(err => console.log(`無法獲取 Day ${d.day} 氣象`));
        });
    }

    function renderDashboard(itinerary) {
        let totalStay = 0, totalMove = 0;
        itinerary.forEach(d => {
            if(d.schedule) d.schedule.forEach(s => { totalStay += s.stay || 0; totalMove += s.move || 0; });
        });
        const eff = (totalStay + totalMove) === 0 ? 0 : Math.round((totalStay / (totalStay + totalMove)) * 100);
        const grade = eff >= 80 ? 'SSS' : eff >= 70 ? 'SS' : eff >= 60 ? 'S' : eff >= 50 ? 'A' : 'B';
        document.getElementById('dashboard').innerHTML = `
            <div class="dash-card" style="text-align:center;">
                <div style="color:#888; font-size:0.9rem;">任務代號評級 (停留占比)</div>
                <div class="grade-text">${grade}</div>
                <div style="color:#aaa; font-size:0.9rem;">作戰效益達 ${eff}%</div>
                <div class="dash-stat">
                    <div class="stat-box"><div style="color:#4cff4c; font-size:0.75rem">STAY</div><div class="stat-val">${totalStay}m</div></div>
                    <div class="stat-box"><div style="color:#4cb2ff; font-size:0.75rem">MOVE</div><div class="stat-val">${totalMove}m</div></div>
                </div>
            </div>
            <div class="radar-box">${radarStatusText}</div>
        `;
    }

    function getIcon(t) {
        if (!t) return '🚉';
        let txt = t.toLowerCase();
        if(txt.includes('walk') || txt.includes('步行')) return '🚶';
        if(txt.includes('flight') || txt.includes('機')) return '✈️';
        if(txt.includes('bus') || txt.includes('巴士')) return '🚌';
        if(txt.includes('jr') || txt.includes('train') || txt.includes('車')) return '🚆';
        return '📍';
    }

    function renderItinerary(days) {
        let html = '';
        days.forEach((d, index) => {
            const isOpen = index === 0 ? 'open' : '';
            let storyHtml = d.story_block ? `<div class="story-block"><span class="drop-cap">${d.story_block.charAt(0)}</span>${d.story_block.slice(1)}</div>` : '';
            let alertHtml = d.critical_alert ? `<div class="critical-alert"><strong>🚨 關鍵警示</strong><br>${d.critical_alert}</div>` : '';
            let planBHtml = d.plan_b ? `<div class="plan-b">🛡️ <strong>PLAN B</strong><br>${d.plan_b}</div>` : '';

            let schedHtml = (d.schedule || []).map(s => {
                let badge = '';
                if(s.stay > 0) badge += `<span class="badge bg-stay">Stay ${s.stay}m</span>`;
                if(s.move > 0) badge += `<span class="badge bg-move">Move ${s.move}m</span>`;
                let transHtml = s.transport ? `<div class="tl-transport">${getIcon(s.transport)} ${s.from ? s.from+' ➔ '+s.to : s.transport}</div>` : '';
                return `
                    <div class="tl-row">
                        <div class="tl-left"><div class="tl-dot"></div><div class="tl-line"></div></div>
                        <div class="tl-card">
                            <div class="tl-time">${s.time} ${s.map_url ? `<a href="${s.map_url}" class="map-link" target="_blank">📍導航</a>` : ''}</div>
                            <div class="tl-title">${s.activity}</div>
                            <div class="badge-row">${badge}</div>
                            ${s.desc ? `<div class="tl-desc">${s.desc}</div>` : ''}
                            ${transHtml}
                        </div>
                    </div>`;
            }).join('');

            let opHtml = (d.operational_modules || []).map(op => {
                let fieldsHtml = op.fields.map(f => `<div class="${f.full_width ? 'op-full' : ''}"><span class="op-label">${f.label}</span><span class="op-val">${f.value}</span></div>`).join('');
                return `<div class="op-chip"><div class="op-title">${op.title}</div><div class="op-grid">${fieldsHtml}</div></div>`;
            }).join('');

            let photoHtml = d.photo_notes ? `<div class="photo-note">${d.photo_notes.replace(/\n/g, '<br>')}</div>` : '';
            let hotelHtml = d.hotel ? `<div class="hotel-tag">🏨 ${d.hotel.name} ${d.hotel.map_url ? `<a href="${d.hotel.map_url}" class="map-link" target="_blank" style="float:right;">📍導航</a>` : ''}</div>` : '';

            html += `
                <div class="card ${isOpen}" id="day-${d.day}">
                    <div class="card-header" onclick="toggleCard('day-${d.day}')">
                        <span class="day-mark">DAY ${d.day} ｜ ${d.date} <span id="weather-${d.day}">${d.weather}</span></span>
                        <h3>${d.title}</h3>
                        <div class="subtitle">${d.subtitle}</div>
                    </div>
                    <div class="card-body">
                        ${storyHtml}${planBHtml}${alertHtml}${schedHtml}${opHtml}${photoHtml}${hotelHtml}
                    </div>
                </div>
            `;
        });
        document.getElementById('itinerary').innerHTML = html;
    }
    
    function toggleCard(id) { document.getElementById(id).classList.toggle('open'); }

    function renderFlights(data) {
        let flightsRows = data.flights.map(f => `<tr><td>${f.date}</td><td><b style="color:var(--primary)">${f.flight_no}</b></td><td>${f.route}</td><td>${f.time}</td></tr>`).join('');
        let hotelsHtml = data.hotels.map(h => `<p>📍 <b>${h.date_str}</b><br>${h.name}<br><span style="font-size:0.8rem; color:var(--text-muted);">${h.note}</span></p><hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:12px 0;">`).join('');
        document.getElementById('flights').innerHTML = `
            <div class="card open"><div class="card-header"><h3>航班時刻一覽</h3></div><div class="card-body" style="padding:0">
                <table class="standard-table"><tr style="background:rgba(255,255,255,0.05);"><th>日期</th><th>航班</th><th>航線</th><th>時間</th></tr>${flightsRows}</table>
                <div class="plan-b" style="margin: 15px;">${data.flight_note}</div>
            </div></div>
            <div class="card open"><div class="card-header"><h3>泊宿總覽</h3></div><div class="card-body">${hotelsHtml}</div></div>
        `;
    }

    function renderLogistics(data) {
        let itemsHtml = data.items.map(item => `<p>${item.icon} <b style="color:#fff;">${item.title}</b><br><span style="color:var(--text-muted); font-size:0.9rem;">${item.desc}</span></p>`).join('');
        let alertsHtml = data.alerts.map(alert => `<div class="plan-b">💡 <b>${alert.title}</b><br>${alert.desc}</div>`).join('');
        document.getElementById('logistics').innerHTML = `<div class="card open"><div class="card-header"><h3>移動美學與實務</h3></div><div class="card-body">${itemsHtml}${alertsHtml}</div></div>`;
    }

    function renderBudget(data) {
        let regionsHtml = data.regions.map(r => {
            let items = r.items.map(i => `<div class="cost-row"><span>${i.label}</span><span>${i.value}</span></div>`).join('');
            return `<div class="op-chip"><div class="op-title" style="color:${r.color_theme};">${r.name}</div>${items}<div class="cost-row" style="font-weight:700; color:${r.color_theme};"><span>Total 現金需求</span><span>${r.total}</span></div></div>`;
        }).join('');
        document.getElementById('budget-render').innerHTML = `<div class="card open"><div class="card-header"><h3>每日現金流預估</h3></div><div class="card-body">${regionsHtml}<div class="plan-b">${data.note}</div></div></div>`;
    }

    function renderTheme(guide) {
        document.getElementById('theme').innerHTML = guide.map(g => `
            <div class="grid-card">
                <div class="gc-title">
                    <span>✨ ${g.name}</span>
                    ${g.map_url ? `<a href="${g.map_url}" target="_blank" class="map-link">📍導航</a>` : ''}
                </div>
                <div class="gc-info" style="color:var(--primary); font-weight:700;">★ 重點：${g.best}</div>
                <div class="gc-info" style="margin-bottom:10px;">${g.desc}<br><span style="color:#888; font-size:0.85rem;">📸 ${g.tips}</span></div>
                <div class="badge-row"><span class="badge" style="background:#222; color:#ccc;">${g.time}</span><span class="badge" style="background:#222; color:#ccc;">${g.fee}</span><span class="badge" style="background:var(--alert); color:#fff;">${g.tag}</span></div>
            </div>`).join('');
    }

    function initPOI(list) {
        const areas = ['全部地區', ...new Set(list.map(i => i.area))];
        const tags = ['全部分類', ...new Set(list.map(i => i.tag))];
        const renderChips = (id, items, current, type) => {
            document.getElementById(id).innerHTML = items.map(i => `<div class="chip ${i === current ? 'active' : ''}" onclick="setPOIFilter('${type}', '${i}')">${i}</div>`).join('');
        };
        renderChips('poi-area-filters', areas, poiAreaFilter, 'area');
        renderChips('poi-tag-filters', tags, poiTagFilter, 'tag');
        renderPOIList();
    }
    function setPOIFilter(type, val) {
        if(type === 'area') poiAreaFilter = val;
        if(type === 'tag') poiTagFilter = val;
        initPOI(globalData.poi_database); 
    }
    function renderPOIList() {
        let filtered = globalData.poi_database.filter(f => (poiAreaFilter === '全部地區' || f.area === poiAreaFilter) && (poiTagFilter === '全部分類' || f.tag === poiTagFilter));
        document.getElementById('poi-list').innerHTML = filtered.map(f => `
            <div class="grid-card">
                <div class="gc-title">
                    <span>📍 ${f.name}</span>
                    ${f.map_url ? `<a href="${f.map_url}" target="_blank" class="map-link">📍導航</a>` : ''}
                </div>
                <div class="gc-info" style="color:#FFCC66;">必試：${f.signature}</div>
                <div class="gc-info">${f.desc}<br><span style="color:#666; font-size:0.85rem;">💡 ${f.tips}</span></div>
                <div class="badge-row" style="margin-top:10px;"><span class="badge bg-move">${f.area}</span><span class="badge bg-stay">${f.price}</span></div>
            </div>`).join('');
    }

    function renderEmergency(data) {
        let guidesHtml = data.guides.map(g => {
            let bullets = g.bullets.map(b => `<li>${b}</li>`).join('');
            return `<div class="op-chip" style="border-left: 4px solid ${g.border};"><div class="op-title" style="color:${g.color};">${g.icon} ${g.title}</div><ul style="margin:0; padding-left:20px; font-size:0.85rem; color:var(--text-muted);">${bullets}</ul></div>`;
        }).join('');
        document.getElementById('emergency').innerHTML = `<div class="card open"><div class="card-header"><h3>緊急生存指南</h3></div><div class="card-body">${guidesHtml}</div></div>`;
    }

    let checkedItems = JSON.parse(localStorage.getItem('tripChecklist_v7')) || [];
    function renderChecklist(items) {
        document.getElementById('chk-list').innerHTML = items.map(i => {
            let isChecked = checkedItems.includes(i);
            return `<div class="chk-item ${isChecked ? 'checked' : ''}" onclick="toggleCheck('${i}')"><div class="chk-box"></div><span style="font-size:0.95rem;">${i}</span></div>`;
        }).join('');
        let pct = Math.round((checkedItems.length / items.length) * 100);
        document.getElementById('chk-fill').style.width = pct + '%';
        document.getElementById('chk-label').innerText = `裝備檢核進度 ${pct}%`;
    }
    function toggleCheck(item) {
        if(checkedItems.includes(item)) checkedItems = checkedItems.filter(i => i !== item);
        else checkedItems.push(item);
        localStorage.setItem('tripChecklist_v7', JSON.stringify(checkedItems));
        renderChecklist(globalData.checklist_items);
    }

    function initCurrencyWidget(defaultCur) {
        const sel = document.getElementById('currency-selector');
        const inp = document.getElementById('foreign-amount');
        if(defaultCur && offlineRates[defaultCur.toLowerCase()]) sel.value = defaultCur.toLowerCase();
        fetchRate(sel.value);
        sel.addEventListener('change', e => fetchRate(e.target.value));
        inp.addEventListener('input', calculateTWD);
    }
    function fetchRate(cur) {
        const box = document.getElementById('rate-status');
        box.innerText = '🔄 索取 API...';
        fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${cur}.json`)
            .then(r => r.json())
            .then(data => {
                currentRate = data[cur].twd;
                box.innerText = `🟢 雲端同步：1 ${cur.toUpperCase()} = ${currentRate.toFixed(4)}`;
                calculateTWD();
            })
            .catch(err => {
                currentRate = offlineRates[cur];
                box.innerText = `🟡 離線模式：1 ${cur.toUpperCase()} = ${currentRate}`;
                calculateTWD();
            });
    }
    function calculateTWD() {
        const amt = parseFloat(document.getElementById('foreign-amount').value) || 0;
        document.getElementById('twd-result').innerText = Math.round(amt * currentRate).toLocaleString();
    }
</script>
