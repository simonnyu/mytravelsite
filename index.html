            const storyHtml = d.story_block ? `<div class="callout-box callout-story">${d.story_block}</div>` : '';
            const alertHtml = d.critical_alert ? `<div class="callout-box callout-alert"><strong>⚠️ 關鍵提醒</strong><br>${d.critical_alert}</div>` : '';
            const planBHtml = d.plan_b ? `<div class="callout-box"><strong>💡 備案提示</strong><br>${d.plan_b}</div>` : '';

            const schedHtml = scheduleList.length ? `
                <div class="timeline-wrap">
                    ${scheduleList.map(s => {
                        const kind = detectSlotKind(s);
                        const pills = [];
                        if (s.stay > 0) pills.push(`<span class="mini-pill sky tabular-nums">停留 ${s.stay}m</span>`);
                        if (s.move > 0) pills.push(`<span class="mini-pill accent tabular-nums">移動 ${s.move}m</span>`);
                        if (s.transport) {
                            const routeLabel = s.from && s.to ? `${s.from} ➔ ${s.to}` : s.transport;
                            pills.push(`<span class="mini-pill">${getMoveIcon(s.transport)} ${routeLabel}</span>`);
                        }
                        return `
                            <div class="timeline-item">
                                <div class="timeline-axis">
                                    <div class="timeline-node ${kind}"></div>
                                    <div class="timeline-stem"></div>
                                </div>
                                <div class="slot-card ${kind === 'kind-move' ? 'is-transit' : ''}">
                                    <div class="slot-top">
                                        <span class="slot-time tabular-nums">${s.time || '--:--'}</span>
                                        ${s.map_url ? `<a href="${s.map_url}" target="_blank" rel="noopener" class="map-chip">📍 導航</a>` : ''}
                                    </div>
                                    <div class="slot-title">${s.activity}</div>
                                    ${pills.length ? `<div class="pill-row">${pills.join('')}</div>` : ''}
                                    ${s.desc ? `<div class="slot-desc">${s.desc}</div>` : ''}
                                </div>
                            </div>`;
                    }).join('')}
                </div>` : '<div class="panel-card">當日尚未新增時間軸節點。</div>';

            const opHtml = (d.operational_modules || []).map(op => {
                const fields = (op.fields || []).map(f => `
                    <div style="min-width: 0; ${f.full_width ? 'grid-column: 1 / -1;' : ''}">
                        <div style="font-size: 0.69rem; color: var(--text-muted);">${f.label}</div>
                        <div style="font-size: 0.79rem; font-weight: 700; color: var(--text-primary); overflow-wrap: anywhere;">${f.value}</div>
                    </div>
                `).join('');
                return `
                    <div class="panel-card" style="padding: 12px 13px;">
                        <div style="font-size: 0.77rem; font-weight: 800; color: var(--accent); margin-bottom: 6px;">${op.title}</div>
                        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px;">${fields}</div>
                    </div>`;
            }).join('');

            const photoHtml = d.photo_notes ? `<div class="callout-box"><strong>📸 攝影筆記</strong><br>${d.photo_notes.replace(/\n/g, '<br>')}</div>` : '';

            const hotelHtml = d.hotel ? `
                <div class="hotel-strip">
                    <span>🏨 ${d.hotel.name}</span>
                    ${d.hotel.map_url ? `<a href="${d.hotel.map_url}" target="_blank" rel="noopener" class="map-chip">📍 導航</a>` : ''}
                </div>` : '';

            const pagerHtml = days.length > 1 ? `
                <div class="day-pager">
                    <button type="button" class="pager-btn" ${prevDay ? `onclick="selectDayTab(${prevDay.day})"` : 'disabled'}>
                        ◀ ${prevDay ? `Day ${prevDay.day}` : '已是最前一天'}
                    </button>
                    <button type="button" class="pager-btn" ${nextDay ? `onclick="selectDayTab(${nextDay.day})"` : 'disabled'}>
                        ${nextDay ? `Day ${nextDay.day}` : '已是最後一天'} ▶
                    </button>
                </div>` : '';

            return `
                <section class="day-page ${isActive}" data-day="${d.day}">
                    <div class="day-hero-card">
                        <div class="day-hero-top">
                            <span class="day-kicker tabular-nums">DAY ${d.day} · ${d.date || ''}</span>
                            ${d.weather ? `<span class="day-weather-pill">${d.weather}</span>` : ''}
                        </div>
                        <h2 class="day-card-title">${d.title || '未命名行程'}</h2>
                        ${d.subtitle ? `<div class="day-card-sub">${d.subtitle}</div>` : ''}
                        <div class="day-stats-bar">${statsPills}</div>
                    </div>
                    ${alertHtml}
                    ${planBHtml}
                    ${storyHtml}
                    ${schedHtml}
                    ${opHtml}
                    ${photoHtml}
                    ${hotelHtml}
                    ${pagerHtml}
                </section>`;
        }).join('');

        container.innerHTML = tabBarHtml + pagesHtml;
    }

    function renderFlights(data) {
        const flights = (data && data.flights) || [];
        const hotels = (data && data.hotels) || [];

        const ticketsHtml = flights.length
            ? flights.map(f => buildFlightyCardHtml(f, false)).join('')
            : '<div class="callout-box">尚無航班資訊</div>';

        const hotelsHtml = hotels.length ? hotels.map(h => `
            <div class="hotel-item">
                <div style="min-width: 0; flex: 1;">
                    <div style="font-size: 0.69rem; font-weight: 800; color: var(--accent);" class="tabular-nums">📅 ${h.date_str || ''}</div>
                    <div style="font-size: 0.9rem; font-weight: 800; overflow-wrap: anywhere;">${h.name || ''}</div>
                    ${h.note ? `<div style="font-size: 0.77rem; color: var(--text-secondary); margin-top: 2px; overflow-wrap: anywhere;">${h.note}</div>` : ''}
                </div>
                ${h.map_url ? `<a href="${h.map_url}" target="_blank" rel="noopener" class="map-chip">📍 導航</a>` : ''}
            </div>
        `).join('') : '<div style="font-size: 0.8rem; color: var(--text-muted);">尚無住宿資訊</div>';

        document.getElementById('flights').innerHTML = `
            <div class="panel-head" style="padding: 0 2px;">
                <span class="panel-title">✈️ 航班登機證 (${flights.length} 航段)</span>
                ${flights.length ? `<div style="display:flex; gap:5px; align-items:center;"><button type="button" class="adsb-sync-btn" onclick="openLiveApiSettings()">🔑 真實時刻 API</button><button type="button" class="adsb-sync-btn" onclick="enrichAllFlightsWithAdsbdb(true)">↻ 同步</button></div>` : ''}
            </div>
            ${ticketsHtml}
            ${data && data.flight_note ? `<div class="callout-box">${data.flight_note}</div>` : ''}
            <div class="panel-card" style="margin-top: 11px;">
                <div class="panel-head"><span class="panel-title">🏨 住宿清單 (${hotels.length} 晚/間)</span></div>
                ${hotelsHtml}
            </div>`;
    }

    function renderTheme(guide) {
        if (!guide || !guide.length) {
            document.getElementById('theme').innerHTML = '<div class="panel-card">尚無主題絕景資料。</div>';
            return;
        }
        document.getElementById('theme').innerHTML = guide.map(g => `
            <div class="poi-card">
                <div class="poi-head">
                    <span class="poi-name">✨ ${g.name}</span>
                    ${g.map_url ? `<a href="${g.map_url}" target="_blank" rel="noopener" class="map-chip">📍 導航</a>` : ''}
                </div>
                ${g.best ? `<div style="font-size: 0.79rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; overflow-wrap: anywhere;">★ ${g.best}</div>` : ''}
                <div style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; overflow-wrap: anywhere;">${g.desc || ''}</div>
                ${g.tips ? `<div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; overflow-wrap: anywhere;">📸 ${g.tips}</div>` : ''}
                <div class="pill-row" style="margin-bottom: 0;">
                    ${g.time ? `<span class="mini-pill">${g.time}</span>` : ''}
                    ${g.fee ? `<span class="mini-pill">${g.fee}</span>` : ''}
                    ${g.tag ? `<span class="mini-pill accent">${g.tag}</span>` : ''}
                </div>
            </div>
        `).join('');
    }

    function classifyPoiTag(tagStr) {
        const t = (tagStr || '').toLowerCase();
        if (t.includes('咖') || t.includes('餐') || t.includes('食') || t.includes('酒') || t.includes('甜')) return '美食咖啡';
        if (t.includes('景') || t.includes('拍') || t.includes('山') || t.includes('寺') || t.includes('館')) return '景點絕景';
        if (t.includes('購') || t.includes('物') || t.includes('市')) return '購物市集';
        return '其他';
    }

    function initPOI(list) {
        if (!list || !list.length) {
            document.getElementById('poi-list').innerHTML = '<div class="panel-card">尚無探索地點資料。</div>';
            return;
        }
        const cats = ['全部', '美食咖啡', '景點絕景', '購物市集', '其他'];
        const areas = ['全部地區', ...new Set(list.map(i => i.area).filter(Boolean))];

        document.getElementById('poi-cat-filters').innerHTML = cats.map(c => `
            <button type="button" class="filter-chip ${c === poiCategoryFilter ? 'active' : ''}" onclick="setPoiFilter('cat', '${c}')">${c}</button>
        `).join('');

        document.getElementById('poi-area-filters').innerHTML = areas.map(a => `
            <button type="button" class="filter-chip ${a === poiAreaFilter ? 'active' : ''}" onclick="setPoiFilter('area', '${String(a).replace(/'/g, "\\'")}')">${a}</button>
        `).join('');

        renderPOIList();
    }

    function setPoiFilter(type, val) {
        if (type === 'cat') poiCategoryFilter = val;
        if (type === 'area') poiAreaFilter = val;
        initPOI(globalData.poi_database || []);
    }

    function renderPOIList() {
        const keyword = (document.getElementById('poi-search-input')?.value || '').trim().toLowerCase();
        const filtered = (globalData.poi_database || []).filter(item => {
            const matchArea = poiAreaFilter === '全部地區' || item.area === poiAreaFilter;
            const matchCat = poiCategoryFilter === '全部' || classifyPoiTag(item.tag) === poiCategoryFilter;
            const matchKw = !keyword || `${item.name || ''} ${item.signature || ''} ${item.desc || ''} ${item.area || ''} ${item.tag || ''}`.toLowerCase().includes(keyword);
            return matchArea && matchCat && matchKw;
        });

        document.getElementById('poi-list').innerHTML = filtered.length ? filtered.map(f => `
            <div class="poi-card">
                <div class="poi-head">
                    <span class="poi-name">${f.name}</span>
                    ${f.map_url ? `<a href="${f.map_url}" target="_blank" rel="noopener" class="map-chip">📍 導航</a>` : ''}
                </div>
                ${f.signature ? `<div style="font-size: 0.79rem; font-weight: 700; color: var(--accent); margin-bottom: 3px; overflow-wrap: anywhere;">推薦：${f.signature}</div>` : ''}
                ${f.desc ? `<div style="font-size: 0.79rem; color: var(--text-secondary); margin-bottom: 6px; overflow-wrap: anywhere;">${f.desc}</div>` : ''}
                ${f.tips ? `<div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; overflow-wrap: anywhere;">💡 ${f.tips}</div>` : ''}
                <div class="pill-row" style="margin-bottom: 0;">
                    ${f.area ? `<span class="mini-pill accent">${f.area}</span>` : ''}
                    ${f.tag ? `<span class="mini-pill">${f.tag}</span>` : ''}
                    ${f.price ? `<span class="mini-pill sky tabular-nums">${f.price}</span>` : ''}
                </div>
            </div>
        `).join('') : '<div class="panel-card">無符合條件的地點。</div>';
    }

    function renderBudget(data) {
        const regions = (data && data.regions) || [];
        if (!regions.length) {
            document.getElementById('budget-render').innerHTML = '';
            return;
        }
        document.getElementById('budget-render').innerHTML = `
            <div class="panel-card">
                <div class="panel-head"><span class="panel-title">💳 預算參考</span></div>
                ${regions.map(r => `
                    <div class="callout-box" style="margin-bottom: 8px; background: var(--bg-card-alt);">
                        <div style="font-size: 0.79rem; font-weight: 800; margin-bottom: 4px; color: var(--text-primary);">${r.name}</div>
                        ${(r.items || []).map(i => `<div class="budget-line tabular-nums"><span>${i.label}</span><span>${i.value}</span></div>`).join('')}
                        ${r.total ? `<div class="budget-line tabular-nums" style="font-weight: 800; color: var(--accent);"><span>預估小計</span><span>${r.total}</span></div>` : ''}
                    </div>`).join('')}
                ${data.note ? `<div class="callout-box" style="margin-bottom: 0; background: var(--bg-card-alt);">${data.note}</div>` : ''}
            </div>`;
    }

    function renderLogistics(data) {
        const items = (data && data.items) || [];
        const alerts = (data && data.alerts) || [];
        document.getElementById('logistics').innerHTML = `
            <div class="panel-card">
                <div class="panel-head"><span class="panel-title">☀️ 氣候穿搭與行前筆記</span></div>
                ${items.map(item => `
                    <div style="margin-bottom: 10px;">
                        <div style="font-size: 0.85rem; font-weight: 800; overflow-wrap: anywhere;">${item.icon || '☀️'} ${item.title || ''}</div>
                        <div style="font-size: 0.79rem; color: var(--text-secondary); overflow-wrap: anywhere;">${item.desc || ''}</div>
                    </div>`).join('') || '<div style="font-size: 0.79rem; color: var(--text-muted);">尚無筆記資料</div>'}
                ${alerts.map(a => `<div class="callout-box" style="margin-bottom: 8px; background: var(--bg-card-alt);"><strong>💡 ${a.title || ''}</strong><br>${a.desc || ''}</div>`).join('')}
            </div>`;
    }

    function renderEmergency(data) {
        const guides = (data && data.guides) || [];
        document.getElementById('emergency').innerHTML = `
            <div class="panel-card">
                <div class="panel-head"><span class="panel-title">🛡️ 緊急應變與聯絡</span></div>
                ${guides.map(g => `
                    <div class="callout-box callout-alert" style="margin-bottom: 8px;">
                        <div style="font-size: 0.83rem; font-weight: 800; margin-bottom: 4px;">${g.icon || '🛡️'} ${g.title || ''}</div>
                        <ul style="margin: 0; padding-left: 16px; font-size: 0.79rem;">${(g.bullets || []).map(b => `<li style="overflow-wrap: anywhere;">${b}</li>`).join('')}</ul>
                    </div>`).join('') || '<div style="font-size: 0.79rem; color: var(--text-muted);">尚無應變資料</div>'}
            </div>`;
    }

    function renderChecklist(items) {
        if (!items) return;
        document.getElementById('chk-list').innerHTML = items.map(i => {
            const isChecked = checkedItems.includes(i);
            const escaped = String(i).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            return `
                <div class="check-row ${isChecked ? 'checked' : ''}" onclick="toggleCheck('${escaped}')">
                    <div class="check-box">${isChecked ? '✓' : ''}</div>
                    <span class="check-text" style="font-size: 0.85rem; font-weight: 700; overflow-wrap: anywhere;">${i}</span>
                </div>`;
        }).join('');
        const validCount = checkedItems.filter(i => items.includes(i)).length;
        const pct = items.length === 0 ? 0 : Math.round((validCount / items.length) * 100);
        document.getElementById('chk-fill').style.width = pct + '%';
        document.getElementById('chk-label').innerText = `${validCount}/${items.length} (${pct}%)`;
    }

    function toggleCheck(item) {
        if (checkedItems.includes(item)) checkedItems = checkedItems.filter(i => i !== item);
        else checkedItems.push(item);
        localStorage.setItem('tripChecklist_v9', JSON.stringify(checkedItems));
        renderChecklist(globalData.checklist_items || []);
    }

    function initCurrencyWidget(defaultCur) {
        const sel = document.getElementById('currency-selector');
        const inp = document.getElementById('foreign-amount');
        if (defaultCur && offlineRates[defaultCur.toLowerCase()]) sel.value = defaultCur.toLowerCase();
        currentRate = offlineRates[sel.value] || 0.207;
        document.getElementById('rate-status').innerText = `1 ${sel.value.toUpperCase()} ≈ ${currentRate} TWD`;
        sel.addEventListener('change', e => {
            currentRate = offlineRates[e.target.value] || 0.207;
            document.getElementById('rate-status').innerText = `1 ${e.target.value.toUpperCase()} ≈ ${currentRate} TWD`;
            calculateTWD();
        });
        inp.addEventListener('input', calculateTWD);
    }

    function addAmount(delta) {
        const inp = document.getElementById('foreign-amount');
        inp.value = (parseFloat(inp.value) || 0) + delta;
        calculateTWD();
    }

    function clearAmount() {
        document.getElementById('foreign-amount').value = '';
        calculateTWD();
    }

    function calculateTWD() {
        const amt = parseFloat(document.getElementById('foreign-amount').value) || 0;
        document.getElementById('twd-result').innerText = Math.round(amt * currentRate).toLocaleString();
    }


    /* ================= PIN 鎖屏與 secure_data.js 解密 ================= */
    let currentPin = '';
    const MAX_ATTEMPTS = 5;
    const LOCK_MINUTES = 3;
    let isLockedOut = false;
    let lockTimer = null;

    function lockApp() {
        currentPin = '';
        updateDots();
        const msg = document.getElementById('auth-msg');
        msg.style.color = 'var(--text-secondary)';
        msg.innerText = '已重新鎖定行程';
        document.getElementById('lock-screen').style.display = 'flex';
    }

    function checkLockStatus() {
        const lockUntil = localStorage.getItem('trip_lockout_time');
        if (lockUntil && Date.now() < parseInt(lockUntil, 10)) {
            startLockdown(parseInt(lockUntil, 10));
        } else if (lockUntil) {
            localStorage.removeItem('trip_lockout_time');
            localStorage.removeItem('trip_failed_attempts');
        }
    }

    function startLockdown(endTime) {
        isLockedOut = true;
        currentPin = '';
        updateDots();
        const msg = document.getElementById('auth-msg');
        msg.style.color = 'var(--danger)';
        lockTimer = setInterval(() => {
            const remaining = Math.ceil((endTime - Date.now()) / 1000);
            if (remaining <= 0) {
                clearInterval(lockTimer);
                isLockedOut = false;
                localStorage.removeItem('trip_lockout_time');
                localStorage.removeItem('trip_failed_attempts');
                msg.style.color = 'var(--text-secondary)';
                msg.innerText = '系統已解鎖，請輸入通行碼';
            } else {
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                msg.innerText = `錯誤次數過多，請等待 ${m}分 ${s}秒`;
            }
        }, 1000);
    }

    function pressKey(val) {
        if (isLockedOut) {
            triggerShake();
            return;
        }
        if (navigator.vibrate) navigator.vibrate(25);
        const msg = document.getElementById('auth-msg');
        msg.style.color = 'var(--text-secondary)';
        msg.innerText = '行程資料已加密保護';

        if (val === 'del') {
            currentPin = currentPin.slice(0, -1);
        } else if (currentPin.length < 6) {
            currentPin += val;
        }
        updateDots();
        if (currentPin.length === 6) setTimeout(verifyPin, 90);
    }

    document.addEventListener('keydown', (e) => {
        const lockEl = document.getElementById('lock-screen');
        if (!lockEl || lockEl.style.display === 'none') return;
        if (e.key >= '0' && e.key <= '9') pressKey(e.key);
        else if (e.key === 'Backspace') pressKey('del');
    });

    function updateDots() {
        const dots = document.querySelectorAll('.pin-dot');
        dots.forEach((dot, i) => {
            dot.classList.remove('filled', 'error');
            if (i < currentPin.length) dot.classList.add('filled');
        });
    }

    function triggerShake() {
        const dotsBox = document.getElementById('pin-dots');
        document.querySelectorAll('.pin-dot').forEach(d => d.classList.add('error'));
        dotsBox.classList.remove('shake');
        void dotsBox.offsetWidth;
        dotsBox.classList.add('shake');
    }

    function verifyPin() {
        const msg = document.getElementById('auth-msg');
        if (typeof encryptedTripData === 'undefined') {
            triggerShake();
            currentPin = '';
            updateDots();
            msg.style.color = 'var(--danger)';
            msg.innerText = '找不到 secure_data.js（請確認與 index.html 同資料夾）';
            return;
        }

        let failedAttempts = parseInt(localStorage.getItem('trip_failed_attempts') || '0', 10);
        try {
            const bytes = CryptoJS.AES.decrypt(encryptedTripData, currentPin);
            const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
            if (!decryptedStr) throw new Error('Empty decryption');
            globalData = JSON.parse(decryptedStr);
            if (!globalData || typeof globalData !== 'object') throw new Error('Invalid JSON');

            localStorage.removeItem('trip_failed_attempts');
            document.getElementById('lock-screen').style.display = 'none';
            bootSystem();
        } catch (e) {
            triggerShake();
            failedAttempts++;
            localStorage.setItem('trip_failed_attempts', failedAttempts);

            if (failedAttempts >= MAX_ATTEMPTS) {
                const unlockTime = Date.now() + (LOCK_MINUTES * 60 * 1000);
                localStorage.setItem('trip_lockout_time', unlockTime);
                startLockdown(unlockTime);
            } else {
                currentPin = '';
                updateDots();
                msg.style.color = 'var(--danger)';
                msg.innerText = `密碼錯誤，剩餘 ${MAX_ATTEMPTS - failedAttempts} 次機會`;
            }
        }
    }

    function updateTopbarContext(tabId) {
        const heading = document.getElementById('topbar-title');
        const actionBtn = document.getElementById('topbar-action-btn');
        heading.innerText = tabId === 'dashboard'
            ? ((globalData && globalData.trip_meta && globalData.trip_meta.title) || '旅程看板')
            : (TAB_TITLES[tabId] || '隨身旅圖');

        if (!actionBtn) return;
        if (tabId === 'itinerary') {
            actionBtn.innerText = itineraryOverviewMode ? '單日分頁' : '全天總覽';
        } else if (tabId === 'dashboard') {
            actionBtn.innerText = '🔒 鎖定';
        } else {
            actionBtn.innerText = '回看板';
        }
    }

    function handleTopAction() {
        if (currentMainTab === 'itinerary') {
            itineraryOverviewMode = !itineraryOverviewMode;
            renderItinerary((globalData && globalData.itinerary) || []);
            updateTopbarContext('itinerary');
        } else if (currentMainTab === 'dashboard') {
            lockApp();
        } else {
            switchTab('dashboard');
        }
    }

    checkLockStatus();
</script>
