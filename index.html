    }

    function calcHaversineMeters(lat1, lon1, lat2, lon2) {
        if ([lat1, lon1, lat2, lon2].some(v => typeof v !== 'number' || isNaN(v))) return null;
        const R = 6371000;
        const toRad = d => d * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function formatDistanceAndEta(meters, mode = 'walk') {
        if (typeof meters !== 'number' || isNaN(meters) || meters <= 0) return '';
        const distLabel = meters >= 1000 ? `${(meters / 1000).toFixed(1)} km` : `${meters} m`;
        if (mode === 'bike' || meters > 1200) {
            const mins = Math.max(2, Math.round(meters / 260)); // ~15.6 km/h 休閒騎行
            return `${distLabel} · 單車約 ${mins} 分`;
        }
        const mins = Math.max(1, Math.round(meters / 75)); // ~4.5 km/h 步行
        return `${distLabel} · 步行約 ${mins} 分`;
    }

    async function fetchLiveSpotWeather(coordsInfo) {
        const key = `${coordsInfo.lat.toFixed(2)},${coordsInfo.lon.toFixed(2)}`;
        const cached = spotWeatherCache[key];
        if (cached && (Date.now() - cached.ts < 20 * 60 * 1000)) return cached.data;

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${coordsInfo.lat}&longitude=${coordsInfo.lon}&current=temperature_2m,apparent_temperature,wind_speed_10m,weather_code&daily=sunrise,sunset,precipitation_probability_max&timezone=auto&forecast_days=1`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('weather fetch failed');
        const json = await res.json();
        const cur = json.current || {};
        const daily = json.daily || {};

        const sunriseRaw = (daily.sunrise && daily.sunrise[0]) || '';
        const sunsetRaw = (daily.sunset && daily.sunset[0]) || '';
        const data = {
            temp: typeof cur.temperature_2m === 'number' ? Math.round(cur.temperature_2m) : null,
            feelsLike: typeof cur.apparent_temperature === 'number' ? Math.round(cur.apparent_temperature) : null,
            windKmh: typeof cur.wind_speed_10m === 'number' ? Math.round(cur.wind_speed_10m) : null,
            rainProb: (daily.precipitation_probability_max && typeof daily.precipitation_probability_max[0] === 'number') ? daily.precipitation_probability_max[0] : null,
            sunrise: sunriseRaw.split('T')[1] || '--:--',
            sunset: sunsetRaw.split('T')[1] || '--:--'
        };
        spotWeatherCache[key] = { ts: Date.now(), data };
        try { localStorage.setItem(SPOT_WEATHER_CACHE_KEY, JSON.stringify(spotWeatherCache)); } catch (e) {}
        return data;
    }

        if (/神社|神宮|八幡宮|大社|寺院|寺|教堂|大教堂|修道院|清真寺|遺址|shrine|temple|cathedral|church|basilica|mosque|monument/.test(s)) return { icon: '🏛️', label: '宗教聖地・歷史古蹟', cls: 'rec-cat-shrine', dim: '文化古蹟' };
        if (/城|天守|美術館|博物館|紀念館|建築|老街|古城|町家|橋|塔|館|museum|castle|gallery|architecture|palace/.test(s)) return { icon: '🏛️', label: '建築・博物館・街區', cls: 'rec-cat-arch', dim: '建築美學' };
        if (/庭園|公園|展望|海灘|湖|濕地|林蔭|大道|瀑布|峽谷|冰川|火山|garden|park|viewpoint|beach|cliff|waterfall/.test(s)) return { icon: '📸', label: '自然風景・庭園・展望', cls: 'rec-cat-view', dim: '攝影光線' };
        if (/車站|駅|機場|港|碼頭|station|airport|terminal|harbor/.test(s)) return { icon: '🚉', label: '交通樞紐・車站', cls: 'rec-cat-other', dim: '建築美學' };

    function distillWikiKeyPoints(title, extract) {
        const clean = String(extract || '').replace(/\s+/g, ' ').trim();
        const badge = classifyEntityBadge(title, clean);
        const sentences = clean.split(/(?<=[。！？])/).map(s => s.trim()).filter(Boolean);

        // 第一句通常為定義句，移除括號內冗長日文注音讓重點更乾淨
        let tldr = (sentences[0] || clean).replace(/（[^）]{6,}）/g, '').trim();
        if (tldr.length > 78) tldr = tldr.slice(0, 78) + '…';

        // 從後續句子抓取關鍵亮點（年代、國寶/文化財、建築師、特色）
        const highlights = [];
        const keyPattern = /(建於|創建|始建|世界遺產|國寶|重要文化財|名勝|建築師|藤森照信|沃里斯|原廣司|供奉|主祭|以.{1,14}聞名|特色|賞梅|賞櫻|楓葉|庭園|天守|鳥居)/;
        for (const sent of sentences.slice(1)) {
            if (highlights.length >= 2) break;
            if (keyPattern.test(sent)) {
                let compact = sent.replace(/（[^）]{6,}）/g, '').trim();
                if (compact.length > 64) compact = compact.slice(0, 64) + '…';
                if (compact && compact !== tldr) highlights.push(compact);
            }
        }
        if (!highlights.length && sentences[1]) {
            let s2 = sentences[1].replace(/（[^）]{6,}）/g, '').trim();
            if (s2.length > 64) s2 = s2.slice(0, 64) + '…';
            if (s2) highlights.push(s2);
        }

        return { badge, tldr, highlights, fullText: clean };
    }

    function resolveZhtwWikiKeyword(titleStr) {
        const s = String(titleStr || '');
        for (const item of ZHTW_WIKI_MAP) {
            if (item.match.test(s)) return item.query;
        }
        return s.replace(/[（(][^）)]*[）)]/g, '').split(/[×＆&➔→｜|：:]/)[0].trim();
    }

    async function fetchZhtwWikipediaBrief(titleStr) {
        const kw = resolveZhtwWikiKeyword(titleStr);
        if (!kw) return null;
        if (wikiZhtwCache[kw] !== undefined) return wikiZhtwCache[kw];

        try {
            const searchUrl = `https://zh.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(kw)}&srlimit=1&variant=zh-tw&format=json&origin=*`;
            const sRes = await fetch(searchUrl);
            if (!sRes.ok) return null;
            const sJson = await sRes.json();
            const hit = sJson?.query?.search?.[0];
            if (!hit || !hit.pageid) {
                wikiZhtwCache[kw] = null;
                return null;
            }

            const detailUrl = `https://zh.wikipedia.org/w/api.php?action=query&prop=extracts|info&exintro=1&explaintext=1&inprop=url&redirects=1&converttitles=1&variant=zh-tw&pageids=${hit.pageid}&format=json&origin=*`;
            const dRes = await fetch(detailUrl);
            if (!dRes.ok) return null;
            const dJson = await dRes.json();
            const page = dJson?.query?.pages?.[String(hit.pageid)];
            const extract = String(page?.extract || '').trim();
            if (!extract || /消歧義|消歧义/.test(extract.slice(0, 40))) {
                wikiZhtwCache[kw] = null;
                return null;
            }

            const baseUrl = page.fullurl || `https://zh.wikipedia.org/zh-tw/${encodeURIComponent(page.title || kw)}`;
            const zhtwUrl = baseUrl.includes('variant=') ? baseUrl : `${baseUrl}${baseUrl.includes('?') ? '&' : '?'}variant=zh-tw`;

            const result = {
                title: page.title || kw,
                extract,
                url: zhtwUrl
            };
            wikiZhtwCache[kw] = result;
            try { localStorage.setItem(WIKI_ZHTW_CACHE_KEY, JSON.stringify(wikiZhtwCache)); } catch (e) {}
            return result;
        } catch (e) {
            return null;
        }
    }

        if (batchIdx === 1) {
            return {
                lat: coordsInfo.lat,
                lon: coordsInfo.lon,
                osmRadius: coordsInfo.mode === 'bike' ? 3600 : 2200,
                wikiRadius: coordsInfo.mode === 'bike' ? 5000 : 3500,
                sectorLabel: '擴大生活圈'
            };
        }
        // Batch 2+: 依方位角（北、東、南、西）偏移搜尋圓心，探索不同街區
        const dirs = [
            { n: 1, e: 0, name: '北側街區' },
            { n: 0, e: 1, name: '東側街區' },
            { n: -1, e: 0, name: '南側街區' },
            { n: 0, e: -1, name: '西側街區' }
        ];
        const dir = dirs[(batchIdx - 2) % dirs.length];
        const stepMeters = coordsInfo.mode === 'bike' ? 1600 : 800;
        const shifted = offsetLatLon(coordsInfo.lat, coordsInfo.lon, dir.n * stepMeters, dir.e * stepMeters);
        return {
            lat: shifted.lat,
            lon: shifted.lon,
            osmRadius: coordsInfo.mode === 'bike' ? 2800 : 1600,
            wikiRadius: coordsInfo.mode === 'bike' ? 4500 : 3000,
            sectorLabel: dir.name
        };
    }

    async function fetchWikiNearbyZhtw(coordsInfo, batchIdx = 0) {
        const cfg = getBatchSearchCenterAndRadius(coordsInfo, batchIdx);
        const limit = batchIdx === 0 ? 14 : 25;
        const geoUrl = `https://zh.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${cfg.lat}|${cfg.lon}&gsradius=${cfg.wikiRadius}&gslimit=${limit}&variant=zh-tw&format=json&origin=*`;
        const res = await fetch(geoUrl);
        if (!res.ok) return [];
        const json = await res.json();
        const items = json?.query?.geosearch || [];
        if (!items.length) return [];

        // 過濾掉已經看過的，優先抓取新條目的摘要
        const unseen = items.filter(i => !shownDiscoveryHistory.has(String(i.title || '').toLowerCase().trim()));
        const targetSlice = (unseen.length >= 4 ? unseen : items).slice(0, 14);
        const pageIds = targetSlice.map(i => i.pageid).join('|');

        const extUrl = `https://zh.wikipedia.org/w/api.php?action=query&prop=extracts|info&exintro=1&explaintext=1&exsentences=2&inprop=url&converttitles=1&variant=zh-tw&pageids=${pageIds}&format=json&origin=*`;
        const extRes = await fetch(extUrl);
        const extJson = extRes.ok ? await extRes.json() : {};
        const pages = extJson?.query?.pages || {};

        return targetSlice.map(it => {
            const p = pages[String(it.pageid)] || {};
            const title = p.title || it.title;
            const extract = String(p.extract || '').trim();
            const distilled = distillWikiKeyPoints(title, extract);
            const baseUrl = p.fullurl || `https://zh.wikipedia.org/zh-tw/${encodeURIComponent(title)}`;
            const zhtwUrl = baseUrl.includes('variant=') ? baseUrl : `${baseUrl}${baseUrl.includes('?') ? '&' : '?'}variant=zh-tw`;
            const realDist = calcHaversineMeters(coordsInfo.lat, coordsInfo.lon, it.lat, it.lon) || Math.round(it.dist || 0);
            return {
                source: '維基繁中地標',
                isOpenWorld: true,
                name: title,
                lat: it.lat,
                lon: it.lon,
                distMeters: realDist,
                catBadge: distilled.badge,
                tag: distilled.badge.label,
                keyPoint: distilled.tldr || '歷史與文化地標建築',
                hours: '',
                closed: '',
                price: '',
                extract,
                wikiUrl: zhtwUrl,
                mapUrl: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${title} ${coordsInfo.city || coordsInfo.label}`)}`,
                rawText: `${title} ${distilled.badge.label} ${extract}`
            };
        });
    }

    async function fetchOsmNearbyPois(coordsInfo, batchIdx = 0) {
        const cfg = getBatchSearchCenterAndRadius(coordsInfo, batchIdx);
        const r = cfg.osmRadius;
        // 批次 1+ 擴充查詢 shop（咖啡豆/茶鋪/烘焙/和菓子）與 leisure（庭園/公園），並同時搜尋 node 與 way 建築輪廓
        const extraBlock = batchIdx >= 1
            ? `nwr["shop"~"coffee|tea|bakery|pastry|confectionery"]["name"](around:${r},${cfg.lat},${cfg.lon});nwr["leisure"~"garden|park"]["name"](around:${r},${cfg.lat},${cfg.lon});`
            : '';
        const query = `[out:json][timeout:10];(nwr["amenity"~"cafe|bar|pub|restaurant|ice_cream"]["name"](around:${r},${cfg.lat},${cfg.lon});nwr["tourism"~"viewpoint|museum|gallery"]["name"](around:${r + 350},${cfg.lat},${cfg.lon});nwr["historic"~"castle|shrine|temple|monument|memorial"]["name"](around:${r + 350},${cfg.lat},${cfg.lon});${extraBlock});out center 40;`;

        const res = await fetch('https://overpass-api.de/api/interpreter', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
            body: 'data=' + encodeURIComponent(query)
        });
        if (!res.ok) return [];
        const json = await res.json();
        const elements = Array.isArray(json?.elements) ? json.elements : [];

        return elements
            .filter(el => el.tags && el.tags.name)
            .map(el => {
                const t = el.tags;
                const elLat = typeof el.lat === 'number' ? el.lat : (el.center && el.center.lat);
                const elLon = typeof el.lon === 'number' ? el.lon : (el.center && el.center.lon);
                const displayName = t['name:zh-Hant'] || t['name:zh'] || t.name;
                const classified = classifyOsmFeature(t);
                const dist = calcHaversineMeters(coordsInfo.lat, coordsInfo.lon, elLat, elLon);
                const externalSite = t.website || t['contact:website'] || t['contact:instagram'] || '';
                const kpParts = [classified.keyPoint];
                if (t.opening_hours) kpParts.push(`營業：${t.opening_hours}`);
                if (t.description) kpParts.push(t.description);

                return {
                    source: 'OSM 現地圖資',
                    isOpenWorld: true,
                    name: displayName,
                    lat: elLat,
                    lon: elLon,
                    distMeters: dist || 0,
                    catBadge: classified.badge,
                    tag: classified.badge.label,
                    keyPoint: kpParts.join(' ｜ '),
                    hours: t.opening_hours || '',
                    closed: '',
                    price: '',
                    externalSite,
                    extract: t.description || classified.keyPoint,
                    mapUrl: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${t.name} ${coordsInfo.city || ''}`.trim())}`,
                    rawText: `${displayName} ${t.name} ${classified.badge.label} ${classified.badge.dim} ${t.cuisine || ''} ${t.description || ''}`
                };
            });
    }

    async function fetchOpenWorldNearby(coordsInfo, batchIdx = 0, forceRefresh = false) {
        const key = `${coordsInfo.lat.toFixed(3)},${coordsInfo.lon.toFixed(3)}|b${batchIdx}`;
        const cached = openDiscoveryCache[key];
        if (!forceRefresh && cached && (Date.now() - cached.ts < 6 * 60 * 60 * 1000)) {
            return cached.items;
        }

        const [wikiRes, osmRes] = await Promise.allSettled([
            fetchWikiNearbyZhtw(coordsInfo, batchIdx),
            fetchOsmNearbyPois(coordsInfo, batchIdx)
        ]);

        const combined = [
            ...(wikiRes.status === 'fulfilled' ? wikiRes.value : []),
            ...(osmRes.status === 'fulfilled' ? osmRes.value : [])
        ];

        const seen = new Set();
        const deduped = combined.filter(item => {
            const k = item.name.toLowerCase().trim();
            if (!k || seen.has(k)) return false;
            seen.add(k);
            return true;
        });

        if (deduped.length) {
            openDiscoveryCache[key] = { ts: Date.now(), items: deduped };
            try { localStorage.setItem(OPEN_DISCOVERY_CACHE_KEY, JSON.stringify(openDiscoveryCache)); } catch (e) {}
        }
        return deduped;
    }

    /* 5. 混合式微時刻推薦引擎（重點先出來 + 明確類型標記 + 真正重新查詢換一批） */
    function detectTimeWindowFromContext(ctx) {
        const m = String(ctx.timeStr || '').match(/(\d{1,2}):(\d{2})/);
        if (!m) return 'any';
        const hour = parseInt(m[1], 10);
        if (hour < 11) return 'morning';
        if (hour < 14) return 'midday';
        if (hour < 17) return 'afternoon';
        return 'evening';
    }

    function matchIntentFilter(dims, intent) {
        if (!intent || intent === '全部') return true;
        if (intent === '☕ 咖啡休憩') return dims.includes('精品咖啡') || dims.includes('甜點伴手');
        if (intent === '🏛️ 建築古蹟') return dims.includes('建築美學') || dims.includes('御朱印');
        if (intent === '🍽️ 餐飲小酌') return dims.includes('在地美食') || dims.includes('酒吧小酌');
        if (intent === '📸 風景視野') return dims.includes('攝影光線') || dims.includes('湖岸騎行');
        return true;
    }

    function computeHybridRecommendations(ctx, coordsInfo, weatherData, openWorldItems) {
        const pool = [];

        // A. 開放世界即時探索候選
        (openWorldItems || []).forEach(ow => {
            const inTrip = isAlreadyInUserTrip(ow.name);
            pool.push({
                ...ow,
                inTrip,
                mode: coordsInfo.mode || 'walk'
            });
        });

        // B. 本地 JSON 口袋庫（僅在關閉「只看新發現」時納入）
        if (!recNovelOnly) {
            ((globalData && globalData.poi_database) || []).forEach(p => {
                const pCoords = resolveContextCoords({ title: p.name, area: p.area });
                const dist = calcHaversineMeters(coordsInfo.lat, coordsInfo.lon, pCoords.lat, pCoords.lon);
                const badge = classifyEntityBadge(p.name, `${p.tag || ''} ${p.signature || ''}`);
                pool.push({
                    source: '行程口袋庫',
                    isOpenWorld: false,
                    inTrip: true,
                    kind: 'poi',
                    name: p.name,
                    area: p.area || '',
                    catBadge: badge,
                    tag: badge.label,
                    keyPoint: p.signature ? `必點重點：${p.signature}` : (p.desc || ''),
                    hours: p.hours || '',
                    closed: p.closed || '',
                    price: p.price || '',
                    distMeters: dist || 0,
                    mode: coordsInfo.mode || 'walk',
                    extract: p.desc || '',
                    mapUrl: p.map_url || '',
                    rawText: `${p.name} ${p.tag} ${p.signature} ${p.desc} ${p.tips} ${(p.highlights || []).join(' ')}`
                });
            });

            ((globalData && globalData.theme_guide) || []).forEach((g, idx) => {
                const gCoords = resolveContextCoords({ title: g.name, area: g.area });
                const dist = calcHaversineMeters(coordsInfo.lat, coordsInfo.lon, gCoords.lat, gCoords.lon);
                const badge = classifyEntityBadge(g.name, `${g.tag || ''} ${g.best || ''}`);
                pool.push({
                    source: '主題絕景庫',
                    isOpenWorld: false,
                    inTrip: true,
                    kind: 'theme',
                    themeIdx: idx,
                    name: g.name,
                    area: g.area || '',
                    catBadge: badge,
                    tag: badge.label,
                    keyPoint: g.best ? `核心看點：${g.best}` : (g.desc || ''),
                    hours: g.hours || g.time || '',
                    closed: '',
                    price: g.fee || '',
                    distMeters: dist || 0,
                    mode: coordsInfo.mode || 'walk',
                    extract: g.desc || '',
                    mapUrl: g.map_url || '',
                    rawText: `${g.name} ${g.tag} ${g.best} ${g.desc} ${g.photo_tip || ''} ${g.goshuin || ''} ${(g.highlights || []).join(' ')}`
                });
            });
        }

        const curTitleLower = String(ctx.title || '').toLowerCase();
        const timeWin = detectTimeWindowFromContext(ctx);
        const isColdOrWindy = weatherData && ((weatherData.windKmh !== null && weatherData.windKmh >= 18) || (weatherData.temp !== null && weatherData.temp <= 6));

        const baseFiltered = pool.filter(item => {
            const nLower = item.name.toLowerCase();
            if (curTitleLower.includes(nLower) || nLower.includes(curTitleLower)) return false;
            if (recNovelOnly && item.inTrip) return false;
            const dims = inferFeatureDimensions(item.rawText);
            return matchIntentFilter(dims, recIntentFilter);
        });

        // 在「換一批」時，優先排除已經看過的項目；若新項目不足 4 個才補上舊項目
        const unseenFiltered = recBatchIndex > 0
            ? baseFiltered.filter(item => !shownDiscoveryHistory.has(item.name.toLowerCase().trim()))
            : baseFiltered;
        const effectivePool = unseenFiltered.length >= 2 ? unseenFiltered : baseFiltered;

        const scored = effectivePool.map((item) => {
            const dims = inferFeatureDimensions(item.rawText);
            let score = 48;
            const whyParts = [];

            if (item.distMeters > 0) {
                if (item.distMeters <= 450) {
                    score += 24;
                    whyParts.push('就在旁邊');
                } else if (item.distMeters <= 1200) {
                    score += 17;
                    whyParts.push('順路可達');
                } else if (item.distMeters <= 3200 && item.mode === 'bike') {
                    score += 14;
                    whyParts.push('騎行延伸順路');
                } else {
                    score -= 6;
                }
            }

            if (timeWin === 'morning' && dims.includes('精品咖啡')) {
                score += 15;
                whyParts.push('適合晨間手沖開機');
            } else if (timeWin === 'midday' && dims.includes('在地美食')) {
                score += 16;
                whyParts.push('契合午間用餐時段');
            } else if (timeWin === 'afternoon' && (dims.includes('攝影光線') || dims.includes('精品咖啡'))) {
                score += 14;
                whyParts.push('適合午後斜光拍攝／休憩');
            } else if (timeWin === 'evening' && (dims.includes('酒吧小酌') || dims.includes('在地美食'))) {
                score += 15;
                whyParts.push('適合傍晚放鬆餐酒');
            }

            let prefSum = 0;
            dims.forEach(d => { prefSum += (userTasteProfile[d] || 0.5); });
            const avgPref = prefSum / dims.length;
            score += Math.round(avgPref * 15);
            if (avgPref >= 0.9) {
                whyParts.push(`符合「${dims.slice(0, 2).join('＋')}」偏好`);
            }

            if (isColdOrWindy && (dims.includes('精品咖啡') || dims.includes('建築美學'))) {
                score += 7;
                whyParts.push('室內空間可避冷風');
            }

            const pct = Math.min(99, Math.max(66, score));
            const catBadge = item.catBadge || classifyEntityBadge(item.name, item.rawText);
            const cleanKeyPoint = item.keyPoint || (item.extract ? (item.extract.length > 68 ? item.extract.slice(0, 68) + '…' : item.extract) : `${catBadge.label}`);

            return {
                ...item,
                dims,
                pct,
                catBadge,
                keyPointText: cleanKeyPoint,
                whyText: whyParts.length ? `推薦原因：${whyParts.join(' · ')}` : ''
            };
        });

        // MMR 多樣性重排，確保前 4 名涵蓋不同類型
        scored.sort((a, b) => b.pct - a.pct);
        const selected = [];
        const usedCats = new Set();
        for (const cand of scored) {
            if (selected.length >= 4) break;
            const cLabel = cand.catBadge.label;
            if (selected.length >= 2 && usedCats.has(cLabel) && scored.length > 4) continue;
            selected.push(cand);
            usedCats.add(cLabel);
        }
        for (const cand of scored) {
            if (selected.length >= 4) break;
            if (!selected.includes(cand)) selected.push(cand);
        }

        // 記錄本次已曝光項目，供下次「換一批」排除重複
        selected.forEach(s => shownDiscoveryHistory.add(s.name.toLowerCase().trim()));
        return selected;
    }

    async function triggerGeminiCollaborativePipeline(nonce, forceBypassCache = false) {
        const gCfg = getGeminiConfig();
        if (!gCfg.apiKey || !currentSheetPayload) return;
        const coordsInfo = resolveContextCoords(currentSheetPayload);
        geminiRuntimeStatus = { state: 'loading', modelUsed: gCfg.selectedModel || 'auto', latencySec: '', errorMsg: '', grounded: false };
        refreshSheetRecSection();

        try {
            const aiRecs = await runGeminiCollaborativeRecs(currentSheetPayload, coordsInfo, lastLiveWeather, lastOpenDiscoveries, forceBypassCache);
            if (nonce !== sheetRenderNonce) return;
            lastGeminiRecs = aiRecs || [];
        } catch (err) {
            if (nonce !== sheetRenderNonce) return;
            geminiRuntimeStatus = {
                state: 'error',
                modelUsed: gCfg.selectedModel || '',
                latencySec: '',
                errorMsg: err.message || '協作請求失敗',
                grounded: false
            };
        }
        if (nonce === sheetRenderNonce) refreshSheetRecSection();
    }

    async function shuffleSheetRecs() {
        if (!currentSheetPayload || recIsFetching) return;
        hapticTick(10);
        recIsFetching = true;
        recBatchIndex += 1;
        lastGeminiRecs = [];
        const nonce = sheetRenderNonce;

        const coordsInfo = resolveContextCoords(currentSheetPayload);
        const sectorCfg = getBatchSearchCenterAndRadius(coordsInfo, recBatchIndex);
        const hasGemini = Boolean(getGeminiConfig().apiKey);

        const ctrlBox = document.getElementById('sheet-rec-controls');
        const listBox = document.getElementById('sheet-rec-list');
        const badgeBox = document.getElementById('sheet-rec-badge');
        if (ctrlBox) ctrlBox.innerHTML = renderRecControlsHtml();
        if (badgeBox) badgeBox.innerText = `第 ${recBatchIndex + 1} 批查詢中...`;
        if (listBox) {
            listBox.innerHTML = `<div style="font-size:0.78rem; color:var(--sky); padding:10px 4px; font-weight:700;">🔄 正在向圖資${hasGemini ? '與 Gemini 適中模型' : ''}重新檢索「${sectorCfg.sectorLabel}（半徑 ${sectorCfg.osmRadius}m）」新地點...</div>`;
        }

        try {
            const freshItems = await fetchOpenWorldNearby(coordsInfo, recBatchIndex, true);
            if (nonce !== sheetRenderNonce) return;
            const existingNames = new Set(lastOpenDiscoveries.map(i => i.name.toLowerCase().trim()));
            const newlyAdded = (freshItems || []).filter(i => !existingNames.has(i.name.toLowerCase().trim()));
            lastOpenDiscoveries = [...newlyAdded, ...lastOpenDiscoveries];

            if (hasGemini) {
                await triggerGeminiCollaborativePipeline(nonce, true);
                if (nonce === sheetRenderNonce && geminiRuntimeStatus.state === 'ready') {
                    showNativeToast(`✨ Gemini (${shortModelDisplayName(geminiRuntimeStatus.modelUsed)}) 已協作生成第 ${recBatchIndex + 1} 批推薦`);
                }
            } else {
                showNativeToast(`✓ 已重新查詢「${sectorCfg.sectorLabel}」，新增 ${newlyAdded.length} 個周邊選項`);
            }
        } catch (e) {
            if (nonce !== sheetRenderNonce) return;
            showNativeToast('⚠️ 網路查詢逾時，已切換排序組合');
        } finally {
            recIsFetching = false;
            if (nonce === sheetRenderNonce) refreshSheetRecSection();
        }
    }

    function refreshSheetRecSection() {
        if (!currentSheetPayload) return;
        const coordsInfo = resolveContextCoords(currentSheetPayload);
        const localRecs = computeHybridRecommendations(currentSheetPayload, coordsInfo, lastLiveWeather, lastOpenDiscoveries);
        const gCfg = getGeminiConfig();

        let mergedRecs = localRecs;
        if (gCfg.apiKey && lastGeminiRecs.length) {
            const filteredAi = lastGeminiRecs.filter(item => {
                const dims = inferFeatureDimensions(item.rawText);
                return matchIntentFilter(dims, recIntentFilter);
            });
            if (filteredAi.length) {
                const aiNames = new Set(filteredAi.map(a => a.name.toLowerCase().trim()));
                const extraLocal = localRecs.filter(l => !aiNames.has(l.name.toLowerCase().trim()));
                mergedRecs = [...filteredAi, ...extraLocal].slice(0, 4);
            }
        }

        const ctrlBox = document.getElementById('sheet-rec-controls');
        const listBox = document.getElementById('sheet-rec-list');
        const badgeBox = document.getElementById('sheet-rec-badge');
        const geminiBtn = document.getElementById('sheet-gemini-btn');

        if (geminiBtn) {
            if (!gCfg.apiKey) {
                geminiBtn.className = 'gemini-pill-btn';
                geminiBtn.innerText = '🔑 啟用 Gemini 協作';
            } else if (geminiRuntimeStatus.state === 'loading') {
                geminiBtn.className = 'gemini-pill-btn';
                geminiBtn.innerText = `⏳ ${shortModelDisplayName(gCfg.selectedModel || 'Gemini')} 思考中...`;
            } else if (geminiRuntimeStatus.state === 'ready') {
                geminiBtn.className = 'gemini-pill-btn active';
                geminiBtn.innerText = `✨ ${shortModelDisplayName(geminiRuntimeStatus.modelUsed)} · ${geminiRuntimeStatus.latencySec}s`;
            } else if (geminiRuntimeStatus.state === 'error') {
                geminiBtn.className = 'gemini-pill-btn';
                geminiBtn.innerText = '⚠️ Gemini 協作設定';
            } else {
                geminiBtn.className = 'gemini-pill-btn active';
                geminiBtn.innerText = `✨ ${shortModelDisplayName(gCfg.selectedModel || 'Gemini')}`;
            }
        }

        if (ctrlBox) ctrlBox.innerHTML = renderRecControlsHtml();
        if (listBox) listBox.innerHTML = renderRecCardsHtml(mergedRecs);
        if (badgeBox) {
            badgeBox.innerText = (gCfg.apiKey && lastGeminiRecs.length)
                ? `AI 協作 ${mergedRecs.length} 處`
                : (recNovelOnly ? `新發現 ${mergedRecs.length} 處` : `精選 ${mergedRecs.length} 處`);
        }
    }

    /* 6. 智慧多語關鍵字拆解 ＋ Google Maps 真實人流／熱門時段 ＋ 全球目的地自動適配 */
    let activeSearchEntityIdx = 0;
    let customOverrideKeyword = '';

    function extractMapUrlQuery(mapUrl) {
        if (!mapUrl) return '';
        try {
            const u = new URL(mapUrl);
            const raw = u.searchParams.get('query') || u.searchParams.get('q') || '';
            return decodeURIComponent(raw.replace(/\+/g, ' ')).trim();
        } catch (e) {
            const m = String(mapUrl).match(/[?&](?:query|q)=([^&]+)/i);
            if (!m) return '';
            try { return decodeURIComponent(m[1].replace(/\+/g, ' ')).trim(); } catch (e2) { return m[1]; }
        }
    }

    const ITIN_NOISE_PREFIX = /^(返抵|抵達|前往|搭乘?|領取|異地還車|退房|寄放行李|寄行李|取行李|逆向先攻|南下段|北上中段|北上終段|晨間第一咖|晨間第二咖|晨湯醒神|國寶)[：:\s]*/;
    const ITIN_NOISE_SUFFIX = /(高蛋白晚餐|高蛋白補給|豪華海鮮丼早餐|輕量早餐|溫泉放鬆|雙層溫泉舒緩|坐式早餐|手沖醒腦|早春賞梅|快拍|散策|單車精華線|異地還車|二選一|地景建築|池畔倒影|晨光木構|建築美學|寄行李|退房寄放行李|領取運動型越野車|取單車|入境)$/;
    const GENERIC_TRANSIT_WORDS = new Set(['返抵京都', '京都站', '關西機場', '京都市區', '抵達', '出發', '午餐', '晚餐', '早餐']);

    function stripItineraryFluff(raw) {
        let s = String(raw || '').trim();
        s = s.replace(/約\s*[\d.–-]+\s*km/gi, '').replace(/[\d.]+\s*km/gi, '');
        s = s.replace(/^[（(]|[）)]$/g, '').trim();
        s = s.replace(/^[：:・\-—]+|[：:・\-—]+$/g, '').trim();
        s = s.replace(ITIN_NOISE_PREFIX, '').trim();
        s = s.replace(ITIN_NOISE_SUFFIX, '').trim();
        s = s.replace(ITIN_NOISE_PREFIX, '').trim();
        s = s.replace(/(晚餐|午餐|早餐|咖啡廳|單車補給站)$/, '').trim();
        return s;
    }

    function deriveCoreBrand(nameStr) {
        const raw = String(nameStr || '').trim();
        if (!raw) return '';
        if (/^[A-Za-z0-9\s.'&\-éÉ]+$/.test(raw)) {
            const stripped = raw
                .replace(/\b(Kyoto|Tokyo|Osaka|Takashima|Omi-?Hachiman|Omihachiman|Hikone|Makino|Ishiyama|Otsu|Bangkok|Prague|Budapest|Lisbon|Porto|Barcelona|Madrid|London|Seoul|Taipei|Station|Shichijo|Kawaramachi|Stand|Branch|Main Store|International Airport|Airport|Garden|Temple|Shrine)\b/gi, '')
                .replace(/\s{2,}/g, ' ')
                .trim();
            if (stripped.length >= 4) return stripped;
            const withCity = raw
                .replace(/\b(Station|Shichijo|Kawaramachi|Stand|Branch|Main Store|International Airport|Airport)\b/gi, '')
                .replace(/\s{2,}/g, ' ')
                .trim();
            return withCity || raw;
        }
        const cjkBrand = raw
            .replace(/(京都駅前店|八條口店|京都七條店|京都七條|近江八幡本店|八幡堀店|本店|分店|站前店)$/, '')
            .trim();
        return cjkBrand.length >= 2 ? cjkBrand : raw;
    }

    function extractSmartEntities(ctx) {
        const entities = [];
        const seen = new Set();

        function pushEntity(label, localTerm, brandTerm, langHint = 'local') {
            const cleanLocal = String(localTerm || '').replace(/\s{2,}/g, ' ').trim();
            const cleanBrand = String(brandTerm || cleanLocal).replace(/\s{2,}/g, ' ').trim();
            const key = cleanLocal.toLowerCase();
            if (!key || key.length < 2 || seen.has(key) || GENERIC_TRANSIT_WORDS.has(cleanLocal)) return;
            seen.add(key);
            entities.push({
                label: label || cleanLocal,
                local: cleanLocal,
                brand: cleanBrand || cleanLocal,
                langHint
            });
        }

        const mapQ = extractMapUrlQuery(ctx.mapUrl);
        if (mapQ) {
            const isEn = /^[A-Za-z0-9\s.'&\-éÉ]+$/.test(mapQ);
            pushEntity(mapQ, mapQ, deriveCoreBrand(mapQ), isEn ? 'en' : 'local');
        }

        const titleRaw = String(ctx.title || '');
        const pois = (globalData && globalData.poi_database) || [];
        const themes = (globalData && globalData.theme_guide) || [];
        [...pois, ...themes].forEach(item => {
            const itemMapQ = extractMapUrlQuery(item.map_url);
            const itemNameClean = String(item.name || '').replace(/[（(][^）)]*[）)]/g, '').trim();
            const sameMap = mapQ && itemMapQ && mapQ.toLowerCase() === itemMapQ.toLowerCase();
            const sharedToken = itemNameClean.length >= 3 && (titleRaw.includes(itemNameClean) || itemNameClean.includes(titleRaw));
            const hiroMatch = /弘/.test(titleRaw) && /焼肉処\s*弘/.test(itemNameClean);
            if (sameMap || sharedToken || hiroMatch) {
                pushEntity(itemNameClean, itemNameClean, deriveCoreBrand(itemNameClean), 'native');
            }
        });

        const bracketMatches = [...titleRaw.matchAll(/[（(]([^）)]+)[）)]/g)].map(m => m[1]);
        const titleWithoutBrackets = titleRaw.replace(/[（(][^）)]*[）)]/g, ' ');
        const rawSegments = [
            ...titleWithoutBrackets.split(/➔|→|->|×|＆|&|／|\//),
            ...bracketMatches.flatMap(b => b.split(/／|\/|、|＆|&/))
        ];

        rawSegments.forEach(seg => {
            const cleaned = stripItineraryFluff(seg);
            if (!cleaned || cleaned.length < 2) return;
            const isEn = /^[A-Za-z0-9\s.'&\-éÉ]+$/.test(cleaned);
            pushEntity(cleaned, cleaned, deriveCoreBrand(cleaned), isEn ? 'en' : 'zh');
        });

        if (!entities.length) {
            const fallback = stripItineraryFluff(titleRaw) || titleRaw.trim();
            pushEntity(fallback, fallback, deriveCoreBrand(fallback), 'zh');
        }
        return entities;
    }

    function detectDestinationRegion(ctx, coordsInfo) {
        const lat = coordsInfo && coordsInfo.lat;
        const lon = coordsInfo && coordsInfo.lon;
        if (typeof lat === 'number' && typeof lon === 'number' && !isNaN(lat) && !isNaN(lon)) {
            if (lat >= 24 && lat <= 46 && lon >= 122.5 && lon <= 146) return 'JP';
            if (lat >= 21.5 && lat <= 25.5 && lon >= 119.3 && lon <= 122.2) return 'TW';
            if (lat >= 22.1 && lat <= 22.6 && lon >= 113.4 && lon <= 114.5) return 'HK';
            if (lat >= 33.0 && lat <= 38.7 && lon >= 124.5 && lon <= 131.5) return 'KR';
            if (lat >= 5.5 && lat <= 20.5 && lon >= 97.3 && lon <= 105.7) return 'TH';
            if (lat >= 0.8 && lat <= 7.5 && lon >= 99.5 && lon <= 119.5) return 'SG_MY';
            if (lat >= -11 && lat <= 6 && lon >= 95 && lon <= 141) return 'ID';
            if (lat >= 4.5 && lat <= 21 && lon >= 116 && lon <= 127) return 'PH';
            if (lat >= 49.8 && lat <= 61 && lon >= -8.5 && lon <= 2.0) return 'UK';
            if (lat >= 63 && lat <= 67 && lon >= -25 && lon <= -13) return 'IS';
            if (lat >= 35 && lat <= 71 && lon >= -10 && lon <= 32) return 'EU';
        }
        const cur = ((globalData && globalData.trip_meta && globalData.trip_meta.currency) || '').toLowerCase();
        const curMap = {
            jpy: 'JP', twd: 'TW', hkd: 'HK', krw: 'KR', thb: 'TH',
            sgd: 'SG_MY', myr: 'SG_MY', idr: 'ID', php: 'PH',
            gbp: 'UK', isk: 'IS', eur: 'EU', czk: 'EU', huf: 'EU'
        };
        if (curMap[cur]) return curMap[cur];

        const tripText = `${(globalData && globalData.trip_meta && globalData.trip_meta.title) || ''} ${ctx.title || ''} ${ctx.area || ''}`.toUpperCase();
        if (/\b(KIX|NRT|HND|CTS|FUK|OKA|NGO|TAK|MYJ)\b|日本|京都|東京|大阪|北海道|四國/.test(tripText)) return 'JP';
        if (/\b(BKK|DMK|HKT)\b|泰國|曼谷|普吉/.test(tripText)) return 'TH';
        if (/\b(LHR|LGW)\b|英國|倫敦/.test(tripText)) return 'UK';
        if (/\b(KEF)\b|冰島/.test(tripText)) return 'IS';
        if (/\b(HEL|PRG|BUD|LIS|OPO|BCN|MAD)\b|歐洲|布拉格|布達佩斯|里斯本|巴塞隆納/.test(tripText)) return 'EU';
        if (/\b(ICN|GMP|CJU)\b|韓國|首爾|濟州/.test(tripText)) return 'KR';
        if (/\b(HKG)\b|香港/.test(tripText)) return 'HK';
        if (/\b(TPE|TSA|RMQ|KHH)\b|台灣|台北|台中/.test(tripText)) return 'TW';
        return 'GLOBAL';
    }

        const s = String(hayText || '').toLowerCase();
        if (/東京|新宿|澀谷|銀座|橫濱|成田|羽田|新幹線|jr東|山手/.test(s)) return 'https://traininfo.jreast.co.jp/train_info/e/';

        if (/高松|松山|四國|今治|琴平/.test(s)) return 'https://www.jr-shikoku.co.jp/info/';
        return 'https://trafficinfo.westjr.co.jp/kinki.html';

        const uniqueTerms = [...new Set(topTwoTerms.filter(Boolean))];

    /* 左右滑動切換單日行程 + Bottom Sheet 往下滑動關閉 */
    function initNativeGestures() {
        const itinEl = document.getElementById('itinerary');
        if (itinEl) {
            let startX = 0, startY = 0, tracking = false;
            itinEl.addEventListener('touchstart', (e) => {
                if (itineraryOverviewMode || e.touches.length !== 1) { tracking = false; return; }
                if (e.target.closest('.day-tab-strip, .filter-row, input, textarea, select')) { tracking = false; return; }
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                tracking = true;
            }, { passive: true });

            itinEl.addEventListener('touchend', (e) => {
                if (!tracking || !e.changedTouches.length) return;
                tracking = false;
                const dx = e.changedTouches[0].clientX - startX;
                const dy = e.changedTouches[0].clientY - startY;
                if (Math.abs(dx) > 58 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                    const days = (globalData && globalData.itinerary) || [];
                    const curIdx = days.findIndex(d => Number(d.day) === Number(activeDayNum));
                    if (dx < 0 && curIdx >= 0 && curIdx < days.length - 1) {
                        selectDayTab(days[curIdx + 1].day, 'next');
                    } else if (dx > 0 && curIdx > 0) {
                        selectDayTab(days[curIdx - 1].day, 'prev');
                    }
                }
            }, { passive: true });
        }

        const sheet = document.getElementById('native-sheet');
        const grabZone = document.getElementById('sheet-grabber-zone');
        if (sheet && grabZone) {
            let sy = 0, dragging = false;
            grabZone.addEventListener('touchstart', (e) => {
                sy = e.touches[0].clientY;
                dragging = true;
                sheet.style.transition = 'none';
            }, { passive: true });
            grabZone.addEventListener('touchmove', (e) => {
                if (!dragging) return;
                const delta = Math.max(0, e.touches[0].clientY - sy);
                sheet.style.transform = `translate(-50%, ${delta}px)`;
            }, { passive: true });
            grabZone.addEventListener('touchend', (e) => {
                if (!dragging) return;
                dragging = false;
                sheet.style.transition = '';
                const delta = e.changedTouches[0].clientY - sy;
                if (delta > 70) closeNativeSheet();
                else sheet.style.transform = '';
            }, { passive: true });
        }
    }

    /* 從當前載入的行程 JSON 自動萃取該國家的「行程 DNA 特點」（移動方式、飲食偏好、主題密度） */
    function syncTripCountryDNA() {
        if (!globalData || typeof globalData !== 'object') return;
        const days = Array.isArray(globalData.itinerary) ? globalData.itinerary : [];
        const pois = Array.isArray(globalData.poi_database) ? globalData.poi_database : [];
        const themes = Array.isArray(globalData.theme_guide) ? globalData.theme_guide : [];
        const logisticsItems = (globalData.logistics && Array.isArray(globalData.logistics.items)) ? globalData.logistics.items : [];

        const groupedTexts = {};
        const addSample = (cInfo, txt) => {
            if (!cInfo || !cInfo.key || !txt) return;
            if (!groupedTexts[cInfo.key]) groupedTexts[cInfo.key] = { name: cInfo.name, texts: [] };
            groupedTexts[cInfo.key].texts.push(txt);
        };

        days.forEach(d => {
            let coords = null;
            if (d.coords) {
                const [lat, lon] = String(d.coords).split(',').map(Number);
                if (!isNaN(lat) && !isNaN(lon)) coords = { lat, lon, label: d.title || '' };
            }
            const cInfo = resolveDestinationCountry({ title: `${d.title || ''} ${d.subtitle || ''}` }, coords);
            const dayCorpus = [
                d.title, d.subtitle, d.plan_b, d.photo_notes,
                ...(d.schedule || []).map(s => `${s.activity || ''} ${s.transport || ''} ${s.desc || ''}`)
            ].filter(Boolean).join(' ');
            addSample(cInfo, dayCorpus);
        });

        pois.forEach(p => {
            const cInfo = resolveDestinationCountry({ title: p.name, area: p.area }, null);
            addSample(cInfo, `${p.tag || ''} ${p.name || ''} ${p.signature || ''} ${p.desc || ''}`);
        });

        themes.forEach(g => {
            const cInfo = resolveDestinationCountry({ title: g.name, area: g.area }, null);
            addSample(cInfo, `${g.tag || ''} ${g.name || ''} ${g.best || ''} ${g.desc || ''}`);
        });

        const logCorpus = logisticsItems.map(i => `${i.title || ''} ${i.desc || ''}`).join(' ');

        Object.entries(groupedTexts).forEach(([cKey, grp]) => {
            const bucket = ensureCountryBucket(cKey, grp.name);
            const fullCorpus = `${grp.texts.join(' ')} ${logCorpus}`.toLowerCase();
            const dna = [];

            if (/單車|騎行|越野車|bike|cycle|biwaichi/.test(fullCorpus)) dna.push('行程節奏以單車騎行與沿途補給站為主');
            else if (/健行|登山|攻頂|步道|trek|hike|summit/.test(fullCorpus)) dna.push('行程包含山岳／自然步道健行，重視高蛋白餐飲與體力恢復');
            else if (/包車|自駕|專車|driver|private car/.test(fullCorpus)) dna.push('移動以包車／專車接駁為主，可彈性延伸周邊景點');
            else if (/jr|新幹線|地鐵|火車|渡輪|metro|train|ferry/.test(fullCorpus)) dna.push('高度依賴軌道交通與車站步行圈動線');

            const dimCounts = {};
            grp.texts.forEach(t => {
                inferFeatureDimensions(t).forEach(d => { dimCounts[d] = (dimCounts[d] || 0) + 1; });
            });
            const topDims = Object.entries(dimCounts).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k]) => k);
            if (topDims.length) dna.push(`本行程在當地的核心關注領域：${topDims.join('、')}`);

            if (/高蛋白|protein/.test(fullCorpus)) dna.push('餐飲偏好高蛋白、優質肉類或海鮮補給');
            if (/手沖|淺焙|single origin|pour-over|roast/.test(fullCorpus)) dna.push('咖啡偏好獨立自家烘焙與單品手沖');
            if (/順光|斜光|倒影|日出|日落|golden hour/.test(fullCorpus)) dna.push('重視自然光線窗口（晨光／斜射光／倒影構圖）');

            bucket.tripDna = [...new Set(dna)].slice(0, 5);
            bucket.updatedAt = Date.now();
        });

        saveCountryTraitsStore();
    }

    function recordCountryTraitSignal(countryKey, countryName, text, dims, delta = 0.08) {
        if (!countryKey) return;
        const bucket = ensureCountryBucket(countryKey, countryName);
        (dims || inferFeatureDimensions(text)).forEach(d => {
            const cur = typeof bucket.dimAffinity[d] === 'number' ? bucket.dimAffinity[d] : 0;
            bucket.dimAffinity[d] = +(cur + delta).toFixed(2);
        });
        const cleanKw = String(text || '').replace(/[（(][^）)]*[）)]/g, '').trim();
        if (cleanKw && cleanKw.length >= 2 && cleanKw.length <= 24 && delta >= 0.15) {
            if (!bucket.savedKeywords.includes(cleanKw)) {
                bucket.savedKeywords.unshift(cleanKw);
                bucket.savedKeywords = bucket.savedKeywords.slice(0, 12);
            }
        }
        bucket.updatedAt = Date.now();
        saveCountryTraitsStore();
    }

    /* 自動適中模型評分器：鎖定最新世代標準 Flash（排除過輕的 lite/8b 與過重的 pro/ultra/thinking） */
    function scoreGeminiModelForSweetSpot(mObj) {
        const rawName = String(mObj.name || '').replace(/^models\//, '');
        const lower = rawName.toLowerCase();
        const methods = Array.isArray(mObj.supportedGenerationMethods) ? mObj.supportedGenerationMethods : [];
        if (!methods.includes('generateContent')) return null;

        const banned = ['embedding', 'imagen', 'veo', 'lyria', 'tts', 'audio', 'robotics', 'computer-use', 'deep-research', 'aqa', 'learnlm', 'gemma', 'bisect', 'image'];
        if (banned.some(b => lower.includes(b))) return null;
        if (!lower.includes('gemini')) return null;

        const verMatch = lower.match(/gemini-(\d+(?:\.\d+)?)/);
        const version = verMatch ? parseFloat(verMatch[1]) : 1.5;

        let score = version * 22;
        let tier = 'balanced';
        let tierBadge = '⚖️ 適中平衡（自動首選）';

        const isLite = /lite|8b|nano/.test(lower);
        const isHeavy = /\bpro\b|\bultra\b|thinking/.test(lower);
        const isFlash = /flash/.test(lower);

        if (isFlash && !isLite && !isHeavy) {
            score += 65;
            tier = 'balanced';
            tierBadge = '⚖️ 適中平衡（主力推薦）';
        } else if (isLite) {
            score += 20;
            tier = 'fast_lite';
            tierBadge = '⚡ 極速輕量（較簡略）';
        } else if (isHeavy) {
            score += 32;
            tier = 'deep_heavy';
            tierBadge = '🧠 深度重型（較慢）';
        } else {
            score += 25;
        }

        if (/exp/.test(lower)) score -= 6;
        if (/preview/.test(lower)) score -= 2;

        return {
            id: rawName,
            displayName: mObj.displayName || rawName,
            version,
            tier,
            tierBadge,
            score: Math.round(score * 10) / 10
        };
    }

    async function refreshGeminiModelList(apiKey, silent = false) {
        const cleanKey = String(apiKey || '').trim();

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`);
        if (!res.ok) {
            const errTxt = await res.text().catch(() => '');
            throw new Error(`API 驗證失敗 (${res.status}) ${errTxt.slice(0, 80)}`);
        }
        const json = await res.json();
        const models = Array.isArray(json?.models) ? json.models : [];
        const scored = models
            .map(scoreGeminiModelForSweetSpot)
            .filter(Boolean)
            .sort((a, b) => b.score - a.score);

        const seen = new Set();
        const uniqueRanked = scored.filter(item => {
            if (seen.has(item.id)) return false;
            seen.add(item.id);
            return true;
        });

        const primary = uniqueRanked[0] ? uniqueRanked[0].id : 'gemini-2.5-flash';
        const fallback = uniqueRanked[1] ? uniqueRanked[1].id : 'gemini-2.0-flash';

        const cfg = getGeminiConfig();
        cfg.apiKey = cleanKey;
        cfg.detectedModels = uniqueRanked.slice(0, 8);
        cfg.selectedModel = primary;
        cfg.fallbackModel = fallback;
        cfg.lastCheckedTs = Date.now();
        saveGeminiConfig(cfg);

        if (!silent) {
            showNativeToast(`✓ 已自動鎖定適中模型：${shortModelDisplayName(primary)}`);
        }
        return cfg;
    }

    /* 兼容解析 Gemini 回傳（支援新式 { country_name, learned_traits, recommendations } 與舊式純陣列 [...]） */
    function extractGeminiCollaborativePayload(rawText) {
        const cleaned = String(rawText || '')
            .replace(/```json\s*/gi, '')
            .replace(/```\s*/g, '')
            .trim();

        const objStart = cleaned.indexOf('{');
        const arrStart = cleaned.indexOf('[');

        if (objStart !== -1 && (arrStart === -1 || objStart < arrStart)) {
            const objEnd = cleaned.lastIndexOf('}');
            if (objEnd > objStart) {
                const parsedObj = JSON.parse(cleaned.slice(objStart, objEnd + 1));
                if (parsedObj && Array.isArray(parsedObj.recommendations)) {
                    return {
                        countryName: String(parsedObj.country_name || '').trim(),
                        learnedTraits: Array.isArray(parsedObj.learned_traits) ? parsedObj.learned_traits : [],
                        items: parsedObj.recommendations
                    };
                }
            }
        }

        if (arrStart !== -1) {
            const arrEnd = cleaned.lastIndexOf(']');
            if (arrEnd > arrStart) {
                const parsedArr = JSON.parse(cleaned.slice(arrStart, arrEnd + 1));
                if (Array.isArray(parsedArr)) {
                    return { countryName: '', learnedTraits: [], items: parsedArr };
                }
            }
        }
        throw new Error('模型未回傳有效 JSON 結構');
    }

    function mapCategoryStringToBadge(catStr, titleStr) {
        const s = String(catStr || '');
        if (s.includes('咖啡') || s.includes('茶館')) return { icon: '☕', label: '獨立咖啡・茶館', cls: 'rec-cat-cafe', dim: '精品咖啡' };
        if (s.includes('餐食') || s.includes('料理')) return { icon: '🍽️', label: '在地餐食・料理', cls: 'rec-cat-food', dim: '在地美食' };
        if (s.includes('酒吧') || s.includes('小酌')) return { icon: '🍺', label: '酒吧・精釀小酌', cls: 'rec-cat-bar', dim: '酒吧小酌' };
        if (s.includes('甜點') || s.includes('烘焙') || s.includes('伴手')) return { icon: '🥐', label: '甜點・烘焙・伴手', cls: 'rec-cat-sweet', dim: '甜點伴手' };
        if (s.includes('宗教') || s.includes('聖地') || s.includes('神社') || s.includes('寺院')) return { icon: '🏛️', label: '宗教聖地・歷史古蹟', cls: 'rec-cat-shrine', dim: '文化古蹟' };
        if (s.includes('建築') || s.includes('博物館') || s.includes('街區')) return { icon: '🏛️', label: '建築・博物館・街區', cls: 'rec-cat-arch', dim: '建築美學' };
        if (s.includes('自然') || s.includes('庭園') || s.includes('展望') || s.includes('風景')) return { icon: '📸', label: '自然風景・庭園・展望', cls: 'rec-cat-view', dim: '攝影光線' };
        return classifyEntityBadge(titleStr, s);
    }

    async function callGeminiGenerateSingle(apiKey, modelId, systemPrompt, userPrompt, useGrounding = true, useThinkingBudget = true) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelId)}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const genConfig = {
            temperature: 0.45,
            maxOutputTokens: 1600
        };
        if (useThinkingBudget && /2\.5|3/.test(modelId) && !/lite/.test(modelId)) {
            genConfig.thinkingConfig = { thinkingBudget: 512 };
        }

        const bodyObj = {
            systemInstruction: { parts: [{ text: systemPrompt }] },
            contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
            generationConfig: genConfig
        };
        if (useGrounding) {
            bodyObj.tools = [{ google_search: {} }];
        }

        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyObj)
        });

        if (!res.ok) {
            const errBody = await res.text().catch(() => '');
            const err = new Error(`HTTP ${res.status}: ${errBody.slice(0, 140)}`);
            err.status = res.status;
            throw err;
        }

        const data = await res.json();
        const candidate = data?.candidates?.[0];
        const parts = candidate?.content?.parts || [];
        const textOut = parts.map(p => p.text || '').join('\n').trim();
        const hasGrounding = Boolean(candidate?.groundingMetadata?.webSearchQueries?.length || candidate?.groundingMetadata?.groundingChunks?.length);
        return { textOut, hasGrounding };
    }

    async function runGeminiCollaborativeRecs(ctx, coordsInfo, weatherData, openWorldCandidates, forceBypassCache = false) {
        let cfg = getGeminiConfig();
        if (!cfg.apiKey) return null;

        if (!cfg.selectedModel || (Date.now() - cfg.lastCheckedTs > GEMINI_MODEL_TTL_MS)) {
            try {
                cfg = await refreshGeminiModelList(cfg.apiKey, true) || cfg;
            } catch (e) {}
        }

        const countryInfo = resolveDestinationCountry(ctx, coordsInfo);
        const countryContextBlock = buildCountryContextSummary(countryInfo);

        const primaryModel = cfg.mode === 'manual' && cfg.manualModel
            ? cfg.manualModel
            : (cfg.selectedModel || 'gemini-2.5-flash');
        const fallbackModel = cfg.fallbackModel && cfg.fallbackModel !== primaryModel
            ? cfg.fallbackModel
            : 'gemini-2.0-flash';

        const excludedList = [
            ctx.title || '',
            ...Array.from(shownDiscoveryHistory),
            ...((globalData && globalData.poi_database) || []).map(p => p.name),
            ...((globalData && globalData.theme_guide) || []).map(g => g.name)
        ].filter(Boolean).slice(0, 35);

        const cacheKey = `${primaryModel}|${countryInfo.key}|${ctx.title}|${coordsInfo.lat.toFixed(3)},${coordsInfo.lon.toFixed(3)}|${recIntentFilter}|${recNovelOnly}|b${recBatchIndex}`;
        if (!forceBypassCache && geminiRespCache[cacheKey] && (Date.now() - geminiRespCache[cacheKey].ts < 30 * 60 * 1000)) {
            const hit = geminiRespCache[cacheKey];
            geminiRuntimeStatus = {
                state: 'ready',
                modelUsed: hit.modelUsed,
                latencySec: hit.latencySec,
                errorMsg: '',
                grounded: hit.grounded
            };
            return hit.items;
        }

        const topPrefs = Object.entries(userTasteProfile)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 5)
            .map(([k, v]) => `${k}(${v})`)
            .join('、');

        const nearbySeeds = (openWorldCandidates || [])
            .slice(0, 12)
            .map(c => `- ${c.name} [${c.tag || '地標'}] (${formatDistanceAndEta(c.distMeters, coordsInfo.mode)})`)
            .join('\n');

        const weatherLine = weatherData
            ? `現地氣溫 ${weatherData.temp ?? '?'}°C（體感 ${weatherData.feelsLike ?? '?'}°C）、風速 ${weatherData.windKmh ?? '?'} km/h、日落 ${weatherData.sunset || '--:--'}`
            : '現地氣象未提供';

        const userPrompt = [
            `【目的地國家／城市動態畫像（自動學習累積）】`,
            countryContextBlock,
            ``,
            `【當前微時刻情境】`,
            `- 目前所在／檢視節點：${ctx.title}（${ctx.kicker || ''}）`,
            `- 區域與座標：${coordsInfo.label}（${coordsInfo.lat}, ${coordsInfo.lon}），移動模式：${coordsInfo.mode === 'bike' ? '單車騎行' : '步行／大眾運輸'}`,
            `- 現地氣象：${weatherLine}`,
            `- 使用者意圖篩選：${recIntentFilter}`,
            `- 探索模式：${recNovelOnly ? '只看行程外的全新發現（第 ' + (recBatchIndex + 1) + ' 批探索）' : '可包含經典必訪與新發現'}`,
            `- 跨旅程全域偏好權重：${topPrefs}`,
            ``,
            `【嚴格排除清單（不可重複推薦）】`,
            excludedList.join('、') || '無',
            ``,
            `【周邊開放圖資參考候選（可從中嚴選最契合者，並可結合 Google 搜尋補充周邊更優質的隱藏名店）】`,
            nearbySeeds || '（請直接依座標與城市透過 Google 搜尋發掘周邊真實地點）'
        ].join('\n');

        const sysPrompt = cfg.customPrompt || DEFAULT_GEMINI_SYSTEM_PROMPT;
        const t0 = performance.now();

        let rawReply = null;
        let usedModel = primaryModel;

        try {
            rawReply = await callGeminiGenerateSingle(cfg.apiKey, primaryModel, sysPrompt, userPrompt, true, true);
        } catch (e1) {
            try {
                rawReply = await callGeminiGenerateSingle(cfg.apiKey, primaryModel, sysPrompt, userPrompt, false, false);
            } catch (e2) {
                usedModel = fallbackModel;
                rawReply = await callGeminiGenerateSingle(cfg.apiKey, fallbackModel, sysPrompt, userPrompt, false, false);
            }
        }

        const elapsedSec = ((performance.now() - t0) / 1000).toFixed(1);
        const extracted = extractGeminiCollaborativePayload(rawReply.textOut);

        // 自動吸收 Gemini 這次學到的目的地國家文化與實用特點
        if (extracted.learnedTraits && extracted.learnedTraits.length) {
            absorbGeminiCountryTraits(countryInfo.key, extracted.countryName || countryInfo.name, extracted.learnedTraits);
        }

        const mappedItems = (extracted.items || []).slice(0, 4).map((obj, i) => {
            const name = String(obj.name || '').trim();
            const catBadge = mapCategoryStringToBadge(obj.category, name);
            const mapQ = String(obj.map_query || `${name} ${coordsInfo.city || countryInfo.name || ''}`).trim();
            const scoreNum = Math.min(99, Math.max(72, parseInt(obj.match_score, 10) || (94 - i * 3)));
            return {
                source: `Gemini (${shortModelDisplayName(usedModel)})`,
                isOpenWorld: true,
                isAiCurated: true,
                name,
                lat: coordsInfo.lat,
                lon: coordsInfo.lon,
                distMeters: 0,
                customEtaLabel: String(obj.est_time || '').trim(),
                catBadge,
                tag: catBadge.label,
                keyPointText: String(obj.key_point || '').trim() || catBadge.label,
                whyText: obj.why ? `✨ AI 協作洞察：${String(obj.why).trim()}` : '',
                pct: scoreNum,
                mapUrl: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapQ)}`,
                rawText: `${name} ${obj.category || ''} ${obj.key_point || ''} ${obj.why || ''}`
            };
        }).filter(item => item.name);

        if (!mappedItems.length) throw new Error('Gemini 回傳空推薦清單');

        mappedItems.forEach(m => shownDiscoveryHistory.add(m.name.toLowerCase().trim()));
        geminiRuntimeStatus = {
            state: 'ready',
            modelUsed: usedModel,
            latencySec: elapsedSec,
            errorMsg: '',
            grounded: rawReply.hasGrounding
        };

        geminiRespCache[cacheKey] = {
            ts: Date.now(),
            modelUsed: usedModel,
            latencySec: elapsedSec,
            grounded: rawReply.hasGrounding,
            items: mappedItems
        };
        try { localStorage.setItem(GEMINI_RESP_CACHE_KEY, JSON.stringify(geminiRespCache)); } catch (e) {}

        return mappedItems;
    }

        if (countryKey) {
            delete countryTraitsStore[countryKey];
            showNativeToast('✓ 已重置該目的地的學習特徵');
        } else {
            countryTraitsStore = {};
            showNativeToast('✓ 已清除所有國家學習記憶');
        }
        saveCountryTraitsStore();
        syncTripCountryDNA();
        openGeminiSettingsSheet();
    }

                            <div style="font-weight:800; color:var(--text-primary); font-family:'JetBrains Mono',monospace;">${m.id}</div>

                    </div>`;
            }).join('')
            : `<div style="font-size:0.74rem; color:var(--text-muted);">貼上 API Key 並點擊「儲存並自動偵測適中模型」，系統會自動向 Google 取得最新可用模型並鎖定速度與品質最平衡的版本。</div>`;

        body.innerHTML = `
            <div class="sheet-kicker">✨ GLOBAL CONTEXT & AI COLLABORATION</div>
            <h3 class="sheet-title">Gemini 全球協作與國家特徵學習</h3>

            <div class="live-status-strip" style="border-left-color:#a78bfa;">
                🔒 <strong>隱私安全機制</strong>：API Key 與國家學習記憶僅存於此手機 <code>localStorage</code>，絕不上傳第三方伺服器。
            </div>

            <div class="gemini-cfg-box">
                <div class="gemini-cfg-label">
                    <span>🌍 目前識別目的地：${curBucket.name}</span>
                    <button type="button" class="rec-pill" onclick="clearLearnedCountryTraits('${escapeJsQuote(curCountry.key)}')">重設此國學習</button>
                </div>
                <div style="font-size:0.71rem; color:var(--text-secondary); line-height:1.45;">
                    系統會自動從行程 JSON、點擊收藏行為與 Gemini 搜尋結果中，持續累積該國家的餐飲作息、交通節奏與文化特點：
                </div>
                ${learnedHtml}
            </div>

            <div class="gemini-cfg-box">
                <div class="gemini-cfg-label">
                    <span>🔑 Gemini API Key</span>
                    <span style="font-family:'JetBrains Mono',monospace; font-size:0.66rem; color:var(--emerald);">${maskApiKey(cfg.apiKey)}</span>
                </div>
                <input type="password" id="gemini-key-input" class="gemini-cfg-input" placeholder="貼上 AIzaSy 開頭的 Gemini API Key..." value="${cfg.apiKey}">
                <div style="display:grid; grid-template-columns: 1fr auto; gap:6px; margin-top:8px;">
                    <button type="button" class="sheet-tool-btn primary" style="justify-content:center; border-radius:10px; padding:9px;" onclick="saveAndTestGeminiKey()">⚡ 儲存並自動偵測適中模型</button>

                </div>
                <textarea id="gemini-prompt-textarea" class="gemini-cfg-textarea">${cfg.customPrompt || DEFAULT_GEMINI_SYSTEM_PROMPT}</textarea>
                <button type="button" class="sheet-tool-btn" style="width:100%; justify-content:center; margin-top:7px; border-radius:10px;" onclick="saveCustomGeminiPrompt()">💾 儲存 Prompt 設定</button>
            </div>
        `;

        backdrop.classList.add('open');
        sheet.classList.add('open');
    }

    async function saveAndTestGeminiKey() {
        const inp = document.getElementById('gemini-key-input');
        const statusEl = document.getElementById('gemini-test-status');
        const key = (inp && inp.value || '').trim();
        if (!key) {
            showNativeToast('請先輸入 Gemini API Key');
            return;
        }
        if (statusEl) statusEl.innerText = '🔄 正在連線 Google API 偵測最新可用模型與延遲測試...';
        try {
            const updated = await refreshGeminiModelList(key, true);
            if (statusEl) {
                statusEl.style.color = 'var(--emerald)';
                statusEl.innerText = `✅ 連線成功！已自動選用適中模型：${updated.selectedModel}（備援：${updated.fallbackModel}）`;
            }
            renderLogistics((globalData && globalData.logistics) || { items: [], alerts: [] });
            setTimeout(() => openGeminiSettingsSheet(), 450);
        } catch (err) {
            if (statusEl) {
                statusEl.style.color = 'var(--danger)';
                statusEl.innerText = `❌ ${err.message || '連線失敗，請確認 Key 是否正確'}`;
            }
        }
    }

    function clearGeminiKey() {
        if (!confirm('確定要從此手機瀏覽器清除 Gemini API Key 嗎？')) return;
        const cfg = getGeminiConfig();
        cfg.apiKey = '';
        cfg.detectedModels = [];
        cfg.selectedModel = '';
        saveGeminiConfig(cfg);
        lastGeminiRecs = [];
        showNativeToast('已清除本機 Gemini API Key');
        renderLogistics((globalData && globalData.logistics) || { items: [], alerts: [] });
        openGeminiSettingsSheet();
    }

    function setGeminiAutoMode() {
        const cfg = getGeminiConfig();
        cfg.mode = 'auto';
        saveGeminiConfig(cfg);
        showNativeToast('✓ 已切換為「自動適中模型」路由');
        openGeminiSettingsSheet();
    }

    function selectManualGeminiModel(modelId) {
        const cfg = getGeminiConfig();
        cfg.mode = 'manual';
        cfg.manualModel = modelId;
        saveGeminiConfig(cfg);
        showNativeToast(`✓ 已手動指定模型：${shortModelDisplayName(modelId)}`);
        openGeminiSettingsSheet();
    }

    function saveCustomGeminiPrompt() {
        const ta = document.getElementById('gemini-prompt-textarea');
        if (!ta) return;
        const cfg = getGeminiConfig();
        const txt = ta.value.trim();
        cfg.customPrompt = (txt && txt !== DEFAULT_GEMINI_SYSTEM_PROMPT.trim()) ? txt : '';
        saveGeminiConfig(cfg);
        geminiRespCache = {};
        try { localStorage.removeItem(GEMINI_RESP_CACHE_KEY); } catch (e) {}
        showNativeToast('✓ 已儲存自訂 Prompt（下次查詢立即生效）');
    }

    function resetGeminiPromptDefault() {
        const ta = document.getElementById('gemini-prompt-textarea');
        if (ta) ta.value = DEFAULT_GEMINI_SYSTEM_PROMPT;
        const cfg = getGeminiConfig();
        cfg.customPrompt = '';
        saveGeminiConfig(cfg);
        showNativeToast('已還原泛化預設 Prompt');
    }

    initPwaAppExperience();
    window.addEventListener('DOMContentLoaded', initNativeGestures);
