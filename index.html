<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0d10">
    <title>環球慢活隨身旅圖</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="secure_data.js"></script>

    <style>
        :root,
        :root[data-theme="dark"] {
            --bg-app: #0b0d10;
            --bg-elevated: rgba(22, 26, 33, 0.86);
            --bg-card: #141820;
            --bg-card-alt: #1b202b;
            --bg-pill: #1f2532;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);
            --text-primary: #f3f5f8;
            --text-secondary: #a4aebd;
            --text-muted: #6f7988;
            --accent: #f59e0b;
            --accent-soft: rgba(245, 158, 11, 0.16);
            --accent-secondary: #38bdf8;
            --accent-secondary-soft: rgba(56, 189, 248, 0.14);
            --success: #34d399;
            --danger: #f87171;
            --danger-soft: rgba(248, 113, 113, 0.14);
            --cta-bg: #f3f5f8;
            --cta-text: #0b0d10;
            --shadow-card: 0 10px 28px rgba(0, 0, 0, 0.35);
            --shadow-bar: 0 12px 32px rgba(0, 0, 0, 0.55);
        }

        :root[data-theme="paper"] {
            --bg-app: #fdfbf7;
            --bg-elevated: rgba(253, 251, 247, 0.92);
            --bg-card: #ffffff;
            --bg-card-alt: #f5f0e6;
            --bg-pill: #f1ede4;
            --border-subtle: #e6dfd3;
            --border-strong: #d5cbb9;
            --text-primary: #2c251e;
            --text-secondary: #5c4d3c;
            --text-muted: #8c7e6b;
            --accent: #b15b2c;
            --accent-soft: rgba(177, 91, 44, 0.13);
            --accent-secondary: #3f6246;
            --accent-secondary-soft: rgba(63, 98, 70, 0.14);
            --success: #2f7a57;
            --danger: #b83b2b;
            --danger-soft: rgba(184, 59, 43, 0.12);
            --cta-bg: #5c4d3c;
            --cta-text: #ffffff;
            --shadow-card: 0 6px 20px rgba(92, 77, 60, 0.06);
            --shadow-bar: 0 10px 28px rgba(44, 37, 30, 0.12);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg-app);
            color: var(--text-primary);
            font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', 'Inter', sans-serif;
            line-height: 1.55;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        .app-shell {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            margin: 0 auto;
            background: var(--bg-app);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 頂部精簡導覽列 */
        .app-topbar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
            background: var(--bg-elevated);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 120;
        }

        .topbar-left {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar-kicker {
            font-size: 0.66rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 1.4px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-heading {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.12rem;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-pill-btn {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-size: 0.76rem;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.12s ease, border-color 0.15s ease;
        }

        .icon-pill-btn:active {
            transform: scale(0.94);
            border-color: var(--accent);
        }

        /* 主捲動畫布 */
        .app-canvas {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            padding: 14px 16px calc(92px + env(safe-area-inset-bottom));
        }

        .app-canvas::-webkit-scrollbar { display: none; }
        .app-canvas { scrollbar-width: none; }

        .view {
            display: none;
            animation: viewEnter 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .view.active {
            display: block;
        }

        @keyframes viewEnter {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 懸浮底部導覽列 */
        .bottom-tabbar {
            position: fixed;
            left: 50%;
            bottom: calc(10px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 456px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            background: var(--bg-elevated);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--border-strong);
            border-radius: 22px;
            padding: 6px 4px;
            z-index: 150;
            box-shadow: var(--shadow-bar);
        }

        .b-tab {
            border: none;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 4px 2px;
            color: var(--text-muted);
            cursor: pointer;
            transition: transform 0.12s ease, color 0.16s ease;
        }

        .b-tab:active { transform: scale(0.92); }

        .b-tab-icon {
            width: 36px;
            height: 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .b-tab-icon svg {
            width: 19px;
            height: 19px;
            stroke-width: 2;
        }

        .b-tab-label {
            font-size: 0.68rem;
            font-weight: 700;
        }

        .b-tab.active {
            color: var(--accent);
        }

        .b-tab.active .b-tab-icon {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .b-tab.active .b-tab-label {
            font-weight: 900;
        }

        /* 分段控制器 */
        .segmented-bar {
            display: flex;
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 14px;
            position: sticky;
            top: 0;
            z-index: 40;
            backdrop-filter: blur(14px);
        }

        .seg-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 8px 6px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.16s ease;
            white-space: nowrap;
        }

        .seg-btn.active {
            background: var(--bg-card);
            color: var(--text-primary);
            font-weight: 900;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
        }

        .sub-pane { display: none; animation: viewEnter 0.18s ease; }
        .sub-pane.active { display: block; }

        /* 看板 Hero 與 Bento 雙卡 */
        .hero-banner {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            top: -40px;
            right: -40px;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 8px;
        }

        .hero-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.42rem;
            font-weight: 900;
            line-height: 1.3;
            margin: 0 0 12px;
            color: var(--text-primary);
        }

        .countdown-box {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .countdown-num {
            font-family: 'Inter', sans-serif;
            font-size: 1.65rem;
            font-weight: 900;
            color: var(--accent);
            line-height: 1.1;
        }

        .bento-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .bento-tile {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 13px 14px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: transform 0.12s ease, border-color 0.15s ease;
            text-align: left;
        }

        .bento-tile:active {
            transform: scale(0.97);
            border-color: var(--accent);
        }

        .bento-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .bento-val {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .bento-sub {
            font-size: 0.74rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .cta-btn {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 12px 16px;
            background: var(--cta-bg);
            color: var(--cta-text);
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.12s ease, opacity 0.15s ease;
        }

        .cta-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .panel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 15px 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .panel-title {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .panel-link {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
        }

        /* 吸頂日曆膠囊 */
        .day-strip {
            position: sticky;
            top: 0;
            z-index: 35;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 2px 10px;
            margin-bottom: 6px;
            background: var(--bg-app);
            scrollbar-width: none;
        }

        .day-strip::-webkit-scrollbar { display: none; }

        .day-pill {
            flex: 0 0 auto;
            min-width: 64px;
            padding: 7px 11px;
            border-radius: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            text-align: center;
            cursor: pointer;
            transition: all 0.16s ease;
        }

        .day-pill:active { transform: scale(0.95); }

        .day-pill.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .dp-day {
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 900;
            display: block;
        }

        .dp-date {
            font-size: 0.66rem;
            opacity: 0.85;
            display: block;
        }

        /* 每日行程手風琴卡片 */
        .day-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            margin-bottom: 14px;
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }

        .day-card-header {
            padding: 15px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
        }

        .day-card-header:active {
            background: var(--bg-card-alt);
        }

        .day-kicker {
            font-family: 'Inter', sans-serif;
            font-size: 0.74rem;
            font-weight: 800;
            color: var(--accent);
            display: block;
            margin-bottom: 3px;
        }

        .day-card-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.12rem;
            font-weight: 800;
            margin: 0;
            color: var(--text-primary);
        }

        .day-card-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .chevron-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-card-alt);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            flex-shrink: 0;
            transition: transform 0.22s ease;
        }

        .day-card.open .chevron-badge {
            transform: rotate(180deg);
            background: var(--accent-soft);
            color: var(--accent);
        }

        .day-card-body {
            display: none;
            padding: 0 16px 16px;
            border-top: 1px solid var(--border-subtle);
        }

        .day-card.open .day-card-body {
            display: block;
            padding-top: 14px;
            animation: viewEnter 0.2s ease;
        }

        .callout-box {
            border-radius: 12px;
            padding: 11px 13px;
            font-size: 0.84rem;
            margin-bottom: 12px;
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }

        .callout-alert {
            background: var(--danger-soft);
            border-color: rgba(248, 113, 113, 0.28);
            color: var(--text-primary);
        }

        .callout-story {
            font-family: 'Noto Serif TC', serif;
            border-left: 3px solid var(--accent);
            line-height: 1.7;
        }

        /* 時間軸節點 */
        .timeline-item {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .timeline-item:last-child { margin-bottom: 0; }

        .timeline-axis {
            width: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .timeline-node {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: 12px;
            box-shadow: 0 0 0 4px var(--accent-soft);
            z-index: 2;
        }

        .timeline-node.kind-food { background: var(--accent); }
        .timeline-node.kind-move { background: var(--accent-secondary); box-shadow: 0 0 0 4px var(--accent-secondary-soft); }
        .timeline-node.kind-stay { background: var(--success); }

        .timeline-stem {
            width: 2px;
            flex: 1;
            background: var(--border-subtle);
            position: absolute;
            top: 21px;
            bottom: -12px;
        }

        .timeline-item:last-child .timeline-stem { display: none; }

        .slot-card {
            flex: 1;
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 11px 13px;
        }

        .slot-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .slot-time {
            font-family: 'Inter', sans-serif;
            font-size: 0.84rem;
            font-weight: 800;
            color: var(--accent);
        }

        .slot-title {
            font-size: 0.96rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .slot-desc {
            font-size: 0.84rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .pill-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
        }

        .mini-pill {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }

        .mini-pill.accent {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: transparent;
        }

        .mini-pill.sky {
            background: var(--accent-secondary-soft);
            color: var(--accent-secondary);
            border-color: transparent;
        }

        .map-chip {
            text-decoration: none;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-primary);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 3px 9px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .map-chip:active {
            border-color: var(--accent);
        }

        .hotel-strip {
            margin-top: 12px;
            padding: 11px 13px;
            border-radius: 13px;
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* 登機證與飯店卡片 */
        .boarding-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
        }

        .boarding-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--border-strong);
        }

        .flight-code {
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 900;
            padding: 3px 9px;
            border-radius: 8px;
            background: var(--accent-soft);
            color: var(--accent);
        }

        .boarding-route {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .boarding-meta {
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .hotel-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .hotel-item:last-child { border-bottom: none; padding-bottom: 0; }

        /* 探索與工具元件 */
        .filter-row {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 6px;
            scrollbar-width: none;
        }

        .filter-row::-webkit-scrollbar { display: none; }

        .filter-chip {
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-chip.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .poi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 14px 15px;
            margin-bottom: 11px;
            box-shadow: var(--shadow-card);
        }

        .poi-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .poi-name {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .input-control, .select-control {
            background: var(--bg-card-alt);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 11px;
            padding: 10px 12px;
            font-size: 0.94rem;
            font-weight: 700;
        }

        .input-control:focus, .select-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        .quick-add-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0 12px;
        }

        .step-btn {
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-alt);
            color: var(--text-primary);
            font-size: 0.76rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .step-btn:active { border-color: var(--accent); }

        .fx-result-box {
            background: var(--bg-card-alt);
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .fx-amount {
            font-family: 'Inter', sans-serif;
            font-size: 1.38rem;
            font-weight: 900;
            color: var(--accent);
        }

        .budget-line {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed var(--border-subtle);
            font-size: 0.86rem;
        }

        .budget-line:last-child { border-bottom: none; }

        .progress-track {
            height: 8px;
            border-radius: 999px;
            background: var(--bg-card-alt);
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.28s ease;
        }

        .check-row {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .check-box {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.78rem;
            font-weight: 900;
        }

        .check-row.checked .check-box {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .check-row.checked .check-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* 密碼鎖 */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-app);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .pin-dots {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
        }

        .pin-dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            transition: all 0.15s ease;
        }

        .pin-dot.filled {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.1);
        }

        .pin-dot.error {
            background: var(--danger);
            border-color: var(--danger);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 270px;
        }

        .key-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .key-btn:active {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(0.93);
        }

        .key-btn.empty, .key-btn.del {
            background: transparent;
            border-color: transparent;
            color: var(--text-secondary);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .shake { animation: shake 0.35s ease; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div style="font-size: 2rem; margin-bottom: 10px;">🔐</div>
    <div style="font-family: 'Noto Serif TC', serif; font-size: 1.25rem; font-weight: 900; margin-bottom: 4px;">輸入 6 位數通行碼</div>
    <div id="auth-msg" style="font-size: 0.84rem; color: var(--text-secondary); margin-bottom: 24px; min-height: 20px;">行程資料已加密保護</div>

    <div class="pin-dots" id="pin-dots">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    </div>

    <div class="keypad">
        <div class="key-btn" onclick="pressKey('1')">1</div><div class="key-btn" onclick="pressKey('2')">2</div><div class="key-btn" onclick="pressKey('3')">3</div>
        <div class="key-btn" onclick="pressKey('4')">4</div><div class="key-btn" onclick="pressKey('5')">5</div><div class="key-btn" onclick="pressKey('6')">6</div>
        <div class="key-btn" onclick="pressKey('7')">7</div><div class="key-btn" onclick="pressKey('8')">8</div><div class="key-btn" onclick="pressKey('9')">9</div>
        <div class="key-btn empty"></div><div class="key-btn" onclick="pressKey('0')">0</div><div class="key-btn del" onclick="pressKey('del')">⌫</div>
    </div>
</div>

<div class="app-shell">
    <header class="app-topbar">
        <div class="topbar-left">
            <span id="meta-sub" class="topbar-kicker">TRAVEL COMPANION</span>
            <span id="topbar-title" class="topbar-heading">旅程看板</span>
        </div>
        <div class="topbar-actions">
            <button id="theme-toggle-btn" class="icon-pill-btn" onclick="toggleTheme()" title="切換深色/米色主題">🌓 米色</button>
            <button id="topbar-action-btn" class="icon-pill-btn" onclick="handleTopAction()">🔒 鎖定</button>
        </div>
    </header>

    <main class="app-canvas" id="app-canvas">
        <!-- 1. 看板 -->
        <div id="dashboard" class="view active"></div>

        <!-- 2. 行程 -->
        <div id="itinerary" class="view"></div>

        <!-- 3. 票宿 -->
        <div id="flights" class="view"></div>

        <!-- 4. 探索 -->
        <div id="explore" class="view">
            <div class="segmented-bar">
                <button class="seg-btn active" id="seg-theme" onclick="switchSubPane('explore', 'theme')">✨ 主題絕景</button>
                <button class="seg-btn" id="seg-poi" onclick="switchSubPane('explore', 'poi')">☕ 美食與咖啡</button>
            </div>
            <div id="theme" class="sub-pane active"></div>
            <div id="poi" class="sub-pane">
                <div class="filter-row" id="poi-cat-filters"></div>
                <div class="filter-row" id="poi-area-filters"></div>
                <div id="poi-list"></div>
            </div>
        </div>

        <!-- 5. 工具 -->
        <div id="tools" class="view">
            <div class="segmented-bar">
                <button class="seg-btn active" id="seg-money" onclick="switchSubPane('tools', 'money')">💱 匯率</button>
                <button class="seg-btn" id="seg-checklist" onclick="switchSubPane('tools', 'checklist')">✅ 行李</button>
                <button class="seg-btn" id="seg-logistics" onclick="switchSubPane('tools', 'logistics')">☀️ 筆記</button>
                <button class="seg-btn" id="seg-emergency" onclick="switchSubPane('tools', 'emergency')">🛡️ 應變</button>
            </div>

            <div id="money" class="sub-pane active">
                <div class="panel-card">
                    <div class="panel-head">
                        <span class="panel-title">💱 即時匯率換算</span>
                        <span id="rate-status" class="tabular-nums" style="font-size: 0.72rem; color: var(--text-muted); font-weight: 700;">連線中...</span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <select id="currency-selector" class="select-control" style="flex: 1;">
                            <option value="jpy">🇯🇵 JPY</option>
                            <option value="thb">🇹🇭 THB</option>
                            <option value="eur">🇪🇺 EUR</option>
                            <option value="gbp">🇬🇧 GBP</option>
                            <option value="usd">🇺🇸 USD</option>
                            <option value="isk">🇮🇸 ISK</option>
                            <option value="idr">🇮🇩 IDR</option>
                            <option value="myr">🇲🇾 MYR</option>
                            <option value="sgd">🇸🇬 SGD</option>
                        </select>
                        <input type="number" inputmode="decimal" id="foreign-amount" class="input-control tabular-nums" placeholder="輸入外幣金額" style="flex: 2;">
                    </div>
                    <div class="quick-add-row">
                        <button type="button" class="step-btn tabular-nums" onclick="addAmount(100)">+100</button>
                        <button type="button" class="step-btn tabular-nums" onclick="addAmount(500)">+500</button>
                        <button type="button" class="step-btn tabular-nums" onclick="addAmount(1000)">+1,000</button>
                        <button type="button" class="step-btn tabular-nums" onclick="addAmount(5000)">+5,000</button>
                        <button type="button" class="step-btn" onclick="clearAmount()" style="color: var(--danger);">清除</button>
                    </div>
                    <div class="fx-result-box">
                        <span style="font-size: 0.84rem; font-weight: 700; color: var(--text-secondary);">約合台幣 TWD</span>
                        <span class="fx-amount tabular-nums">NT$ <span id="twd-result">0</span></span>
                    </div>
                </div>
                <div id="budget-render"></div>
            </div>

            <div id="checklist" class="sub-pane">
                <div class="panel-card">
                    <div class="panel-head" style="margin-bottom: 8px;">
                        <span class="panel-title">行前準備進度</span>
                        <span id="chk-label" class="tabular-nums" style="font-size: 0.86rem; font-weight: 900; color: var(--accent);">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar-fill" id="chk-fill"></div>
                    </div>
                </div>
                <div id="chk-list"></div>
            </div>

            <div id="logistics" class="sub-pane"></div>
            <div id="emergency" class="sub-pane"></div>
        </div>
    </main>

    <nav class="bottom-tabbar">
        <button class="b-tab active" data-tab="dashboard" onclick="switchTab('dashboard')">
            <div class="b-tab-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
            </div>
            <span class="b-tab-label">看板</span>
        </button>
        <button class="b-tab" data-tab="itinerary" onclick="switchTab('itinerary')">
            <div class="b-tab-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <span class="b-tab-label">行程</span>
        </button>
        <button class="b-tab" data-tab="flights" onclick="switchTab('flights')">
            <div class="b-tab-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
            </div>
            <span class="b-tab-label">票宿</span>
        </button>
        <button class="b-tab" data-tab="explore" onclick="switchTab('explore')">
            <div class="b-tab-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <span class="b-tab-label">探索</span>
        </button>
        <button class="b-tab" data-tab="tools" onclick="switchTab('tools')">
            <div class="b-tab-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
            </div>
            <span class="b-tab-label">工具</span>
        </button>
    </nav>
</div>

<script>
    /* ================= 主題切換 ================= */
    function applySavedTheme() {
        const saved = localStorage.getItem('trip_ui_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        updateThemeBtnText(saved);
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'paper' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('trip_ui_theme', next);
        updateThemeBtnText(next);
    }

    function updateThemeBtnText(theme) {
        const btn = document.getElementById('theme-toggle-btn');
        if (!btn) return;
        btn.innerText = theme === 'dark' ? '☀️ 米色' : '🌙 暗黑';
    }

    applySavedTheme();

    /* ================= 全域狀態 ================= */
    let globalData = null;
    let tripDiffDays = 0;
    let poiAreaFilter = '全部地區';
    let poiCategoryFilter = '全部';
    const offlineRates = { isk: 0.235, eur: 34.80, gbp: 40.50, jpy: 0.21, usd: 32.50, thb: 0.90, idr: 0.002, myr: 6.80, sgd: 23.80 };
    let currentRate = 0;
    let currentMainTab = 'dashboard';
    let allDaysExpanded = false;

    const TAB_TITLES = {
        dashboard: '旅程看板',
        itinerary: '每日行程',
        flights: '航班與住宿',
        explore: '探索絕景與美食',
        tools: '隨身工具箱'
    };

    const SUB_TO_PARENT = {
        theme: 'explore',
        poi: 'explore',
        money: 'tools',
        checklist: 'tools',
        logistics: 'tools',
        emergency: 'tools'
    };

    /* ================= PIN 鎖屏 ================= */
    let currentPin = '';
    const MAX_ATTEMPTS = 5;
    const LOCK_MINUTES = 3;
    let isLockedOut = false;
    let lockTimer = null;

    function lockApp() {
        currentPin = '';
        updateDots();
        const msg = document.getElementById('auth-msg');
        msg.style.color = 'var(--text-secondary)';
        msg.innerText = '已重新鎖定行程';
        document.getElementById('lock-screen').style.display = 'flex';
    }

    function checkLockStatus() {
        const lockUntil = localStorage.getItem('trip_lockout_time');
        if (lockUntil && Date.now() < parseInt(lockUntil, 10)) {
            startLockdown(parseInt(lockUntil, 10));
        } else if (lockUntil) {
            localStorage.removeItem('trip_lockout_time');
            localStorage.removeItem('trip_failed_attempts');
        }
    }

    function startLockdown(endTime) {
        isLockedOut = true;
        currentPin = '';
        updateDots();
        const msg = document.getElementById('auth-msg');
        msg.style.color = 'var(--danger)';

        lockTimer = setInterval(() => {
            const remaining = Math.ceil((endTime - Date.now()) / 1000);
            if (remaining <= 0) {
                clearInterval(lockTimer);
                isLockedOut = false;
                localStorage.removeItem('trip_lockout_time');
                localStorage.removeItem('trip_failed_attempts');
                msg.style.color = 'var(--text-secondary)';
                msg.innerText = '系統已解鎖，請輸入通行碼';
            } else {
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                msg.innerText = `錯誤次數過多，請等待 ${m}分 ${s}秒`;
            }
        }, 1000);
    }

    function pressKey(val) {
        if (isLockedOut) {
            triggerShake();
            return;
        }
        if (navigator.vibrate) navigator.vibrate(25);
        const msg = document.getElementById('auth-msg');
        msg.style.color = 'var(--text-secondary)';
        msg.innerText = '行程資料已加密保護';

        if (val === 'del') {
            currentPin = currentPin.slice(0, -1);
        } else if (currentPin.length < 6) {
            currentPin += val;
        }
        updateDots();
        if (currentPin.length === 6) setTimeout(verifyPin, 90);
    }

    document.addEventListener('keydown', (e) => {
        const lockEl = document.getElementById('lock-screen');
        if (!lockEl || lockEl.style.display === 'none') return;
        if (e.key >= '0' && e.key <= '9') pressKey(e.key);
        else if (e.key === 'Backspace') pressKey('del');
    });

    function updateDots() {
        const dots = document.querySelectorAll('.pin-dot');
        dots.forEach((dot, i) => {
            dot.classList.remove('filled', 'error');
            if (i < currentPin.length) dot.classList.add('filled');
        });
    }

    function triggerShake() {
        const dotsContainer = document.getElementById('pin-dots');
        dotsContainer.classList.remove('shake');
        void dotsContainer.offsetWidth;
        dotsContainer.classList.add('shake');
        document.querySelectorAll('.pin-dot').forEach(d => {
            if (d.classList.contains('filled')) d.classList.add('error');
        });
    }

    function verifyPin() {
        const msg = document.getElementById('auth-msg');
        if (typeof encryptedTripData === 'undefined') {
            triggerShake();
            currentPin = '';
            updateDots();
            msg.style.color = 'var(--danger)';
            msg.innerText = '找不到 secure_data.js';
            return;
        }

        let failedAttempts = parseInt(localStorage.getItem('trip_failed_attempts') || '0', 10);
        try {
            const bytes = CryptoJS.AES.decrypt(encryptedTripData, currentPin);
            globalData = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
            if (!globalData || typeof globalData !== 'object') throw new Error('Invalid JSON');

            localStorage.removeItem('trip_failed_attempts');
            document.getElementById('lock-screen').style.display = 'none';
            bootSystem();
        } catch (e) {
            triggerShake();
            failedAttempts++;
            localStorage.setItem('trip_failed_attempts', failedAttempts);

            if (failedAttempts >= MAX_ATTEMPTS) {
                const unlockTime = Date.now() + (LOCK_MINUTES * 60 * 1000);
                localStorage.setItem('trip_lockout_time', unlockTime);
                startLockdown(unlockTime);
            } else {
                currentPin = '';
                updateDots();
                msg.style.color = 'var(--danger)';
                msg.innerText = `密碼錯誤，剩餘 ${MAX_ATTEMPTS - failedAttempts} 次機會`;
            }
        }
    }

    checkLockStatus();

    /* ================= 啟動與導航 ================= */
    function bootSystem() {
        const sub = (globalData.trip_meta && globalData.trip_meta.subtitle) || 'TRAVEL COMPANION';
        document.getElementById('meta-sub').innerText = sub;

        calculateDiff();
        fetchWeather();

        renderItinerary(globalData.itinerary || []);
        renderFlights(globalData.flights_and_hotels || { flights: [], hotels: [] });
        renderLogistics(globalData.logistics || { items: [], alerts: [] });
        renderBudget(globalData.budget || { regions: [] });
        renderTheme(globalData.theme_guide || []);
        initPOI(globalData.poi_database || []);
        renderChecklist(globalData.checklist_items || []);
        renderEmergency(globalData.emergency || { guides: [] });
        initCurrencyWidget((globalData.trip_meta && globalData.trip_meta.currency) || 'jpy');
        updateTopbarContext('dashboard');
    }

    function updateTopbarContext(tabId) {
        const heading = document.getElementById('topbar-title');
        const actionBtn = document.getElementById('topbar-action-btn');
        if (tabId === 'dashboard') {
            heading.innerText = (globalData && globalData.trip_meta && globalData.trip_meta.title) || '旅程看板';
        } else {
            heading.innerText = TAB_TITLES[tabId] || '隨身旅圖';
        }

        if (!actionBtn) return;
        if (tabId === 'itinerary') {
            actionBtn.innerText = allDaysExpanded ? '全部收合' : '全部展開';
        } else {
            actionBtn.innerText = '🔒 鎖定';
        }
    }

    function handleTopAction() {
        if (currentMainTab === 'itinerary') {
            allDaysExpanded = !allDaysExpanded;
            document.querySelectorAll('#itinerary .day-card').forEach(c => {
                c.classList.toggle('open', allDaysExpanded);
            });
            updateTopbarContext('itinerary');
        } else {
            lockApp();
        }
    }

    function switchTab(id) {
        if (SUB_TO_PARENT[id]) {
            const parent = SUB_TO_PARENT[id];
            switchTab(parent);
            switchSubPane(parent, id);
            return;
        }

        currentMainTab = id;
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.b-tab').forEach(b => b.classList.remove('active'));

        const targetView = document.getElementById(id);
        if (targetView) targetView.classList.add('active');

        const targetBtn = document.querySelector(`.b-tab[data-tab="${id}"]`);
        if (targetBtn) targetBtn.classList.add('active');

        updateTopbarContext(id);
        const canvas = document.getElementById('app-canvas');
        if (canvas) canvas.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchSubPane(parentId, paneId) {
        const parentEl = document.getElementById(parentId);
        if (!parentEl) return;
        parentEl.querySelectorAll('.sub-pane').forEach(p => p.classList.remove('active'));
        parentEl.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));

        const targetPane = document.getElementById(paneId);
        const targetSeg = document.getElementById(`seg-${paneId}`);
        if (targetPane) targetPane.classList.add('active');
        if (targetSeg) targetSeg.classList.add('active');
    }

    function jumpToDay(dayNum) {
        document.querySelectorAll('.day-pill').forEach(p => p.classList.remove('active'));
        const activePill = document.getElementById(`pill-day-${dayNum}`);
        if (activePill) activePill.classList.add('active');

        const card = document.getElementById(`day-${dayNum}`);
        if (card) {
            card.classList.add('open');
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    /* ================= 看板渲染 ================= */
    function calculateDiff() {
        if (!globalData.itinerary || globalData.itinerary.length === 0 || !globalData.itinerary[0].date_full) {
            document.getElementById('dashboard').innerHTML = '<div class="panel-card">尚未設定行程日期。</div>';
            return;
        }
        const start = new Date(globalData.itinerary[0].date_full);
        const today = new Date();
        start.setHours(0, 0, 0, 0);
        today.setHours(0, 0, 0, 0);
        tripDiffDays = Math.ceil((start - today) / (1000 * 60 * 60 * 24));
        renderDashboard();
    }

    function getChecklistPct() {
        const items = (globalData && globalData.checklist_items) || [];
        if (items.length === 0) return '0%';
        const validChecked = checkedItems.filter(i => items.includes(i)).length;
        return Math.round((validChecked / items.length) * 100) + '%';
    }

    /* ================= 天氣與交通圖示 ================= */
    function fetchWeather() {
        const todayStr = new Date().toISOString().split('T')[0];
        (globalData.itinerary || []).forEach(d => {
            if (!d.coords || !d.date_full) return;
            const parts = d.coords.split(',');
            if (parts.length < 2) return;
            const [lat, lon] = parts;
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`)
                .then(r => r.json())
                .then(data => {
                    if (!data.daily || !data.daily.time) return;
                    const idx = data.daily.time.indexOf(d.date_full);
                    if (idx === -1) return;
                    const code = data.daily.weathercode[idx];
                    const tMax = Math.round(data.daily.temperature_2m_max[idx]);
                    const tMin = Math.round(data.daily.temperature_2m_min[idx]);

                    let emoji = '☁️';
                    if (code === 0) emoji = '☀️';
                    else if (code >= 1 && code <= 3) emoji = '⛅';
                    else if (code >= 45 && code <= 48) emoji = '🌫️';
                    else if (code >= 51 && code <= 67) emoji = '🌧️';
                    else if (code >= 71 && code <= 82) emoji = '❄️';
                    else if (code >= 95) emoji = '⛈️';

                    const tempStr = `${emoji} ${tMin}°~${tMax}°C`;
                    const dayEl = document.getElementById(`weather-${d.day}`);
                    if (dayEl) dayEl.innerText = tempStr;

                    const dashEl = document.getElementById('dash-weather');
                    if (dashEl && (d.date_full === todayStr || tripDiffDays > 0 && d.day === globalData.itinerary[0].day)) {
                        dashEl.innerText = tempStr;
                    }
                })
                .catch(() => {});
        });
    }

    function getMoveIcon(t) {
        if (!t) return '🚗';
        const txt = t.toLowerCase();
        if (txt.includes('walk') || txt.includes('步行')) return '🚶';
        if (txt.includes('flight') || txt.includes('機')) return '✈️';
        if (txt.includes('ferry') || txt.includes('渡輪') || txt.includes('船')) return '⛴️';
        if (txt.includes('bus') || txt.includes('巴士') || txt.includes('專車')) return '🚌';
        if (txt.includes('jr') || txt.includes('train') || txt.includes('火車') || txt.includes('鐵') || txt.includes('線') || txt.includes('metro')) return '🚆';
        return '🚗';
    }

    function detectSlotKind(s) {
        const text = `${s.activity || ''} ${s.desc || ''} ${s.transport || ''}`.toLowerCase();
        if (text.includes('餐') || text.includes('食') || text.includes('咖啡') || text.includes('lunch') || text.includes('dinner') || text.includes('cafe')) return 'kind-food';
        if (text.includes('搭') || text.includes('移動') || text.includes('機場') || text.includes('站') || s.transport) return 'kind-move';
        if (text.includes('check-in') || text.includes('飯店') || text.includes('旅館') || text.includes('hotel')) return 'kind-stay';
        return 'kind-spot';
    }

        const cardsHtml = days.map((d, index) => {

                if (s.move > 0) pills.push(`<span class="mini-pill accent tabular-nums">移動 ${s.move}m</span>`);
                if (s.transport) {
                    const routeLabel = s.from && s.to ? `${s.from} ➔ ${s.to}` : s.transport;
                    pills.push(`<span class="mini-pill">${getMoveIcon(s.transport)} ${routeLabel}</span>`);

                        <div class="timeline-axis">

                        <div class="slot-card">

            const opHtml = (d.operational_modules || []).map(op => {

                `).join('');

                    <div class="callout-box" style="margin-top: 12px;">
                        <div style="font-size: 0.82rem; font-weight: 800; color: var(--accent); margin-bottom: 8px;">${op.title}</div>
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">${fields}</div>
                    </div>`;
            }).join('');

            const photoHtml = d.photo_notes ? `<div class="callout-box" style="margin-top: 10px;">📸 ${d.photo_notes.replace(/\n/g, '<br>')}</div>` : '';
            const hotelHtml = d.hotel ? `
                <div class="hotel-strip">
                    <span>🏨 ${d.hotel.name}</span>
                    ${d.hotel.map_url ? `<a href="${d.hotel.map_url}" target="_blank" rel="noopener" class="map-chip">📍 導航</a>` : ''}
                </div>` : '';

            return `
                <div class="day-card ${isOpen}" id="day-${d.day}">
                    <div class="day-card-header" onclick="toggleDayCard(${d.day})">

                            <h3 class="day-card-title">${d.title}</h3>

                        ${alertHtml}${planBHtml}${storyHtml}${schedHtml}${opHtml}${photoHtml}${hotelHtml}

        }).join('');

        document.getElementById('itinerary').innerHTML = stripHtml + cardsHtml;

    function classifyPoiTag(tagStr) {
        const t = (tagStr || '').toLowerCase();
        if (t.includes('咖') || t.includes('餐') || t.includes('食') || t.includes('酒') || t.includes('甜')) return '美食咖啡';
        if (t.includes('景') || t.includes('拍') || t.includes('山') || t.includes('寺') || t.includes('館')) return '景點絕景';
        if (t.includes('購') || t.includes('物') || t.includes('市')) return '購物市集';
        return '其他';
    }

        const alerts = (data && data.alerts) || [];
        const itemsHtml = items.map(item => `
            <div style="margin-bottom: 12px;">
                <div style="font-size: 0.9rem; font-weight: 800; color: var(--text-primary);">${item.icon || '☀️'} ${item.title || ''}</div>
                <div style="font-size: 0.84rem; color: var(--text-secondary); margin-top: 2px;">${item.desc || ''}</div>
            </div>
        `).join('');
        const alertsHtml = alerts.map(a => `
            <div class="callout-box" style="margin-bottom: 8px;"><strong>💡 ${a.title || ''}</strong><br>${a.desc || ''}</div>
        `).join('');

        document.getElementById('logistics').innerHTML = `
            <div class="panel-card">
                <div class="panel-head"><span class="panel-title">☀️ 氣候穿搭與行前筆記</span></div>
                ${itemsHtml || '<div style="font-size: 0.84rem; color: var(--text-muted);">尚無筆記資料</div>'}
                ${alertsHtml}
            </div>`;
    }

    function renderEmergency(data) {
        const guides = (data && data.guides) || [];
        const html = guides.map(g => {
            const bullets = (g.bullets || []).map(b => `<li style="margin-bottom: 4px;">${b}</li>`).join('');
            return `
                <div class="callout-box callout-alert" style="margin-bottom: 10px;">
                    <div style="font-size: 0.88rem; font-weight: 800; margin-bottom: 6px;">${g.icon || '🛡️'} ${g.title || ''}</div>
                    <ul style="margin: 0; padding-left: 18px; font-size: 0.84rem;">${bullets}</ul>
                </div>`;
        }).join('');

        document.getElementById('emergency').innerHTML = `
            <div class="panel-card">
                <div class="panel-head"><span class="panel-title">🛡️ 緊急應變與聯絡</span></div>
                ${html || '<div style="font-size: 0.84rem; color: var(--text-muted);">尚無應變資料</div>'}
            </div>`;
    }

    let checkedItems = JSON.parse(localStorage.getItem('tripChecklist_v9')) || [];

    function renderChecklist(items) {
        if (!items) return;
        document.getElementById('chk-list').innerHTML = items.map(i => {
            const isChecked = checkedItems.includes(i);
            const escaped = String(i).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            return `
                <div class="check-row ${isChecked ? 'checked' : ''}" onclick="toggleCheck('${escaped}')">
                    <div class="check-box">${isChecked ? '✓' : ''}</div>
                    <span class="check-text" style="font-size: 0.9rem; font-weight: 700;">${i}</span>
                </div>`;
        }).join('');

        const validCount = checkedItems.filter(i => items.includes(i)).length;
        const pct = items.length === 0 ? 0 : Math.round((validCount / items.length) * 100);
        document.getElementById('chk-fill').style.width = pct + '%';
        document.getElementById('chk-label').innerText = `${validCount}/${items.length} (${pct}%)`;
        const dashChk = document.getElementById('dash-chk-val');
        if (dashChk) dashChk.innerText = pct + '%';
    }

    function toggleCheck(item) {
        if (checkedItems.includes(item)) checkedItems = checkedItems.filter(i => i !== item);
        else checkedItems.push(item);
        localStorage.setItem('tripChecklist_v9', JSON.stringify(checkedItems));
        renderChecklist(globalData.checklist_items || []);
    }

    function initCurrencyWidget(defaultCur) {
        const sel = document.getElementById('currency-selector');
        const inp = document.getElementById('foreign-amount');
        if (defaultCur && offlineRates[defaultCur.toLowerCase()]) {
            sel.value = defaultCur.toLowerCase();
        }
        fetchRate(sel.value);
        sel.addEventListener('change', e => fetchRate(e.target.value));
        inp.addEventListener('input', calculateTWD);
    }

    function addAmount(delta) {
        const inp = document.getElementById('foreign-amount');
        inp.value = (parseFloat(inp.value) || 0) + delta;
        calculateTWD();
    }

    function clearAmount() {
        const inp = document.getElementById('foreign-amount');
        inp.value = '';
        calculateTWD();
    }

    function fetchRate(cur) {
        const box = document.getElementById('rate-status');
        box.innerText = '更新中...';
        fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${cur}.json`)
            .then(r => r.json())
            .then(data => {
                currentRate = data[cur].twd;
                box.innerText = `1 ${cur.toUpperCase()} ≈ ${currentRate.toFixed(currentRate < 1 ? 4 : 2)} TWD`;
                syncDashboardFxText(cur, currentRate);
                calculateTWD();
            })
            .catch(() => {
                currentRate = offlineRates[cur] || 0.21;
                box.innerText = `離線 1 ${cur.toUpperCase()} ≈ ${currentRate} TWD`;
                syncDashboardFxText(cur, currentRate);
                calculateTWD();
            });
    }

    function calculateTWD() {
        const amt = parseFloat(document.getElementById('foreign-amount').value) || 0;
        document.getElementById('twd-result').innerText = Math.round(amt * currentRate).toLocaleString();
    }
</script>
</body>
</html>
