<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="隨身旅圖">
    <meta name="theme-color" content="#090b0e" id="meta-theme-color">
    <title>環球慢活隨身旅圖</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="secure_data.js"></script>
    <style>

        :root,
        :root[data-theme="dark"] {
            --bg-app: #090b0e;
            --bg-elevated: rgba(15, 19, 26, 0.96);
            --bg-dock: #0e1219;
            --bg-card: #131720;
            --bg-card-alt: #1a202c;
            --bg-pill: #222938;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);
            --text-primary: #f4f6f9;
            --text-secondary: #a4aebd;
            --text-muted: #6c7787;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.25);
            --accent-soft: rgba(245, 158, 11, 0.15);
            --sky: #38bdf8;
            --sky-soft: rgba(56, 189, 248, 0.14);
            --emerald: #34d399;
            --emerald-soft: rgba(52, 211, 153, 0.14);
            --danger: #f87171;
            --danger-soft: rgba(248, 113, 113, 0.14);
            --cta-bg: #f4f6f9;
            --cta-text: #090b0e;
            --hero-grad: linear-gradient(145deg, #1b2230 0%, #11151e 58%, #1d1813 100%);
            --flight-grad: linear-gradient(155deg, #161d29 0%, #0f131b 100%);
            --shadow-card: 0 8px 22px rgba(0, 0, 0, 0.32);
            /* 固定常數：絕不透過 JS 覆寫累加，徹底根除點擊增肥 bug */
            --topbar-inner: 56px;
            --dock-inner: 56px;
            --topbar-total: calc(var(--topbar-inner) + env(safe-area-inset-top, 0px));
            --dock-total: calc(var(--dock-inner) + env(safe-area-inset-bottom, 0px));
        }

        :root[data-theme="paper"] {
            --bg-app: #f8f5ef;
            --bg-elevated: rgba(248, 245, 239, 0.97);
            --bg-dock: #ffffff;
            --bg-card: #ffffff;
            --bg-card-alt: #f2ece1;
            --bg-pill: #eae2d4;
            --border-subtle: #e5ddd0;
            --border-strong: #d3c7b4;
            --text-primary: #262019;
            --text-secondary: #5a4b3b;
            --text-muted: #8a7c69;
            --accent: #b15b2c;
            --accent-glow: rgba(177, 91, 44, 0.2);
            --accent-soft: rgba(177, 91, 44, 0.12);
            --sky: #0284c7;
            --sky-soft: rgba(2, 132, 199, 0.11);
            --emerald: #1f7a54;
            --emerald-soft: rgba(31, 122, 84, 0.12);
            --danger: #b83b2b;
            --danger-soft: rgba(184, 59, 43, 0.11);
            --cta-bg: #2e261e;
            --cta-text: #ffffff;
            --hero-grad: linear-gradient(145deg, #ffffff 0%, #f5efe4 100%);
            --flight-grad: linear-gradient(155deg, #ffffff 0%, #f4efe6 100%);
            --shadow-card: 0 6px 18px rgba(92, 77, 60, 0.06);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        button, a, .b-tab, .key-btn, .day-tab-btn, .seg-btn, .filter-chip, .check-row {
            touch-action: manipulation;
        }

        html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: var(--bg-app);
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Inter', sans-serif;
            line-height: 1.52;
            -webkit-font-smoothing: antialiased;
        }

        .tabular-nums { font-variant-numeric: tabular-nums; }
        .mono { font-family: 'JetBrains Mono', 'Inter', monospace; }

        .app-shell {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 auto;
            background-color: var(--bg-app);
            position: relative;
        }

        /* 固定頂部列：純 CSS Safe Area，固定總高度，絕不裁切標題 */
        .app-topbar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: var(--topbar-total);
            padding: env(safe-area-inset-top, 0px) 14px 0;
            background: var(--bg-elevated);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            z-index: 220;
        }

        .topbar-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            flex: 1;
        }

        .topbar-kicker {
            font-size: 0.62rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 1.1px;
            text-transform: uppercase;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-heading {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.04rem;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .icon-pill-btn {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
        }
        .icon-pill-btn:active { transform: scale(0.95); }

        /* 畫布頂部緊貼 Topbar（0px 縫隙），底部預留完整 Dock 高度 */
        .app-canvas {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            padding-top: var(--topbar-total);
            padding-left: 14px;
            padding-right: 14px;
            padding-bottom: calc(var(--dock-total) + 18px);
        }

        .view {
            display: none;
            width: 100%;
            max-width: 100%;
            animation: viewFade 0.16s ease;
        }
        .view.active { display: block; }

        /* 沒有內建吸頂列的分頁，自己加 12px 頂距 */
        #dashboard.view,
        #flights.view {
            padding-top: 12px;
        }

        @keyframes viewFade {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 底部滿版導覽列：貼齊最底與 Home Indicator，固定高度絕不增肥 */
        .bottom-dock {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: var(--dock-total);
            padding: 6px 4px env(safe-area-inset-bottom, 0px);
            background: var(--bg-dock);
            border-top: 1px solid var(--border-subtle);
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            align-items: center;
            z-index: 220;
        }

        .b-tab {
            border: none;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 2px 0;
            color: var(--text-muted);
            cursor: pointer;
            min-width: 0;
        }

        .b-tab-icon {
            width: 36px;
            height: 22px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.16s ease, color 0.16s ease;
        }

        .b-tab-icon svg { width: 18px; height: 18px; stroke-width: 2; }
        .b-tab-label { font-size: 0.65rem; font-weight: 700; white-space: nowrap; line-height: 1.15; }
        .b-tab.active { color: var(--accent); }
        .b-tab.active .b-tab-icon { background: var(--accent-soft); color: var(--accent); }
        .b-tab.active .b-tab-label { font-weight: 900; }

        /* 滿版不透明吸頂包裝器：讓分段列與日期列無縫焊死在 Topbar 下方，背後內容絕不透出 */
        .sticky-subbar-wrap {
            position: sticky;
            top: calc(var(--topbar-total) - 1px);
            z-index: 100;
            margin: 0 -14px 10px;
            padding: 8px 14px 9px;
            background: var(--bg-app);
            border-bottom: 1px solid var(--border-subtle);
        }

        .segmented-bar {
            display: flex;
            width: 100%;
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 3px;
            gap: 3px;
        }

        .seg-btn {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.74rem;
            font-weight: 700;
            padding: 7px 4px;
            border-radius: 9px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .seg-btn.active {
            background: var(--bg-card);
            color: var(--text-primary);
            font-weight: 900;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.16);
        }

        .sub-pane { display: none; width: 100%; }
        .sub-pane.active { display: block; animation: viewFade 0.16s ease; }

        /* Hero & Dashboard */
        .hero-banner {
            width: 100%;
            background: var(--hero-grad);
            border: 1px solid var(--border-strong);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 11px;
            box-shadow: var(--shadow-card);
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            max-width: 100%;
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 3px 9px;
            border-radius: 999px;
            margin-bottom: 7px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hero-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.2rem;
            font-weight: 900;
            line-height: 1.32;
            margin: 0 0 10px;
            color: var(--text-primary);
            overflow-wrap: anywhere;
        }

        .countdown-box {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .countdown-num {
            font-family: 'Inter', sans-serif;
            font-size: 1.42rem;
            font-weight: 900;
            color: var(--accent);
            line-height: 1.1;
        }

        .cta-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 11px 12px;
            background: var(--cta-bg);
            color: var(--cta-text);
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .cta-btn:active { transform: scale(0.98); }

        /* Flighty 風格航空卡片 */
        .flighty-card {
            width: 100%;
            background: var(--flight-grad);
            border: 1px solid var(--border-strong);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 11px;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }

        .flighty-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--sky), var(--accent));
        }

        .flighty-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 11px;
        }

        .flighty-badge-group {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .flighty-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-primary);
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            padding: 2px 7px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .flighty-status {
            font-size: 0.63rem;
            font-weight: 800;
            letter-spacing: 0.4px;
            padding: 3px 8px;
            border-radius: 999px;
            background: var(--sky-soft);
            color: var(--sky);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .flighty-airports {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 8px;
            margin-bottom: 11px;
        }

        .airport-col { min-width: 0; }
        .airport-col.right { text-align: right; }

        .iata-code {
            font-family: 'Inter', sans-serif;
            font-size: clamp(1.28rem, 5.2vw, 1.62rem);
            font-weight: 900;
            letter-spacing: -0.4px;
            line-height: 1.08;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .airport-city {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .flight-arc-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            min-width: 66px;
            flex-shrink: 0;
        }

        .flight-track {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--sky);
        }

        .flight-line {
            flex: 1;
            height: 2px;
            background: repeating-linear-gradient(90deg, var(--border-strong) 0, var(--border-strong) 3px, transparent 3px, transparent 6px);
        }
        .flight-line.solid { background: linear-gradient(90deg, var(--sky), var(--accent)); }

        .flight-duration-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .flighty-times {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 11px;
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            margin-bottom: 8px;
        }

        .time-block { display: flex; flex-direction: column; min-width: 0; }
        .time-block.right { text-align: right; }
        .time-label { font-size: 0.6rem; font-weight: 800; color: var(--text-muted); letter-spacing: 0.4px; }
        .time-val { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 800; color: var(--text-primary); }

        .flighty-footer {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .flighty-airline-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-top: -5px;
            margin-bottom: 9px;
            font-size: 0.68rem;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .flighty-airline-name {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .adsb-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            padding: 2px 6px;
            border-radius: 5px;
            background: rgba(16, 185, 129, 0.14);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.28);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .adsb-badge.loading {
            background: var(--sky-soft);
            color: var(--sky);
            border-color: rgba(56, 189, 248, 0.28);
        }

        .airport-icao {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.61rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .airport-fullname {
            font-size: 0.62rem;
            color: var(--text-muted);
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .adsb-sync-btn {
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-alt);
            color: var(--sky);
            font-size: 0.68rem;
            font-weight: 800;
            padding: 4px 9px;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .adsb-sync-btn:active { transform: scale(0.96); }

        /* Bento Grid */
        .bento-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
            margin-bottom: 11px;
        }

        .bento-tile {
            min-width: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 15px;
            padding: 11px 12px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            text-align: left;
        }

        .bento-label {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .bento-val {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bento-sub {
            font-size: 0.68rem;
            color: var(--text-secondary);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .panel-card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 17px;
            padding: 13px 14px;
            margin-bottom: 11px;
            box-shadow: var(--shadow-card);
        }

        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .panel-title { font-size: 0.85rem; font-weight: 800; color: var(--text-primary); min-width: 0; }
        .panel-link { font-size: 0.74rem; font-weight: 700; color: var(--accent); cursor: pointer; white-space: nowrap; flex-shrink: 0; }

        /* 單日分頁導覽條（滿版不透明背景，緊貼 Topbar，絕不漏出背後卡片） */
        .day-tab-strip {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .day-tab-strip::-webkit-scrollbar { display: none; }

        .day-tab-strip.is-sticky {
            position: sticky;
            top: calc(var(--topbar-total) - 1px);
            z-index: 100;
            margin: 0 -14px 10px;
            padding: 8px 14px 9px;
            background: var(--bg-app);
            border-bottom: 1px solid var(--border-subtle);
        }

        .day-tab-btn {
            flex: 0 0 auto;
            min-width: 60px;
            padding: 6px 10px;
            border-radius: 13px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            text-align: center;
            cursor: pointer;
        }

        .day-tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .dp-day { font-family: 'Inter', sans-serif; font-size: 0.76rem; font-weight: 900; display: block; line-height: 1.2; }
        .dp-date { font-size: 0.62rem; opacity: 0.88; display: block; margin-top: 1px; }

        .day-page { display: none; width: 100%; }
        .day-page.active { display: block; animation: viewFade 0.16s ease; }

        .day-hero-card {
            width: 100%;
            background: var(--hero-grad);
            border: 1px solid var(--border-strong);
            border-radius: 17px;
            padding: 14px 15px;
            margin-bottom: 11px;
            box-shadow: var(--shadow-card);
        }

        .day-hero-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 5px;
        }

        .day-kicker {
            font-family: 'Inter', sans-serif;
            font-size: 0.71rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 0.4px;
        }

        .day-weather-pill {
            font-size: 0.69rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .day-card-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.1rem;
            font-weight: 900;
            margin: 0;
            color: var(--text-primary);
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .day-card-sub {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 4px;
            overflow-wrap: anywhere;
        }

        .day-stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 9px;
            padding-top: 9px;
            border-top: 1px dashed var(--border-subtle);
        }

        .callout-box {
            width: 100%;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.79rem;
            margin-bottom: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            overflow-wrap: anywhere;
        }
        .callout-alert { background: var(--danger-soft); border-color: rgba(248, 113, 113, 0.3); color: var(--text-primary); }
        .callout-story { font-family: 'Noto Serif TC', serif; border-left: 3px solid var(--accent); line-height: 1.65; }

        /* ================= 行程時間軸（滿寬零浪費、無套殼高可讀設計） ================= */
        .day-jump-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 9px;
            padding-top: 9px;
            border-top: 1px dashed var(--border-subtle);
            align-items: center;
            justify-content: space-between;
        }
        .day-stats-inline {
            font-size: 0.73rem;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .day-jump-link {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--accent);
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            white-space: nowrap;
        }

        .day-alert-strip {
            width: 100%;
            background: var(--danger-soft);
            border-left: 3px solid var(--danger);
            border-radius: 10px;
            padding: 10px 13px;
            margin-bottom: 12px;
            font-size: 0.82rem;
            color: var(--text-primary);
            line-height: 1.62;
            overflow-wrap: anywhere;
        }
        .day-alert-label {
            font-size: 0.7rem;
            font-weight: 900;
            color: var(--danger);
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .mode-switch-btn {
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
        }
        .mode-switch-btn.active {
            background: var(--accent-soft);
            border-color: transparent;
            color: var(--accent);
        }

        /* 滿寬行程卡片：100% 寬度，無左側浪費欄位 */
        .sched-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }
        .sched-card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-left: 3px solid var(--accent);
            border-radius: 14px;
            padding: 13px 14px;
            box-shadow: var(--shadow-card);
        }
        .sched-card.kind-move {
            background: var(--bg-card-alt);
            border-left-color: var(--sky);
        }
        .sched-card.kind-stay {
            border-left-color: var(--emerald);
        }

        .sched-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }
        .sched-time-meta {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 8px;
            min-width: 0;
            flex: 1;
        }
        .sched-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--accent);
            white-space: nowrap;
        }
        .sched-card.kind-move .sched-time { color: var(--sky); }
        .sched-card.kind-stay .sched-time { color: var(--emerald); }

        .sched-submeta {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            overflow-wrap: anywhere;
        }

        .sched-kicker {
            font-size: 0.71rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 2px;
            line-height: 1.3;
        }
        .sched-title {
            font-size: 0.98rem;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.38;
            letter-spacing: 0.01em;
            overflow-wrap: anywhere;
        }
        .sched-desc {
            margin-top: 7px;
            font-size: 0.84rem;
            color: var(--text-secondary);
            line-height: 1.68;
            letter-spacing: 0.01em;
            overflow-wrap: anywhere;
        }
        .sched-desc p {
            margin: 0 0 6px;
        }
        .sched-desc p:last-child { margin-bottom: 0; }

        /* 精簡時間表模式（一屏掃完整天節奏） */
        .sched-list.is-compact {
            gap: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }
        .sched-compact-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 14px;
            border-bottom: 1px solid var(--border-subtle);
            border-left: 3px solid var(--accent);
        }
        .sched-compact-row:last-child { border-bottom: none; }
        .sched-compact-row.kind-move { border-left-color: var(--sky); background: var(--bg-card-alt); }
        .sched-compact-row.kind-stay { border-left-color: var(--emerald); }
        .sched-compact-left {
            min-width: 0;
            flex: 1;
        }
        .sched-compact-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .sched-compact-title {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        /* 當日備忘區塊（置於時間軸下方，扁平單層分隔線，絕不套殼） */
        .day-notes-card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        .day-note-section {
            padding: 13px 15px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .day-note-section:last-child { border-bottom: none; }
        .day-note-label {
            font-size: 0.74rem;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }
        .day-note-body {
            font-size: 0.83rem;
            color: var(--text-secondary);
            line-height: 1.68;
            overflow-wrap: anywhere;
        }
        .day-note-body.is-serif {
            font-family: 'Noto Serif TC', serif;
        }
        .day-note-kv {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 12px;
            margin-top: 4px;
        }

        .slot-time { font-family: 'JetBrains Mono', monospace; font-size: 0.77rem; font-weight: 800; color: var(--accent); }
        .pill-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 5px; }
        .mini-pill { font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--bg-card-alt); border: 1px solid var(--border-subtle); color: var(--text-secondary); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mini-pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
        .mini-pill.sky { background: var(--sky-soft); color: var(--sky); border-color: transparent; }
        .mini-pill.green { background: var(--emerald-soft); color: var(--emerald); border-color: transparent; }

        .map-chip {
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-primary);
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            padding: 4px 9px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .map-chip:active { transform: scale(0.95); }

        .day-pager {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-top: 6px;
        }
        .pager-btn {
            min-width: 0;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 10px 10px;
            font-size: 0.77rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: var(--shadow-card);
        }
        .pager-btn:disabled { opacity: 0.35; cursor: default; }

        .overview-card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 15px;
            padding: 12px 13px;
            margin-bottom: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: var(--shadow-card);
        }

        /* ================= 探索指南（扁平單層雜誌列表＋豐富資訊欄位，零嵌套、滿寬閱讀） ================= */
        .search-input {
            width: 100%;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 9px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 8px;
            outline: none;
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

        .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 7px; margin-bottom: 2px; scrollbar-width: none; }
        .filter-row::-webkit-scrollbar { display: none; }
        .filter-chip { border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text-secondary); font-size: 0.72rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #ffffff; }

        .guide-group {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        .guide-group-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background: var(--bg-card-alt);
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--text-secondary);
            letter-spacing: 0.4px;
        }
        .guide-item {
            padding: 14px 15px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .guide-item:last-child { border-bottom: none; }

        .guide-head-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }
        .guide-title-wrap {
            min-width: 0;
            flex: 1;
        }
        .guide-actions {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .fav-btn {
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-alt);
            color: var(--text-muted);
            width: 28px;
            height: 26px;
            border-radius: 999px;
            font-size: 0.78rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: all 0.14s ease;
        }
        .fav-btn.active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }
        .fav-btn:active { transform: scale(0.92); }

        .guide-idx {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.76rem;
            font-weight: 800;
            color: var(--accent);
            margin-right: 6px;
        }
        .guide-name {
            font-size: 0.98rem;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.35;
            overflow-wrap: anywhere;
        }
        .guide-meta-line {
            margin-top: 3px;
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* 扁平 2 欄實戰資訊列（無框套框，滿寬高資訊密度） */
        .guide-facts {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px 12px;
            margin-top: 9px;
            padding: 8px 0;
            border-top: 1px dashed var(--border-subtle);
            border-bottom: 1px dashed var(--border-subtle);
        }
        .guide-fact {
            min-width: 0;
            font-size: 0.75rem;
            line-height: 1.42;
            color: var(--text-secondary);
            overflow-wrap: anywhere;
        }
        .guide-fact.full {
            grid-column: 1 / -1;
        }
        .guide-fact-k {
            font-size: 0.67rem;
            font-weight: 800;
            color: var(--text-muted);
            display: block;
            margin-bottom: 1px;
        }
        .guide-fact-v {
            font-weight: 700;
            color: var(--text-primary);
        }

        .guide-highlight {
            margin-top: 9px;
            font-size: 0.83rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.5;
            overflow-wrap: anywhere;
        }
        .guide-desc {
            margin-top: 6px;
            font-size: 0.84rem;
            color: var(--text-secondary);
            line-height: 1.68;
            letter-spacing: 0.01em;
            overflow-wrap: anywhere;
        }
        .guide-notes {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .guide-note-line {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.56;
            padding-left: 9px;
            border-left: 2px solid var(--border-strong);
            overflow-wrap: anywhere;
        }
        .guide-note-line.photo { border-left-color: var(--sky); }
        .guide-note-line.goshuin { border-left-color: var(--emerald); }
        .guide-note-line.tip { border-left-color: var(--accent); }
        .guide-note-tag {
            font-weight: 800;
            color: var(--text-primary);
            margin-right: 4px;
        }

        .guide-tags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 9px;
        }
        .guide-tag-pill {
            font-size: 0.67rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            background: var(--bg-card-alt);
            color: var(--text-secondary);
            white-space: nowrap;
        }

        /* ================= 精品級工具箱 / 預算帳本 / 住宿 / 探索 / 應變 視覺系統 ================= */
        .section-kicker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 2px 2px 8px;
            margin-top: 2px;
        }
        .section-kicker-title {
            font-size: 0.74rem;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }
        .section-kicker-meta {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* 1. 匯率換算器（Revolut 雙槽卡片風格） */
        .fx-card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-card);
        }
        .fx-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 11px;
        }
        .fx-rate-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.67rem;
            font-weight: 700;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 3px 8px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .fx-well {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .fx-well:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .fx-cur-select {
            appearance: none;
            -webkit-appearance: none;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 7px 26px 7px 10px;
            font-size: 0.84rem;
            font-weight: 800;
            flex-shrink: 0;
            cursor: pointer;
            background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
            background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
        }
        .fx-num-input {
            width: 100%;
            min-width: 0;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.38rem;
            font-weight: 800;
            text-align: right;
            outline: none;
            padding: 2px 0;
        }
        .fx-num-input::placeholder {
            color: var(--text-muted);
            opacity: 0.55;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .quick-add-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 6px;
            margin: 10px 0;
        }
        .step-btn {
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-alt);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.71rem;
            font-weight: 700;
            padding: 7px 2px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }
        .step-btn:active { transform: scale(0.95); }
        .step-btn.clear {
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--danger);
            background: var(--danger-soft);
            border-color: transparent;
        }
        .fx-output-well {
            background: var(--hero-grad);
            border: 1px solid var(--border-strong);
            border-radius: 14px;
            padding: 11px 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .fx-twd-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .fx-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.32rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.3px;
            white-space: nowrap;
        }

        /* 2. 預算參考（無嵌套卡＋智能金額總覽＋帳本列表） */
        .budget-hero-card {
            width: 100%;
            background: var(--hero-grad);
            border: 1px solid var(--border-strong);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
        }
        .budget-hero-kicker {
            font-size: 0.66rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .budget-hero-total {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(1.32rem, 5.6vw, 1.62rem);
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .budget-hero-twd {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-top: 3px;
        }
        .budget-bar-track {
            display: flex;
            width: 100%;
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            gap: 2px;
            background: var(--bg-card-alt);
            margin: 12px 0 9px;
        }
        .budget-bar-seg {
            height: 100%;
            border-radius: 999px;
            min-width: 8px;
        }
        .budget-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .budget-legend-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.71rem;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .budget-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* 6 位數 PIN 鎖屏（讀取 secure_data.js 解密） */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-app);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
        }

        .pin-dots { display: flex; gap: 15px; margin-bottom: 26px; }
        .pin-dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--text-muted); transition: all 0.15s ease; }
        .pin-dot.filled { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
        .pin-dot.error { background: var(--danger); border-color: var(--danger); }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 264px; }
        .key-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);

            font-size: 1.45rem;
            font-weight: 700;

            align-items: center;
            justify-content: center;
            cursor: pointer;

            -webkit-user-select: none;
        }

        .key-btn.empty, .key-btn.del { background: transparent; border-color: transparent; color: var(--text-secondary); }

        @keyframes shake {

            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }

        .shake { animation: shake 0.35s ease; }

        /* ================= iOS 原生 App 質感升級（毛玻璃 Dock・觸覺按壓・滑動翻日・Bottom Sheet・Toast） ================= */
        :root,
        :root[data-theme="dark"] {
            --bg-dock-glass: rgba(14, 18, 25, 0.86);
            --sheet-bg: #151a24;
            --sheet-backdrop: rgba(0, 0, 0, 0.62);
        }
        :root[data-theme="paper"] {
            --bg-dock-glass: rgba(255, 255, 255, 0.88);
            --sheet-bg: #fcfaf6;
            --sheet-backdrop: rgba(38, 32, 25, 0.42);
        }

        html, body {
            overscroll-behavior-y: contain;
        }

        /* 系統導覽元件禁止長按反白選字，保留內文可複製 */
        .app-topbar, .bottom-dock, .day-tab-strip, .sticky-subbar-wrap,
        .b-tab, .seg-btn, .filter-chip, .pager-btn, .cta-btn, .icon-pill-btn,
        .mode-switch-btn, .fav-btn, .map-chip, .step-btn, .chk-filter-btn {
            -webkit-user-select: none;
            user-select: none;
        }

        .bottom-dock {
            background: var(--bg-dock-glass);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
        }

        /* 原生 Spring 觸覺按壓微縮 */
        .sched-card, .sched-compact-row, .guide-item, .bento-tile,
        .overview-card, .stay-card, .flighty-card {
            transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.16s ease;
        }
        .sched-card:active, .sched-compact-row:active, .guide-item:active,
        .bento-tile:active, .overview-card:active, .flighty-card:active {
            transform: scale(0.986);
        }
        .sched-card, .sched-compact-row, .guide-item {
            cursor: pointer;
        }

        /* 單日滑動切換方向動畫 */
        @keyframes slideFromRight {
            from { opacity: 0.35; transform: translateX(22px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideFromLeft {
            from { opacity: 0.35; transform: translateX(-22px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .day-page.slide-next { animation: slideFromRight 0.22s cubic-bezier(0.22, 1, 0.36, 1); }
        .day-page.slide-prev { animation: slideFromLeft 0.22s cubic-bezier(0.22, 1, 0.36, 1); }

        /* 看板「下一站」快捷條 */

        .ios-toast {
            position: fixed;
            top: calc(var(--topbar-total) + 10px);
            left: 50%;
            transform: translate(-50%, -18px) scale(0.94);
            opacity: 0;
            pointer-events: none;
            z-index: 9500;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-strong);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.42);
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 0.78rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: calc(100vw - 32px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .ios-toast.show {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
        }

        /* iOS 原生 Bottom Sheet 底部抽屜 */
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            background: var(--sheet-backdrop);
            backdrop-filter: blur(4px);

        .native-sheet {

            bottom: 0;

            display: flex;

            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        }
        .native-sheet.open {
            transform: translate(-50%, 0);
        }
        .sheet-grabber-zone {
            padding: 10px 0 6px;

            justify-content: center;
            cursor: grab;
            flex-shrink: 0;
        }
        .sheet-grabber {

        }
        .sheet-scroll-body {

        }
        .sheet-kicker {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .sheet-title {
            font-family: 'Noto Serif TC', serif;

        .sheet-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.68;
            margin-bottom: 12px;

        }
        .sheet-actions-grid {

        }
        .sheet-action-btn {

            justify-content: center;

            font-size: 0.86rem;
        }
        .sheet-action-btn:active {
            transform: scale(0.97);
        }

    </style>
</head>

<script>

    function applySavedTheme() {
        const saved = localStorage.getItem('trip_ui_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        const metaTheme = document.getElementById('meta-theme-color');
        if (metaTheme) metaTheme.setAttribute('content', saved === 'dark' ? '#090b0e' : '#f8f5ef');
        const btn = document.getElementById('theme-toggle-btn');
        if (btn) btn.innerText = saved === 'dark' ? '☀️ 米色' : '🌙 暗黑';
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'paper' : 'dark';
        localStorage.setItem('trip_ui_theme', next);
        applySavedTheme();
    }

    applySavedTheme();

    let globalData = null;
    let tripDiffDays = 0;
    let activeDayNum = null;
    let itineraryOverviewMode = false;
    let poiAreaFilter = '全部地區';
    let poiCategoryFilter = '全部';
    const offlineRates = { isk: 0.235, eur: 34.80, gbp: 40.50, jpy: 0.207, usd: 32.50, thb: 0.90, idr: 0.002, myr: 6.80, sgd: 23.80 };
    let currentRate = 0;
    let currentMainTab = 'dashboard';
    let checkedItems = JSON.parse(localStorage.getItem('tripChecklist_v9')) || [];
    let liveWeatherCache = {};

    const TAB_TITLES = {
        dashboard: '旅程看板',
        itinerary: '每日行程',
        flights: '航班與住宿',
        explore: '探索絕景與美食',
        tools: '隨身工具箱'
    };

    const SUB_TO_PARENT = {
        theme: 'explore', poi: 'explore',
        money: 'tools', checklist: 'tools', logistics: 'tools', emergency: 'tools'
    };

    function getLocalTodayIso() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function scrollAppToTop(smooth = false) {
        setAppScrollTop(0, smooth);
    }

    function bootSystem() {
        const sub = (globalData.trip_meta && globalData.trip_meta.subtitle) || 'TRAVEL COMPASS';
        document.getElementById('meta-sub').innerText = sub;

        const days = globalData.itinerary || [];
        if (days.length > 0 && (!activeDayNum || !days.some(d => d.day === activeDayNum))) {
            activeDayNum = days[0].day;
        }

        calculateDiff();
        renderItinerary(days);
        renderFlights(globalData.flights_and_hotels || { flights: [], hotels: [] });
        enrichAllFlightsWithAdsbdb(false);
        fetchWeather();
        renderLogistics(globalData.logistics || { items: [], alerts: [] });
        renderBudget(globalData.budget || { regions: [] });
        renderTheme(globalData.theme_guide || []);
        initPOI(globalData.poi_database || []);
        renderChecklist(globalData.checklist_items || []);
        renderEmergency(globalData.emergency || { guides: [] });
        initCurrencyWidget((globalData.trip_meta && globalData.trip_meta.currency) || 'jpy');
        updateTopbarContext(currentMainTab);
    }

    function switchTab(id) {
        if (SUB_TO_PARENT[id]) {
            const parent = SUB_TO_PARENT[id];
            switchTab(parent);
            switchSubPane(parent, id);
            return;
        }
        hapticTick(6);
        if (currentMainTab === id) {
            scrollAppToTop(true);
            return;
        }
        tabScrollMemory[currentMainTab] = getAppScrollTop();
        currentMainTab = id;
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.b-tab').forEach(b => b.classList.remove('active'));
        const targetView = document.getElementById(id);
        if (targetView) targetView.classList.add('active');
        const targetBtn = document.querySelector(`.b-tab[data-tab="${id}"]`);
        if (targetBtn) targetBtn.classList.add('active');
        updateTopbarContext(id);
        setAppScrollTop(tabScrollMemory[id] || 0, false);
    }

    function switchSubPane(parentId, paneId) {
        const parentEl = document.getElementById(parentId);
        if (!parentEl) return;
        parentEl.querySelectorAll('.sub-pane').forEach(p => p.classList.remove('active'));
        parentEl.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        const targetPane = document.getElementById(paneId);
        const targetSeg = document.getElementById(`seg-${paneId}`);
        if (targetPane) targetPane.classList.add('active');
        if (targetSeg) targetSeg.classList.add('active');
        scrollAppToTop();
    }

    function selectDayTab(dayNum, slideDir = '') {
        const prevNum = Number(activeDayNum);
        const dir = slideDir || (Number(dayNum) > prevNum ? 'next' : (Number(dayNum) < prevNum ? 'prev' : ''));
        activeDayNum = dayNum;
        hapticTick(8);
        const needRerender = itineraryOverviewMode || !document.querySelector('#itinerary .day-page');
        itineraryOverviewMode = false;
        if (needRerender) {
            renderItinerary((globalData && globalData.itinerary) || []);
        } else {
            document.querySelectorAll('#itinerary .day-tab-btn').forEach(btn => {
                btn.classList.toggle('active', Number(btn.dataset.day) === Number(dayNum));
            });
            document.querySelectorAll('#itinerary .day-page').forEach(page => {
                const isTarget = Number(page.dataset.day) === Number(dayNum);
                page.classList.remove('slide-next', 'slide-prev');
                page.classList.toggle('active', isTarget);
                if (isTarget && dir) {
                    void page.offsetWidth;
                    page.classList.add(dir === 'next' ? 'slide-next' : 'slide-prev');
                }
            });
        }
        updateTopbarContext('itinerary');

        const activeBtn = document.querySelector(`#itinerary .day-tab-btn[data-day="${dayNum}"]`);
        if (activeBtn) {
            activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
        tabScrollMemory.itinerary = 0;
        scrollAppToTop();
    }

    function calculateDiff() {
        if (!globalData.itinerary || globalData.itinerary.length === 0) {
            document.getElementById('dashboard').innerHTML = '<div class="panel-card">尚未建立行程資料。</div>';
            return;
        }
        const rawDate = globalData.itinerary[0].date_full;
        if (rawDate) {
            const parts = String(rawDate).split('-').map(Number);
            if (parts.length === 3 && !parts.some(isNaN)) {
                const start = new Date(parts[0], parts[1] - 1, parts[2]);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                tripDiffDays = Math.ceil((start - today) / (1000 * 60 * 60 * 24));
            } else {
                tripDiffDays = 0;
            }
        } else {
            tripDiffDays = 0;
        }
        renderDashboard();
    }

    function getFocusDay() {
        const days = (globalData && globalData.itinerary) || [];
        if (!days.length) return null;
        if (tripDiffDays > 0) return days[0];
        const todayStr = getLocalTodayIso();
        return days.find(d => d.date_full === todayStr) || days[days.length - 1];
    }

    function getChecklistPct() {
        const items = (globalData && globalData.checklist_items) || [];
        if (items.length === 0) return '0%';
        const validChecked = checkedItems.filter(i => items.includes(i)).length;
        return Math.round((validChecked / items.length) * 100) + '%';
    }

    /* ================= Open-Meteo 即時天氣 ================= */
    function fetchWeather() {
        const days = (globalData && globalData.itinerary) || [];
        const focusDay = getFocusDay();
        days.forEach(d => {
            if (!d.coords || !d.date_full) return;
            const parts = String(d.coords).split(',');
            if (parts.length < 2) return;
            const lat = parts[0].trim();
            const lon = parts[1].trim();
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`)
                .then(r => r.json())
                .then(data => {
                    if (!data.daily || !data.daily.time) return;
                    const idx = data.daily.time.indexOf(d.date_full);
                    if (idx === -1) return;
                    const code = data.daily.weathercode[idx];
                    const tMax = Math.round(data.daily.temperature_2m_max[idx]);
                    const tMin = Math.round(data.daily.temperature_2m_min[idx]);

                    let emoji = '☁️';
                    if (code === 0) emoji = '☀️';
                    else if (code >= 1 && code <= 3) emoji = '⛅';
                    else if (code >= 45 && code <= 48) emoji = '🌫️';
                    else if (code >= 51 && code <= 67) emoji = '🌧️';
                    else if (code >= 71 && code <= 82) emoji = '❄️';
                    else if (code >= 95) emoji = '⛈️';

                    const tempStr = `${emoji} ${tMin}°~${tMax}°C`;
                    liveWeatherCache[d.day] = tempStr;

                    const dayPill = document.getElementById(`weather-day-${d.day}`);
                    if (dayPill) dayPill.innerText = tempStr;

                    if (focusDay && d.day === focusDay.day) {
                        const dashEl = document.getElementById('dash-weather');
                        if (dashEl) dashEl.innerText = tempStr;
                    }
                })
                .catch(() => {});
        });
    }

    const ADSBDB_CACHE_KEY = 'adsbdb_flight_cache_v3';

        adsbdbMemoryCache = {};

            return JSON.parse(localStorage.getItem(LIVE_API_CONFIG_KEY) || '{}') || {};

            return {};

    }

        try { localStorage.setItem(LIVE_API_CONFIG_KEY, JSON.stringify(cfg)); } catch (e) {}

    function saveAdsbdbCache() {
        try { localStorage.setItem(ADSBDB_CACHE_KEY, JSON.stringify(adsbdbMemoryCache)); } catch (e) {}
    }

    function saveLiveSchedCache() {
        try { localStorage.setItem(LIVE_SCHED_CACHE_KEY, JSON.stringify(liveSchedMemoryCache)); } catch (e) {}
    }

    function sanitizeCallsign(raw) {
        return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '').trim();
    }

    function extractRegOrHex(f) {
        if (f.aircraft_reg) return sanitizeCallsign(f.aircraft_reg);
        if (f.reg) return sanitizeCallsign(f.reg);
        if (f.icao24) return sanitizeCallsign(f.icao24);
        const note = String(f.note || '').toUpperCase();
        const regMatch = note.match(/\b([A-Z]{1,2}-[A-Z0-9]{3,5}|JA[0-9]{3,4}[A-Z]{0,2}|HL[0-9]{4}|N[0-9]{1,5}[A-Z]{0,2})\b/);
        return regMatch ? regMatch[1] : '';
    }
